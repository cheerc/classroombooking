<script>
function createHistoryModule(app) {
  const elements = AppElements; // Shortcut to elements

  // --- Private State ---
  let history = [];
  let historyIndex = -1;
  let cleanStateSnapshot = '';

  // --- Private Methods ---

  function getCurrentState() {
    return {
      classrooms: structuredClone(app.classrooms),
      scheduleData: structuredClone(app.scheduleData),
      tags: structuredClone(app.tags)
    };
  }

  // --- Public Methods ---

  return {
    saveState: function() {
        const currentState = getCurrentState();
        // Do not save if the state is identical to the last one in history.
        if (history.length > 0 && JSON.stringify(currentState) === JSON.stringify(history[historyIndex])) {
            return;
        }

        history = history.slice(0, historyIndex + 1);
        history.push(currentState);
        historyIndex = history.length - 1;
        if (history.length > 50) { 
            history.shift(); 
            historyIndex--; 
        }
        this.updateUndoRedoButtons();
        this.checkDirty();
    },

    resetHistory: function() {
        const initialState = getCurrentState();
        history = [initialState];
        historyIndex = 0;
        this.updateUndoRedoButtons();
        this.updateCleanSnapshot();
        this.checkDirty();
    },

    undo: function() {
        if (historyIndex > 0) {
            historyIndex--;
            this.loadState(history[historyIndex]);
        }
    },

    redo: function() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            this.loadState(history[historyIndex]);
        }
    },

    loadState: function(state) {
        app.classrooms = structuredClone(state.classrooms);
        app.scheduleData = structuredClone(state.scheduleData);
        app.tags = structuredClone(state.tags);
        
        // These methods still live on the main app object
        app.ui.updateClassroomList();
        app.ui.renderScheduleTable();

        this.updateUndoRedoButtons();
        this.checkDirty();
    },

    updateUndoRedoButtons: function() {
        elements.undoBtn.disabled = historyIndex <= 0;
        elements.redoBtn.disabled = historyIndex >= history.length - 1;
    },

    updateCleanSnapshot: function() {
        cleanStateSnapshot = JSON.stringify({
            classrooms: app.classrooms,
            scheduleData: app.scheduleData,
            tags: app.tags
        });
        if (app.schedules[app.activeScheduleId]) {
            app.schedules[app.activeScheduleId].data = {
                classrooms: structuredClone(app.classrooms),
                scheduleData: structuredClone(app.scheduleData),
                tags: structuredClone(app.tags)
            };
            app.saveSchedulesToLocal();
        }
    },

    checkDirty: function() {
        const currentStateSnapshot = JSON.stringify({
            classrooms: app.classrooms,
            scheduleData: app.scheduleData,
            tags: app.tags
        });
        this.setDirty(currentStateSnapshot !== cleanStateSnapshot);
    },

    setDirty: function(isDirty) {
        if (app.isDirty === isDirty) return;
        app.isDirty = isDirty;
        const saveBtn = elements.saveToCloudBtn;
        if (isDirty) {
            saveBtn.classList.add('animate-pulse');
            app.ui.updateSyncStatus(AppConfig.STATUS.DIRTY);
        } else {
            saveBtn.classList.remove('animate-pulse');
            app.ui.updateSyncStatus(AppConfig.STATUS.SYNCED);
        }
    }
  };
}
</script>
