<script>
// Ref: #4 — Global HTML escape utility to prevent stored XSS via innerHTML interpolation.
// Escapes the 5 critical characters: & < > " '
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function createModalModule(app) {
  const elements = AppElements; // Shortcut to elements

  // --- Private Methods ---

  /**
   * Generic function to show a modal and handle its lifecycle.
   * @private
   */
  function showModal(config) {
    return new Promise((resolve) => {
        const { modal, textElement, inputElement, okButton, cancelButton, message, defaultValue, isAlert } = config;

        if (textElement) {
            textElement.innerHTML = message;
        }
        if (inputElement) {
            inputElement.value = defaultValue;
            inputElement.focus();
            inputElement.select();
        }
        if (cancelButton) {
            cancelButton.style.display = isAlert ? 'none' : 'inline-block';
        }

        modal.style.display = 'flex';

        const cleanup = () => {
            okButton.removeEventListener('click', okHandler);
            if (cancelButton) cancelButton.removeEventListener('click', cancelHandler);
            if (inputElement) inputElement.removeEventListener('keydown', keydownHandler);
            modal.style.display = 'none';
        };

        const okHandler = () => {
            cleanup();
            resolve(inputElement ? inputElement.value : true);
        };

        const cancelHandler = () => {
            cleanup();
            resolve(inputElement ? null : false);
        };

        const keydownHandler = (e) => {
            if (e.key === 'Enter') okHandler();
            else if (e.key === 'Escape') cancelHandler();
        };

        okButton.addEventListener('click', okHandler, { once: true });
        if (cancelButton) cancelButton.addEventListener('click', cancelHandler, { once: true });
        if (inputElement) inputElement.addEventListener('keydown', keydownHandler);
    });
  }

  // --- Public Methods ---

  return {
    /**
     * Sets up standard event listeners for a modal (trigger, close button, overlay click).
     */
    setupModalListeners: function(triggerBtn, modal, closeBtn, onOpen) {
        if (!modal || !closeBtn) return;
        
        const openModal = () => {
            let shouldOpen = true;
            if (onOpen) {
                // Only prevent opening if the onOpen function explicitly returns false.
                if (onOpen() === false) {
                    shouldOpen = false;
                }
            }
            if (shouldOpen) {
                modal.style.display = 'flex';
            }
        }
        const closeModal = () => modal.style.display = 'none';

        if (triggerBtn) {
            triggerBtn.addEventListener('click', openModal);
        }
        
        closeBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    },

    /**
     * Shows a confirmation dialog.
     */
    showConfirm: function(message, isAlert = false) {
        return showModal({
            modal: elements.confirmModal,
            textElement: elements.confirmText,
            okButton: elements.confirmOk,
            cancelButton: elements.confirmCancel,
            message: message,
            isAlert: isAlert
        });
    },

    /**
     * Shows a prompt dialog with a text input.
     */
    showPrompt: function(message, defaultValue = '') {
        return showModal({
            modal: elements.promptModal,
            textElement: elements.promptText,
            inputElement: elements.promptInput,
            okButton: elements.promptOk,
            cancelButton: elements.promptCancel,
            message: message,
            defaultValue: defaultValue
        });
    },

    showAlert: function(message) {
        return this.showConfirm(message, true);
    },

    showScheduleEditor: function(options = {}) {
        return new Promise((resolve) => {
            const { id = null, name = '', isDraft = false, isNew = false } = options;
            const els = AppElements;

            els.scheduleEditModalTitle.textContent = isNew ? '新增課表' : '編輯課表';
            els.scheduleEditId.value = id;
            els.scheduleEditName.value = name;
            els.scheduleEditIsDraft.checked = isDraft;

            els.scheduleEditModal.style.display = 'flex';
            els.scheduleEditName.focus();
            els.scheduleEditName.select();

            const cleanup = () => {
                els.scheduleEditSave.removeEventListener('click', saveHandler);
                els.scheduleEditCancel.removeEventListener('click', cancelHandler);
                els.scheduleEditModalClose.removeEventListener('click', cancelHandler);
                els.scheduleEditModal.removeEventListener('click', overlayClickHandler);
                els.scheduleEditModal.style.display = 'none';
            };

            const saveHandler = () => {
                const newName = els.scheduleEditName.value.trim();
                if (!newName) {
                    app.ui.showNotification('課表名稱不能為空！', 'error');
                    return;
                }
                cleanup();
                resolve({
                    id: id,
                    name: newName,
                    isDraft: els.scheduleEditIsDraft.checked
                });
            };

            const cancelHandler = () => {
                cleanup();
                resolve(null);
            };

            const overlayClickHandler = (e) => {
                if (e.target === els.scheduleEditModal) {
                    cancelHandler();
                }
            };

            els.scheduleEditSave.addEventListener('click', saveHandler, { once: true });
            els.scheduleEditCancel.addEventListener('click', cancelHandler, { once: true });
            els.scheduleEditModalClose.addEventListener('click', cancelHandler, { once: true });
            els.scheduleEditModal.addEventListener('click', overlayClickHandler);
        });
    },

    /**
     * Shows the PDF options modal.
     */
    showPdfOptions: function() {
        return new Promise((resolve) => {
            const modal = elements.pdfOptionsModal;
            const confirmBtn = elements.pdfOptionsConfirm;
            const cancelBtn = elements.pdfOptionsCancel;
            const closeBtn = elements.pdfOptionsModalClose;
            const paperSizeSelect = elements.pdfPaperSize;

            modal.style.display = 'flex';

            const cleanup = () => {
                confirmBtn.removeEventListener('click', confirmHandler);
                cancelBtn.removeEventListener('click', cancelHandler);
                closeBtn.removeEventListener('click', cancelHandler);
                modal.removeEventListener('click', overlayClickHandler);
                modal.style.display = 'none';
            };

            const confirmHandler = () => {
                const orientationInput = modal.querySelector('input[name="pdfOrientation"]:checked');
                const includeEmptyCheckbox = document.getElementById('pdf-include-empty');
                const customTitle = elements.pdfCustomTitle.value.trim();

                const options = {
                    orientation: orientationInput ? orientationInput.value : 'portrait',
                    format: paperSizeSelect.value,
                    includeEmpty: includeEmptyCheckbox ? includeEmptyCheckbox.checked : false,
                    customTitle: customTitle
                };
                
                // Clear the input for next time
                elements.pdfCustomTitle.value = '';

                cleanup();
                resolve(options);
            };

            const cancelHandler = () => {
                cleanup();
                resolve(null); // Resolve with null if cancelled
            };
            
            const overlayClickHandler = (e) => {
                if (e.target === modal) {
                    cancelHandler();
                }
            };

            confirmBtn.addEventListener('click', confirmHandler, { once: true });
            cancelBtn.addEventListener('click', cancelHandler, { once: true });
            closeBtn.addEventListener('click', cancelHandler, { once: true });
            modal.addEventListener('click', overlayClickHandler);
        });
    },

    /**
     * Populates the filter modal with checkboxes based on the selected filter type.
     */
    populateFilterModal: function() {
        const filterType = elements.filterTypeSelector.querySelector('input[name="filterType"]:checked').value;
        const items = new Set();
        let title = '請選擇要顯示的項目';

        // 1. Populate the search input for course names
        const searchContainer = elements.filterSearchContainer;
        if (filterType === 'name') {
            searchContainer.style.display = 'block';
            if (!searchContainer.querySelector('#filter-search-input')) {
                searchContainer.innerHTML = `
                    <input type="text" id="filter-search-input" placeholder="在此搜尋以快速勾選..." class="filter-search-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                `;
                searchContainer.querySelector('#filter-search-input').addEventListener('input', (e) => {
                    const searchText = e.target.value.toLowerCase().trim();
                    elements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                        const courseName = cb.value.toLowerCase();
                        cb.checked = searchText ? courseName.includes(searchText) : false;
                    });
                });
            }
        } else {
            searchContainer.style.display = 'none';
        }

        // 2. Gather all items based on filter type and schedule mode
        const isAllSchedules = app.activeScheduleId === AppConfig.ALL_SCHEDULES_ID;

        if (isAllSchedules) {
            // Global mode: Use global getter functions
            let sourceItems = [];
            if (filterType === 'name') {
                title = '請選擇要顯示的課程';
                sourceItems = app.getGlobalAllCourseNames();
            } else if (filterType === 'tag') {
                title = '選擇要顯示的標籤';
                sourceItems = app.getGlobalAllTags();
            } else if (filterType === 'teacher') {
                title = '選擇要顯示的使用人';
                sourceItems = app.getGlobalAllTeachers();
            }
            sourceItems.forEach(item => items.add(item));
        } else {
            // Single schedule mode: Scan the current schedule's data
            const dataToScan = app.filterDataByTags(app.scheduleData);
            Object.values(dataToScan).forEach(classroom => {
                if (typeof classroom !== 'object' || classroom === null) return;
                Object.values(classroom).forEach(day => {
                    if (!Array.isArray(day)) return;
                    day.forEach(course => {
                        if (!course) return;
                        if (filterType === 'name' && course.name) {
                            title = '請選擇要顯示的課程';
                            items.add(course.name);
                        } else if (filterType === 'tag') {
                            title = '選擇要顯示的標籤';
                            (course.tags || []).forEach(tag => {
                                if (tag) items.add(tag);
                            });
                        } else if (filterType === 'teacher') {
                            title = '選擇要顯示的使用人';
                            if (course.teacher) items.add(course.teacher);
                        }
                    });
                });
            });
        }

        // 3. Render the checkbox list
        elements.filterListTitle.textContent = title;
        const sortedItems = Array.from(items).sort();
        const listElement = elements.filterCourseList;
        listElement.innerHTML = '';

        sortedItems.forEach(item => {
            const isChecked = app.activeFilters.some(f => f.value === item && f.type === filterType);
            const div = document.createElement('div');
            div.setAttribute('class', 'flex items-center');
            const safeItem = escapeHtml(item);
            div.innerHTML = `
                <input type="checkbox" id="filter-${safeItem}" value="${safeItem}" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" ${isChecked ? 'checked' : ''}>
                <label for="filter-${safeItem}" class="ml-2 block text-sm text-gray-900 truncate">${safeItem}</label>
            `;
            listElement.appendChild(div);
        });
        
        const searchInput = searchContainer.querySelector('#filter-search-input');
        if (searchInput) searchInput.value = '';
    },

    /**
     * Shows the Copy Course modal.
     * @param {Array} classrooms - List of available classrooms.
     * @param {string} currentClassroom - The current classroom name.
     * @param {number} currentDay - The current day index (0-based, optional).
     * @returns {Promise<object|null>} The selected target classroom and days, or null if cancelled.
     */
    showCopyCourseModal: function(classrooms, currentClassroom, currentDay) {
        return new Promise((resolve) => {
            const els = AppElements;
            const modal = els.copyCourseModal;
            const classroomSelect = els.copyTargetClassroom;
            const daysContainer = els.copyTargetDays;
            
            // Populate Classrooms
            classroomSelect.innerHTML = '';
            classrooms.forEach(c => {
                const option = document.createElement('option');
                option.value = c;
                option.textContent = c;
                if (c === currentClassroom) option.selected = true;
                classroomSelect.appendChild(option);
            });

            // Populate Days
            daysContainer.innerHTML = '';
            AppConfig.WEEKDAYS.forEach((dayName, index) => {
                const wrapper = document.createElement('label');
                wrapper.className = 'flex items-center space-x-2 cursor-pointer p-2 hover:bg-gray-100 rounded';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = index;
                checkbox.className = 'form-checkbox h-5 w-5 text-blue-600';
                
                // If it's the current day, maybe don't check it by default? Or check it?
                // Logic: Usually you copy to *other* days. But copying to *other* classroom on *same* day is also valid.
                // Let's leave them unchecked by default to force user selection, preventing accidental overwrites.
                
                const span = document.createElement('span');
                span.textContent = dayName;
                
                wrapper.appendChild(checkbox);
                wrapper.appendChild(span);
                daysContainer.appendChild(wrapper);
            });

            modal.style.display = 'flex';

            const cleanup = () => {
                els.copyCourseConfirm.removeEventListener('click', confirmHandler);
                els.copyCourseCancel.removeEventListener('click', cancelHandler);
                els.copyCourseModalClose.removeEventListener('click', cancelHandler);
                modal.removeEventListener('click', overlayClickHandler);
                modal.style.display = 'none';
            };

            const confirmHandler = () => {
                const targetClassroom = classroomSelect.value;
                const targetDays = Array.from(daysContainer.querySelectorAll('input:checked')).map(cb => parseInt(cb.value));
                
                if (targetDays.length === 0) {
                    app.ui.showNotification('請至少選擇一個目標星期！', 'error');
                    return;
                }

                cleanup();
                resolve({ targetClassroom, targetDays });
            };

            const cancelHandler = () => {
                cleanup();
                resolve(null);
            };

            const overlayClickHandler = (e) => {
                if (e.target === modal) {
                    cancelHandler();
                }
            };

            els.copyCourseConfirm.addEventListener('click', confirmHandler, { once: true });
            els.copyCourseCancel.addEventListener('click', cancelHandler, { once: true });
            els.copyCourseModalClose.addEventListener('click', cancelHandler, { once: true });
            modal.addEventListener('click', overlayClickHandler);
        });
    }
  };
}
</script>
