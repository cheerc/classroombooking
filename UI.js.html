<script>
function createUIModule(app) {
  const elements = AppElements; // Shortcut to elements
  let activeTooltip = { element: null, hideTimeout: null }; // Make tooltip state accessible within the module

  const uiModule = {
    hideActiveTooltip: function(immediately = true) {
        if (!activeTooltip.element) return;
        clearTimeout(activeTooltip.hideTimeout);
        if (immediately) {
            if (activeTooltip.element.parentElement) {
                activeTooltip.element.remove();
            }
            activeTooltip.element = null;
        } else {
            // Give a small delay for mouse-out events
            activeTooltip.hideTimeout = setTimeout(() => {
                if (activeTooltip.element && activeTooltip.element.parentElement) {
                    activeTooltip.element.remove();
                    activeTooltip.element = null;
                }
            }, 50);
        }
    },

    showLoading: function(message = '載入中，請稍候...') {
        elements.loadingText.textContent = message;
        elements.loadingOverlay.style.display = 'flex';
        if (app.loadingTimeout) clearTimeout(app.loadingTimeout);
        app.loadingTimeout = setTimeout(() => {
            this.hideLoading();
            this.showNotification('載入超時，使用本地數據', 'error');
            app.isConnecting = false;
        }, 30000);
    },

    hideLoading: function() {
        elements.loadingOverlay.style.display = 'none';
        if (app.loadingTimeout) clearTimeout(app.loadingTimeout);
    },

    showNotification: function(message, type = 'success', duration = 3000) {
        const notification = elements.notification;
        notification.innerHTML = message;
        notification.classList.remove('success', 'error', 'info');
        notification.classList.add(type, 'show');
        setTimeout(() => notification.classList.remove('show'), duration);
    },

    initializeTooltips: function() {
        document.querySelectorAll('[data-tooltip]:not([data-tooltip-initialized])').forEach(el => {
            el.setAttribute('data-tooltip-initialized', 'true');

            const showTooltip = () => {
                this.hideActiveTooltip(true); // Hide any existing tooltip immediately

                const tooltipDiv = document.createElement('div');
                tooltipDiv.className = 'fixed bg-gray-800 text-white text-xs rounded py-1 px-2 shadow-lg';
                tooltipDiv.style.zIndex = '1050';
                tooltipDiv.textContent = el.getAttribute('data-tooltip');
                document.body.appendChild(tooltipDiv);
                activeTooltip.element = tooltipDiv;

                const rect = el.getBoundingClientRect();
                const tooltipRect = tooltipDiv.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                let top = rect.top - tooltipRect.height - 5;
                if (left < 5) left = 5;
                if (left + tooltipRect.width > viewportWidth - 5) left = viewportWidth - tooltipRect.width - 5;
                if (top < 5) top = rect.bottom + 5;
                tooltipDiv.style.left = `${left}px`;
                tooltipDiv.style.top = `${top}px`;
            };

            el.addEventListener('mouseenter', showTooltip);
            el.addEventListener('mouseleave', () => this.hideActiveTooltip(false));
            el.addEventListener('click', () => this.hideActiveTooltip(true));
        });
    },

    manageLoadingState: function(state, options = {}) {
        const { success = true, message = '', isConflict = false } = options;

        if (state === 'start') {
            this.showLoading(message);
            this.updateSyncStatus(AppConfig.STATUS.SYNCING);
            [elements.loadFromCloudBtn, elements.saveToCloudBtn].forEach(btn => btn.disabled = true);
        } else if (state === 'end') {
            this.hideLoading();
            [elements.loadFromCloudBtn, elements.saveToCloudBtn].forEach(btn => btn.disabled = false);

            if (success) {
                this.updateSyncStatus(AppConfig.STATUS.SYNCED);
                this.showNotification(message, 'success');
            } else {
                if (isConflict) {
                    this.updateSyncStatus(AppConfig.STATUS.CONFLICT);
                } else {
                    this.updateSyncStatus(AppConfig.STATUS.ERROR);
                    this.showNotification(message, 'error');
                }
            }
        }
    },

    updateSyncStatus: function(status) {
        const els = AppElements;
        let icon = '', text = '', subtext = '', cssClass = '';

        const lastModifiedString = app.lastCloudModifiedTime 
            ? `雲端版本: ${new Date(app.lastCloudModifiedTime).toLocaleString()}`
            : '未曾同步';

        switch (status) {
            case AppConfig.STATUS.SYNCING:
                icon = '🔄'; text = '正在同步...'; subtext = '請稍候...'; cssClass = AppConfig.STATUS.SYNCING;
                break;
            case AppConfig.STATUS.ERROR:
                icon = '❌'; text = '同步失敗'; subtext = '請檢查網路或稍後再試'; cssClass = AppConfig.STATUS.ERROR;
                break;
            case AppConfig.STATUS.CONFLICT:
                icon = '⚠️'; text = '版本衝突'; subtext = '請先讀取雲端資料'; cssClass = AppConfig.STATUS.ERROR; // Use same color for attention
                break;
            case AppConfig.STATUS.DIRTY:
                icon = '⚠️'; text = '有未儲存的變更'; subtext = lastModifiedString; cssClass = AppConfig.STATUS.DIRTY;
                break;
            case AppConfig.STATUS.SYNCED:
            default:
                icon = '✅'; text = '資料已同步'; subtext = lastModifiedString; cssClass = AppConfig.STATUS.SYNCED;
                break;
        }
        els.syncStatus.className = 'sync-status ' + cssClass;
        els.syncStatusText.textContent = `${icon} ${text}`;
        els.lastSyncTimeText.textContent = subtext;
    },

    updateScheduleSelect: function() {
        this.hideActiveTooltip();
        const select = AppElements.scheduleSelect;
        select.innerHTML = '';
        for (const id in app.schedules) {
            const option = document.createElement('option');
            option.value = id;
            option.textContent = app.schedules[id].name;
            select.appendChild(option);
        }
        select.value = app.activeScheduleId;
    },

    renderScheduleList: function() {
        this.hideActiveTooltip();
        const listElement = AppElements.scheduleList;
        listElement.innerHTML = '';
        const currentUser = app.getShortUserName(typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '');
        const isAdmin = currentUser.toLowerCase() === 'cheerc';

        for (const id in app.schedules) {
            const schedule = app.schedules[id];
            const createdBy = app.getShortUserName(schedule.createdBy || '未知');
            const canManage = isAdmin || (currentUser === createdBy);

            const li = document.createElement('li');
            li.className = 'schedule-list-item';
            
            let buttonsHtml = `<button class="copy-schedule-btn text-green-600 hover:text-green-800 text-sm" data-id="${id}">複製</button>`;
            if (canManage) {
                buttonsHtml += `<button class="rename-schedule-btn text-blue-600 hover:text-blue-800 text-sm ml-2" data-id="${id}">重新命名</button>`;
                buttonsHtml += `<button class="delete-schedule-btn text-red-600 hover:text-red-800 text-sm ml-2" data-id="${id}">刪除</button>`;
            }

            li.innerHTML = `
                <div class="schedule-info">
                    <span class="schedule-name" data-tooltip="${schedule.name}" data-id="${id}">${schedule.name}</span>
                    <span class="schedule-owner">(建立者: ${createdBy})</span>
                </div>
                <div class="schedule-actions">
                    ${buttonsHtml}
                </div>
            `;
            listElement.appendChild(li);
        }
        this.initializeTooltips();
    },

    renderManagerList: function(config) {
        this.hideActiveTooltip();
        const { listElement, items, itemType, sortFn } = config;

        const sortedItems = sortFn ? sortFn(items) : [...items].sort();

        this.renderList(listElement, sortedItems, (item) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center py-1 px-2 hover:bg-gray-100 rounded';
            li.innerHTML = `
                <span>${item}</span>
                <button class="delete-${itemType} text-red-600 hover:text-red-800" data-${itemType}="${item}">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            `;
            return li;
        });
    },

    updateActiveFilterDisplay: function() {
        const display = AppElements.activeFilterDisplay;
        if (app.activeFilters.length === 0) {
            display.textContent = '未套用任何篩選';
        } else {
            const counts = app.activeFilters.reduce((acc, f) => {
                if (f.type === 'name') acc.name = (acc.name || 0) + 1;
                else if (f.type === 'department') acc.department = (acc.department || 0) + 1;
                else if (f.type === 'teacher') acc.teacher = (acc.teacher || 0) + 1;
                return acc;
            }, {});
            
            const parts = [];
            if (counts.name) parts.push(`${counts.name} 門課程`);
            if (counts.department) parts.push(`${counts.department} 個部門`);
            if (counts.teacher) parts.push(`${counts.teacher} 位使用人`);

            display.textContent = `已篩選: ${parts.join(', ')}`;
        }
    },

    renderList: function(listElement, items, renderItemFn) {
        listElement.innerHTML = '';
        items.forEach(item => {
            const li = renderItemFn(item);
            if (li) listElement.appendChild(li);
        });
    },

    updateDepartmentList: function() {
        try {
            this.renderManagerList({
                listElement: AppElements.departmentList,
                items: app.departments,
                itemType: 'department'
            });
            this.populateDepartmentQuickFilter();
        } catch (e) {
            console.error('更新部門列表失敗:', e);
            this.showNotification('更新部門列表失敗', 'error');
        }
    },

    populateDepartmentQuickFilter: function() {
        const select = AppElements.departmentQuickFilter;
        if (!select) return;
        
        select.innerHTML = '<option value="all">所有部門</option>';
        const sortedDepartments = app.departments.slice().sort();
        sortedDepartments.forEach(dept => {
            const option = document.createElement('option');
            option.value = dept;
            option.textContent = dept;
            select.appendChild(option);
        });

        const lastFilter = localStorage.getItem('lastQuickFilter');
        if (lastFilter && app.departments.includes(lastFilter)) {
            select.value = lastFilter;
        } else {
            select.value = 'all';
        }
    },

    updateClassroomList: function() {
        try {
            this.renderManagerList({
                listElement: AppElements.classroomList,
                items: app.classrooms,
                itemType: 'classroom',
                sortFn: app.sortClassrooms
            });
        } catch (e) {
            console.error('更新教室列表失敗:', e);
            this.showNotification('更新教室列表失敗', 'error');
        }
    },

    createClassElement: function(classItem, classroom, day, overrideColor = null) {
        const isUpcoming = app.nextUpcomingClassIds.has(classItem.id);
        const hasConflict = app.checkTimeConflict(classroom, day, classItem);
        
        const conflictIcon = hasConflict 
            ? `<div class="conflict-icon" title="時間衝突"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.752a3 3 0 01-2.598 4.5H4.644a3 3 0 01-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg></div>`
            : '';
        
        const bgColor = overrideColor || app.courseColorMap[classItem.name] || '#E2E8F0';

        const departmentTags = (classItem.departments || []).map(dept => `<span class="department-tag-vertical">${dept}</span>`).join('');
        const allDepartmentsTooltip = (classItem.departments || []).join(', ');

        const notesHtml = app.currentViewMode === AppConfig.MODES.DAY 
            ? `<div class="course-notes editable" data-field="notes">${classItem.notes || ''}</div>`
            : '';
        
        const viewModeClass = app.currentViewMode === AppConfig.MODES.DAY ? 'day-view-layout' : '';
        const classDiv = document.createElement('div');
        classDiv.setAttribute('class', `class-item ${hasConflict ? 'conflict' : ''} ${isUpcoming ? 'upcoming-highlight' : ''} ${viewModeClass}`);
        classDiv.style.backgroundColor = bgColor;
        classDiv.dataset.id = classItem.id;
        classDiv.dataset.name = classItem.name;
        classDiv.innerHTML = `
            <div class="class-item-content">
                <div class="font-medium editable" data-field="name">${classItem.name}</div>
                <div class="editable" data-field="time">${classItem.timeStart}-${classItem.timeEnd}</div>
                <div class="editable" data-field="teacher">${classItem.teacher}</div>
            </div>
            ${notesHtml}
            <div class="department-tags-vertical-container editable" data-field="departments" data-tooltip="部門: ${allDepartmentsTooltip}">${departmentTags}</div>
            <span class="delete-btn" data-classroom="${classroom}" data-day="${day}">×</span>
            ${conflictIcon}
        `;

        return classDiv;
    },

    toggleSelection: function(clickedElement) {
        const courseName = clickedElement.dataset.name;
        const isAlreadyPrimary = clickedElement.classList.contains('primary-selection');

        this.clearAllSelections();

        if (!isAlreadyPrimary) {
            document.body.classList.add('has-selection');
            const allClassElements = document.querySelectorAll('.class-item');
            allClassElements.forEach(el => {
                if (el.dataset.name === courseName) {
                    el.classList.toggle('primary-selection', el === clickedElement);
                    el.classList.toggle('secondary-selection', el !== clickedElement);
                }
            });
        }
    },

    clearAllSelections: function() {
        document.body.classList.remove('has-selection');
        document.querySelectorAll('.class-item.primary-selection, .class-item.secondary-selection').forEach(el => {
            el.classList.remove('primary-selection', 'secondary-selection');
        });
    },

    setViewMode: function(mode) {
        if (app.currentViewMode === mode) return;
        app.currentViewMode = mode;
        localStorage.setItem('lastViewMode', mode);

        if (mode === AppConfig.MODES.DAY) {
            const today = new Date().getDay();
            app.currentDayIndex = (today === 0) ? 6 : today - 1;
            app.dayViewSortMode = 'time'; 
        }
        this.renderScheduleTable();
    },
    
    setDayViewSortMode: function(mode) {
        if (app.dayViewSortMode === mode) return;
        app.dayViewSortMode = mode;
        this.renderScheduleTable();
    },

    changeDay: function(direction) {
        if (app.currentViewMode !== AppConfig.MODES.DAY) return;
        app.currentDayIndex = (app.currentDayIndex + direction + 7) % 7;
        this.renderScheduleTable();
    },

    updateViewControls: function() {
        if (app.currentViewMode === AppConfig.MODES.DAY) {
            AppElements.dayViewSortSelector.style.display = 'flex';
        } else {
            AppElements.dayViewSortSelector.style.display = 'none';
        }

        const tableHead = AppElements.scheduleBody.previousElementSibling;
        tableHead.innerHTML = '';
        const tr = document.createElement('tr');
        tr.className = 'relative z-10';

        AppElements.dayViewControls.style.display = 'none';

        if (app.currentViewMode === AppConfig.MODES.WEEK) {
            AppElements.viewModeWeekBtn.classList.add('active');
            AppElements.viewModeDayBtn.classList.remove('active');
            tr.innerHTML = `
                <th class="border border-gray-300 p-2 w-20 bg-gray-200 diagonal-split">
                    <span class="diagonal-split-top">星期</span>
                    <span class="diagonal-split-bottom">教室</span>
                </th>
                ${AppConfig.WEEKDAYS.map(day => `<th class="border border-gray-300 p-2 bg-gray-200 w-1/7">${day}</th>`).join('')}
            `;
        } else {
            AppElements.viewModeDayBtn.classList.add('active');
            AppElements.viewModeWeekBtn.classList.remove('active');
            
            AppElements.daySortClassroomBtn.classList.toggle('active', app.dayViewSortMode === 'classroom');
            AppElements.daySortTimeBtn.classList.toggle('active', app.dayViewSortMode === 'time');

            tr.innerHTML = `
                <th class="border border-gray-300 p-2 w-20 bg-gray-200 diagonal-split">
                    <span class="diagonal-split-top">星期</span>
                    <span class="diagonal-split-bottom">教室</span>
                </th>
                <th class="border border-gray-300 p-2 bg-gray-200">
                    <div class="flex items-center justify-center gap-4">
                        <button id="header-prev-day-btn" class="p-2 rounded-full hover:bg-gray-300 transition"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 19l-7-7 7-7\" /></svg></button>
                        <span class="text-lg font-semibold text-gray-700 w-24 text-center">${AppConfig.WEEKDAYS[app.currentDayIndex]}</span>
                        <button id="header-next-day-btn" class="p-2 rounded-full hover:bg-gray-300 transition"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 5l7 7-7 7\" /></svg></button>
                    </div>
                </th>
            `;
        }
        tableHead.appendChild(tr);
    },

    renderScheduleTable: function() {
        try {
            this.hideActiveTooltip();
            app.findNextUpcomingClasses();
            this.updateViewControls();
            let dataToRender = app.scheduleData;
            const quickFilterDept = AppElements.departmentQuickFilter.value;
            if (quickFilterDept && quickFilterDept !== 'all') {
                dataToRender = app.filterDataByDepartment(dataToRender, quickFilterDept);
            }
            if (app.activeFilters && app.activeFilters.length > 0) {
                dataToRender = app.filterDataByActiveFilters(dataToRender);
            }
            AppElements.scheduleBody.innerHTML = '';
            if (app.currentViewMode === AppConfig.MODES.DAY && app.dayViewSortMode === 'time') {
                this.renderDayViewByTime(dataToRender);
            } else {
                this.renderByClassroom(dataToRender);
            }
            this.setupDragAndDrop();
            this.initializeTooltips();
            this.addUpcomingClassIndicators();
        } catch (e) {
            console.error('渲染課程表失敗:', e);
            this.showNotification('渲染課程表失敗', 'error');
        }
    },

    addUpcomingClassIndicators: function() {
        document.querySelectorAll('.class-item.upcoming-highlight').forEach(classItem => {
            const parentRow = classItem.closest('tr');
            if (!parentRow) return;
            const headerCell = parentRow.querySelector('td:first-child');
            if (!headerCell) return;
            headerCell.style.position = 'relative';
            const arrow = document.createElement('div');
            arrow.className = 'upcoming-arrow-marker';
            arrow.innerHTML = `
                <span class="mr-1">即將上課</span>
                <div class="arrow-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                </div>
            `;
            const topPosition = classItem.offsetTop + (classItem.offsetHeight / 2);
            arrow.style.top = `${topPosition}px`;
            headerCell.appendChild(arrow);
        });
    },

    renderDayViewByTime: function(dataToRender) {
        const day = app.currentDayIndex;
        let allCoursesForDay = [];
        for (const classroom in dataToRender) {
            if (dataToRender[classroom][day]) {
                dataToRender[classroom][day].forEach(course => {
                    allCoursesForDay.push({ ...course, classroom: classroom });
                });
            }
        }
        allCoursesForDay.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
        allCoursesForDay.forEach(course => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 align-top">${course.classroom}</td>`;
            const td = document.createElement('td');
            td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
            td.dataset.classroom = course.classroom;
            td.dataset.day = day;
            const classDiv = this.createClassElement(course, course.classroom, day);
            td.appendChild(classDiv);
            tr.appendChild(td);
            AppElements.scheduleBody.appendChild(tr);
        });
    },

    renderByClassroom: function(dataToRender) {
        const classroomsWithSchedule = new Set([...app.classrooms, ...Object.keys(dataToRender)]);
        const sortedClassrooms = app.sortClassrooms(Array.from(classroomsWithSchedule));
        sortedClassrooms.forEach(classroom => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 align-top">${classroom}</td>`;
            
            const daysToRender = app.currentViewMode === AppConfig.MODES.WEEK ? [0, 1, 2, 3, 4, 5, 6] : [app.currentDayIndex];

            for (const day of daysToRender) {
                const td = document.createElement('td');
                td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
                td.dataset.classroom = classroom;
                td.dataset.day = day;
                const classes = (dataToRender[classroom]?.[day] || []);
                let lastColor = null;
                classes.forEach((classItem) => {
                    let currentColor = app.courseColorMap[classItem.name] || '#E2E8F0';
                    let finalColor = currentColor;
                    if (currentColor === lastColor) {
                        const currentIndex = AppConfig.COURSE_COLORS.indexOf(currentColor);
                        const nextIndex = (currentIndex + 1) % AppConfig.COURSE_COLORS.length;
                        finalColor = AppConfig.COURSE_COLORS[nextIndex];
                    }
                    const classDiv = this.createClassElement(classItem, classroom, day, finalColor);
                    td.appendChild(classDiv);
                    lastColor = finalColor;
                });
                tr.appendChild(td);
            }
            AppElements.scheduleBody.appendChild(tr);
        });
    },

    setupDragAndDrop: function() {
        try {
            document.querySelectorAll('.schedule-cell').forEach(cell => {
                if (cell.sortable) cell.sortable.destroy();
                cell.sortable = new Sortable(cell, {
                    group: 'classes',
                    animation: 150,
                    onStart: (evt) => {
                        app.originalSourceListElement = evt.from;
                    },
                    onMove: (evt) => {
                        if (app.currentViewMode === AppConfig.MODES.DAY && app.dayViewSortMode === 'time') {
                            return false;
                        }
                        return evt.from !== evt.to;
                    },
                    onEnd: (evt) => {
                        if (app.currentViewMode === AppConfig.MODES.DAY && app.dayViewSortMode === 'time') {
                            this.renderScheduleTable();
                            return;
                        }
                        app.handleDrop(evt);
                    }
                });
            });
        } catch (e) {
            console.error('設置拖曳功能失敗:', e);
            this.showNotification('設置拖曳功能失敗', 'error');
        }
    }
  };

  return uiModule;
}
</script>
