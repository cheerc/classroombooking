<script>
function createUIModule(app) {
  const elements = AppElements; // Shortcut to elements
  let activeTooltip = { element: null, hideTimeout: null }; // Make tooltip state accessible within the module

  const uiModule = {
    hideActiveTooltip: function(immediately = true) {
        if (!activeTooltip.element) return;
        clearTimeout(activeTooltip.hideTimeout);
        if (immediately) {
            if (activeTooltip.element.parentElement) {
                activeTooltip.element.remove();
            }
            activeTooltip.element = null;
        } else {
            activeTooltip.hideTimeout = setTimeout(() => {
                if (activeTooltip.element && activeTooltip.element.parentElement) {
                    activeTooltip.element.remove();
                    activeTooltip.element = null;
                }
            }, 50);
        }
    },

    showLoading: function(message = '載入中，請稍候...') {
        elements.loadingText.textContent = message;
        elements.loadingOverlay.style.display = 'flex';
        if (app.loadingTimeout) clearTimeout(app.loadingTimeout);
        app.loadingTimeout = setTimeout(() => {
            this.hideLoading();
            this.showNotification('載入超時，使用本地數據', 'error');
            app.isConnecting = false;
        }, 30000);
    },

    hideLoading: function() {
        elements.loadingOverlay.style.display = 'none';
        if (app.loadingTimeout) clearTimeout(app.loadingTimeout);
    },

    showNotification: function(message, type = 'success', duration = 3000) {
        const notification = elements.notification;
        notification.innerHTML = message;
        notification.classList.remove('success', 'error', 'info');
        notification.classList.add(type, 'show');
        setTimeout(() => notification.classList.remove('show'), duration);
    },

    initializeTooltips: function() {
        document.querySelectorAll('[data-tooltip]:not([data-tooltip-initialized])').forEach(el => {
            el.setAttribute('data-tooltip-initialized', 'true');
            const showTooltip = () => {
                this.hideActiveTooltip(true);
                const tooltipDiv = document.createElement('div');
                tooltipDiv.className = 'fixed bg-gray-800 text-white text-xs rounded py-1 px-2 shadow-lg';
                tooltipDiv.style.zIndex = '1050';
                tooltipDiv.textContent = el.getAttribute('data-tooltip');
                document.body.appendChild(tooltipDiv);
                activeTooltip.element = tooltipDiv;
                const rect = el.getBoundingClientRect();
                const tooltipRect = tooltipDiv.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                let top = rect.top - tooltipRect.height - 5;
                if (left < 5) left = 5;
                if (left + tooltipRect.width > viewportWidth - 5) left = viewportWidth - tooltipRect.width - 5;
                if (top < 5) top = rect.bottom + 5;
                tooltipDiv.style.left = `${left}px`;
                tooltipDiv.style.top = `${top}px`;
            };
            el.addEventListener('mouseenter', showTooltip);
            el.addEventListener('mouseleave', () => this.hideActiveTooltip(false));
            el.addEventListener('click', () => this.hideActiveTooltip(true));
        });
    },

    manageLoadingState: function(state, options = {}) {
        const { success = true, message = '', isConflict = false } = options;
        if (state === 'start') {
            this.showLoading(message);
            this.updateSyncStatus(AppConfig.STATUS.SYNCING);
            [elements.loadFromCloudBtn, elements.saveToCloudBtn].forEach(btn => btn.disabled = true);
        } else if (state === 'end') {
            this.hideLoading();
            [elements.loadFromCloudBtn, elements.saveToCloudBtn].forEach(btn => btn.disabled = false);
            if (success) {
                this.updateSyncStatus(AppConfig.STATUS.SYNCED);
                this.showNotification(message, 'success');
            } else {
                if (isConflict) {
                    this.updateSyncStatus(AppConfig.STATUS.CONFLICT);
                } else {
                    this.updateSyncStatus(AppConfig.STATUS.ERROR);
                    this.showNotification(message, 'error');
                }
            }
        }
    },

    updateGlobalUIForScheduleMode: function() {
        const isAllSchedulesMode = app.activeScheduleId === AppConfig.ALL_SCHEDULES_ID;
        const els = AppElements;
        const buttonsToDisable = [
            els.saveToCloudBtn, els.loadVersionBtn, els.showClassroomManagerBtn,
            els.manageSchedulesBtn, els.undoBtn, els.redoBtn,
            els.showVersionHistoryBtn
        ];
        buttonsToDisable.forEach(btn => {
            if (btn) {
                btn.disabled = isAllSchedulesMode;
                btn.classList.toggle('opacity-50', isAllSchedulesMode);
                btn.classList.toggle('cursor-not-allowed', isAllSchedulesMode);
            }
        });

        if (isAllSchedulesMode) {
            els.syncStatus.className = 'sync-status readonly-mode';
            els.syncStatusText.textContent = '👀 唯讀總覽模式';
            els.syncStatus.setAttribute('data-tooltip', '合併顯示所有課表');
        } else {
            app.historyModule.checkDirty();
        }
    },

    updateSyncStatus: function(status) {
        if (app.activeScheduleId === AppConfig.ALL_SCHEDULES_ID) {
            this.updateGlobalUIForScheduleMode();
            return;
        }
        const els = AppElements;
        let icon = '', text = '', subtext = '', cssClass = '';
        const lastModifiedTimestamp = app.scheduleLastModified[app.activeScheduleId];
        const lastModifiedString = lastModifiedTimestamp ? `雲端版本: ${new Date(lastModifiedTimestamp).toLocaleString()}` : '未曾同步';
        switch (status) {
            case AppConfig.STATUS.SYNCING:
                icon = '🔄'; text = '正在同步...'; subtext = '請稍候...'; cssClass = AppConfig.STATUS.SYNCING;
                break;
            case AppConfig.STATUS.ERROR:
                icon = '❌'; text = '同步失敗'; subtext = '請檢查網路或稍後再試'; cssClass = AppConfig.STATUS.ERROR;
                break;
            case AppConfig.STATUS.CONFLICT:
                icon = '⚠️'; text = '版本衝突'; subtext = '請先讀取雲端資料'; cssClass = AppConfig.STATUS.ERROR;
                break;
            case AppConfig.STATUS.DIRTY:
                icon = '⚠️'; text = '有未儲存的變更'; subtext = lastModifiedString; cssClass = AppConfig.STATUS.DIRTY;
                break;
            case AppConfig.STATUS.SYNCED:
            default:
                icon = '✅'; text = '資料已同步'; subtext = lastModifiedString; cssClass = AppConfig.STATUS.SYNCED;
                break;
        }
        els.syncStatus.className = 'sync-status ' + cssClass;
        els.syncStatusText.textContent = `${icon} ${text}`;
        els.syncStatus.setAttribute('data-tooltip', subtext);
    },

    updateScheduleSelect: function() {
        this.hideActiveTooltip();
        const select = AppElements.scheduleSelect;
        select.innerHTML = '';
        const allOption = document.createElement('option');
        allOption.value = AppConfig.ALL_SCHEDULES_ID;
        allOption.textContent = '所有課程 (排除預排)';
        select.appendChild(allOption);
        const sortedScheduleIds = Object.keys(app.schedules).sort();
        for (const id of sortedScheduleIds) {
            const schedule = app.schedules[id];
            const option = document.createElement('option');
            option.value = id;
            option.textContent = schedule.isDraft ? `${schedule.name} (預排)` : schedule.name;
            select.appendChild(option);
        }
        select.value = app.activeScheduleId;
    },

    renderScheduleList: function() {
        this.hideActiveTooltip();
        const listElement = AppElements.scheduleList;
        listElement.innerHTML = '';
        const currentUser = app.getShortUserName(typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '');
        const isAdmin = currentUser.toLowerCase() === 'cheerc';
        const sortedScheduleIds = Object.keys(app.schedules).sort();
        for (const id of sortedScheduleIds) {
            const schedule = app.schedules[id];
            const displayName = schedule.isDraft ? `${schedule.name} (預排)` : schedule.name;
            const createdBy = app.getShortUserName(schedule.createdBy || '未知');
            const canManage = isAdmin || (currentUser === createdBy);
            const li = document.createElement('li');
            li.className = 'schedule-list-item';
            let buttonsHtml = `<button class="copy-schedule-btn text-green-600 hover:text-green-800 text-sm" data-id="${id}">複製</button>`;
            if (canManage) {
                buttonsHtml += `<button class="rename-schedule-btn text-blue-600 hover:text-blue-800 text-sm ml-2" data-id="${id}">編輯</button>`;
                buttonsHtml += `<button class="delete-schedule-btn text-red-600 hover:text-red-800 text-sm ml-2" data-id="${id}">刪除</button>`;
            }
            li.innerHTML = (
                `
                <div class="schedule-info">
                    <span class="schedule-name" data-tooltip="${displayName}" data-id="${id}">${displayName}</span>
                    <span class="schedule-owner">(建立者: ${createdBy})</span>
                </div>
                <div class="schedule-actions">
                    ${buttonsHtml}
                </div>
            `
            );
            listElement.appendChild(li);
        }
        this.initializeTooltips();
    },

    renderManagerList: function(config) {
        this.hideActiveTooltip();
        const { listElement, items, itemType, sortFn } = config;
        const sortedItems = sortFn ? sortFn(items) : [...items].sort();
        this.renderList(listElement, sortedItems, (item) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between items-center py-1 px-2 hover:bg-gray-100 rounded';
            li.innerHTML = (
                `
                <span>${item}</span>
                <button class="delete-${itemType} text-red-600 hover:text-red-800" data-${itemType}="${item}">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `
            );
            return li;
        });
    },

    updateClearFilterButtonVisibility: function() {
        const btn = AppElements.clearTagFilterBtn;
        if (!btn) return;
        const hasTagFilters = app.activeFilters.some(f => f.type === 'tag');
        btn.style.display = hasTagFilters ? 'block' : 'none';
    },

    updateClearAllFiltersButtonVisibility: function() {
        const btn = AppElements.clearAllFiltersBtn;
        if (!btn) return;
        btn.style.display = app.activeFilters.length > 0 ? 'flex' : 'none';
    },

    updateAdvancedFilterButtonState: function() {
        const btn = AppElements.showFilterBtn;
        if (!btn) return;
        const hasAdvancedFilters = app.activeFilters.some(f => f.type === 'name' || f.type === 'teacher');
        if (hasAdvancedFilters) {
            btn.classList.add('filter-btn-active');
        } else {
            btn.classList.remove('filter-btn-active');
        }
    },

    renderList: function(listElement, items, renderItemFn) {
        listElement.innerHTML = '';
        items.forEach(item => {
            const li = renderItemFn(item);
            if (li) listElement.appendChild(li);
        });
    },

    updateClassroomList: function() {
        try {
            this.renderManagerList({
                listElement: AppElements.classroomList,
                items: app.classrooms,
                itemType: 'classroom',
                sortFn: app.sortClassrooms
            });
        } catch (e) {
            console.error('更新教室列表失敗:', e);
            this.showNotification('更新教室列表失敗', 'error');
        }
    },

    initializeTagFilter: function() {
        const input = AppElements.tagFilterInput;
        if (!input) return;

        if (app.tagFilterTagify) {
            app.tagFilterTagify.destroy();
        }

        const allTags = app.tags;

        // Remove loading state before initializing
        input.disabled = false;
        input.classList.remove('tagify-loading');

        app.tagFilterTagify = new Tagify(input, {
            whitelist: allTags,
            placeholder: "篩選標籤...",
            enforceWhitelist: true,
            dropdown: {
                enabled: 0,
                closeOnSelect: false, // Keep dropdown open for multi-select
                classname: 'tags-look'
            }
        });

        app.tagFilterTagify.on('add', () => app.applyTagFilters());
        app.tagFilterTagify.on('remove', () => app.applyTagFilters());
    },

    createClassElement: function(classItem, classroom, day, options = {}) {
        const { overrideColor = null, viewContext = 'default' } = options;
        const isUpcoming = app.nextUpcomingClassIds.has(classItem.id);
        const hasConflict = app.checkTimeConflict(classroom, day, classItem);
        const conflictIcon = hasConflict ? `<div class="conflict-icon" title="時間衝突"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.752a3 3 0 01-2.598 4.5H4.644a3 3 0 01-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg></div>` : '';
        const bgColor = overrideColor || app.courseColorMap[classItem.name] || '#E2E8F0';
        const tagsHtml = (classItem.tags || []).map(tag => `<span class="tag-tag-vertical">${tag}</span>`).join('');
        const allTagsTooltip = (classItem.tags || []).join(', ');
        const notesHtml = app.currentViewMode === AppConfig.MODES.DAY ? `<div class="course-notes editable" data-field="notes">${classItem.notes || ''}</div>` : '';
        
        let contextSpecificHtml = '';
        if (viewContext === 'teacherSort') {
            contextSpecificHtml = `<div>教室：${classroom}</div>`;
        } else {
            contextSpecificHtml = `<div class="editable" data-field="teacher">${classItem.teacher}</div>`;
        }

        const viewModeClass = app.currentViewMode === AppConfig.MODES.DAY ? 'day-view-layout' : '';
        const classDiv = document.createElement('div');
        classDiv.setAttribute('class', `class-item ${hasConflict ? 'conflict' : ''} ${isUpcoming ? 'upcoming-highlight' : ''} ${viewModeClass}`);
        classDiv.style.backgroundColor = bgColor;
        classDiv.dataset.id = classItem.id;
        classDiv.dataset.name = classItem.name;
        classDiv.dataset.classroom = classroom;
        classDiv.dataset.day = day;
        classDiv.innerHTML = (
            `
            <div class="class-item-content">
                <div class="font-medium editable" data-field="name">${classItem.name}</div>
                <div class="editable" data-field="time">${classItem.timeStart}-${classItem.timeEnd}</div>
                ${contextSpecificHtml}
            </div>
            <div class="tag-tags-vertical-container editable" data-field="tags" data-tooltip="標籤: ${allTagsTooltip}">${tagsHtml}</div>
            ${notesHtml}
            <span class="delete-btn" data-classroom="${classroom}" data-day="${day}">×</span>
            ${conflictIcon}
        `
        );
        return classDiv;
    },

    toggleSelection: function(clickedElement) {
        const courseName = clickedElement.dataset.name;
        const isAlreadyPrimary = clickedElement.classList.contains('primary-selection');
        this.clearAllSelections();
        if (!isAlreadyPrimary) {
            document.body.classList.add('has-selection');
            const allClassElements = document.querySelectorAll('.class-item');
            allClassElements.forEach(el => {
                if (el.dataset.name === courseName) {
                    el.classList.toggle('primary-selection', el === clickedElement);
                    el.classList.toggle('secondary-selection', el !== clickedElement);
                }
            });
        }
    },

    clearAllSelections: function() {
        document.body.classList.remove('has-selection');
        document.querySelectorAll('.class-item.primary-selection, .class-item.secondary-selection').forEach(el => {
            el.classList.remove('primary-selection', 'secondary-selection');
        });
    },

    setViewMode: function(mode) {
        if (app.currentViewMode === mode) return;
        app.currentViewMode = mode;
        localStorage.setItem('lastViewMode', mode);

        // Adjust sort mode based on the new view mode
        if (mode === AppConfig.MODES.DAY) {
            const today = new Date().getDay();
            app.currentDayIndex = (today === 0) ? 6 : today - 1;
            // Default sort for day view is by time
            app.viewSortMode = 'time'; 
        } else { // mode === AppConfig.MODES.WEEK
            // If switching to week view and the sort mode was 'time' (which is invalid for week view),
            // default to 'classroom' sort.
            if (app.viewSortMode === 'time') {
                app.viewSortMode = 'classroom';
            }
        }
        this.renderScheduleTable();
    },

    setViewSortMode: function(mode) {
        if (app.viewSortMode === mode) return;
        app.viewSortMode = mode;
        // The actual button state is updated in updateViewControls
        this.renderScheduleTable();
    },

    changeDay: function(direction) {
        if (app.currentViewMode !== AppConfig.MODES.DAY) return;
        app.currentDayIndex = (app.currentDayIndex + direction + 7) % 7;
        this.renderScheduleTable();
    },

    updateViewControls: function() {
        const isDayView = app.currentViewMode === AppConfig.MODES.DAY;
        const isAllSchedules = app.activeScheduleId === AppConfig.ALL_SCHEDULES_ID;

        // --- Control visibility of sort selectors ---
        AppElements.viewSortSelector.style.display = isAllSchedules ? 'none' : 'flex';
        AppElements.daySortTimeBtn.style.display = isDayView ? 'block' : 'none';

        const tableHead = AppElements.scheduleBody.previousElementSibling;
        tableHead.innerHTML = '';
        const tr = document.createElement('tr');
        tr.className = 'relative z-10';

        // --- Set active state for view mode buttons ---
        AppElements.viewModeWeekBtn.classList.toggle('active', !isDayView);
        AppElements.viewModeDayBtn.classList.toggle('active', isDayView);
        
        // --- Set active state for sort mode buttons ---
        AppElements.daySortClassroomBtn.classList.toggle('active', app.viewSortMode === 'classroom');
        AppElements.daySortTimeBtn.classList.toggle('active', app.viewSortMode === 'time');
        AppElements.daySortTeacherBtn.classList.toggle('active', app.viewSortMode === 'teacher');
        
        // --- Render Table Header ---
        if (isDayView) {
            const dayViewHeaderLabel = app.viewSortMode === 'teacher' ? '老師' : '教室';
            tr.innerHTML = (
                `<th class="border border-gray-300 p-2 w-20 bg-gray-200 diagonal-split">
                    <span class="diagonal-split-top">星期</span>
                    <span class="diagonal-split-bottom">${dayViewHeaderLabel}</span>
                </th>
                <th class="border border-gray-300 p-2 bg-gray-200">
                    <div class="flex items-center justify-center gap-4">
                        <button id="header-prev-day-btn" class="p-2 rounded-full hover:bg-gray-300 transition"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 19l-7-7 7-7\" /></svg></button>
                        <span class="text-lg font-semibold text-gray-700 w-24 text-center">${AppConfig.WEEKDAYS[app.currentDayIndex]}</span>
                        <button id="header-next-day-btn" class="p-2 rounded-full hover:bg-gray-300 transition"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"h-5 w-5\" fill=\"none\" viewBox=\"0 0 24 24\" stroke=\"currentColor\" stroke-width=\"2\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 5l7 7-7 7\" /></svg></button>
                    </div>
                </th>
            `
            );
        } else { // Week View
            const weekViewHeaderLabel = app.viewSortMode === 'teacher' ? '老師' : '教室';
            tr.innerHTML = (
                `<th class="border border-gray-300 p-2 w-20 bg-gray-200 diagonal-split">
                    <span class="diagonal-split-top">星期</span>
                    <span class="diagonal-split-bottom">${weekViewHeaderLabel}</span>
                </th>
                ${AppConfig.WEEKDAYS.map(day => `<th class="border border-gray-300 p-2 bg-gray-200 w-1/7">${day}</th>`).join('')}
            `
            );
        }
        tableHead.appendChild(tr);
    },

    renderScheduleTable: function() {
        try {
            this.hideActiveTooltip();
            app.findNextUpcomingClasses();
            this.updateViewControls(); // This now handles the header and button visibility

            if (app.activeScheduleId === AppConfig.ALL_SCHEDULES_ID) {
                this.renderAllSchedulesView();
                return;
            }

            let dataToRender = app.scheduleData;
            if (app.activeFilters && app.activeFilters.length > 0) {
                dataToRender = app.filterDataByActiveFilters(dataToRender);
            }

            AppElements.scheduleBody.innerHTML = '';

            if (app.viewSortMode === 'classroom') {
                this.renderByClassroom(dataToRender);
            } else if (app.viewSortMode === 'teacher') {
                this.renderByTeacher(dataToRender);
            } else if (app.currentViewMode === AppConfig.MODES.DAY && app.viewSortMode === 'time') {
                this.renderDayViewByTime(dataToRender);
            } else {
                // Fallback for any invalid state
                this.renderByClassroom(dataToRender);
            }

            this.setupDragAndDrop();
            this.initializeTooltips();
            this.addUpcomingClassIndicators();
        } catch (e) {
            console.error('渲染課程表失敗:', e);
            this.showNotification('渲染課程表失敗', 'error');
        }
    },

    renderAllSchedulesView: function() {
        AppElements.scheduleBody.innerHTML = '';
        const classroomMetadataMap = new Map();
        const dataForFiltering = {};

        Object.values(app.schedules).filter(schedule => !schedule.isDraft).forEach(schedule => {
            if (!schedule.data) return;
            const scheduleName = schedule.name;
            if (schedule.data.scheduleData) {
                Object.entries(schedule.data.scheduleData).forEach(([classroom, days]) => {
                    const uniqueClassroomName = `[${scheduleName}] ${classroom}`;
                    
                    if (!classroomMetadataMap.has(uniqueClassroomName)) {
                        classroomMetadataMap.set(uniqueClassroomName, { scheduleName, classroomName: classroom });
                    }
                    
                    if (!dataForFiltering[uniqueClassroomName]) {
                        dataForFiltering[uniqueClassroomName] = {};
                    }

                    Object.entries(days).forEach(([day, courses]) => {
                        if (!dataForFiltering[uniqueClassroomName][day]) {
                            dataForFiltering[uniqueClassroomName][day] = [];
                        }
                        dataForFiltering[uniqueClassroomName][day].push(...courses);
                    });
                });
            }
        });

        let dataToRender = dataForFiltering;
        if (app.activeFilters && app.activeFilters.length > 0) {
            dataToRender = app.filterDataByActiveFilters(dataToRender);
        }

        if (app.currentViewMode === AppConfig.MODES.DAY && app.viewSortMode === 'time') {
            const day = app.currentDayIndex;
            let allCoursesForDay = [];
            for (const uniqueClassroomName in dataToRender) {
                if (dataToRender[uniqueClassroomName][day]) {
                    dataToRender[uniqueClassroomName][day].forEach(course => {
                        allCoursesForDay.push({ ...course, classroom: uniqueClassroomName });
                    });
                }
            }
            allCoursesForDay.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
            allCoursesForDay.forEach(course => {
                const tr = document.createElement('tr');
                const { scheduleName, classroomName } = classroomMetadataMap.get(course.classroom);
                tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 align-top classroom-cell-stacked"><span class="schedule-prefix">${scheduleName}</span><span class="classroom-name-main">${classroomName}</span></td>`;
                const td = document.createElement('td');
                td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top readonly-cell');
                td.dataset.classroom = course.classroom;
                td.dataset.day = day;
                const classDiv = this.createClassElement(course, course.classroom, day, {});
                classDiv.classList.add('readonly');
                classDiv.querySelector('.delete-btn').remove();
                td.appendChild(classDiv);
                tr.appendChild(td);
                AppElements.scheduleBody.appendChild(tr);
            });
        } else {
            const sortedClassrooms = Object.keys(dataToRender).sort();
            sortedClassrooms.forEach(uniqueClassroomName => {
                const tr = document.createElement('tr');
                const { scheduleName, classroomName } = classroomMetadataMap.get(uniqueClassroomName);
                tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 align-top classroom-cell-stacked"><span class="schedule-prefix">${scheduleName}</span><span class="classroom-name-main">${classroomName}</span></td>`;
                const daysToRender = app.currentViewMode === AppConfig.MODES.WEEK ? [0, 1, 2, 3, 4, 5, 6] : [app.currentDayIndex];
                for (const day of daysToRender) {
                    const td = document.createElement('td');
                    td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top readonly-cell');
                    td.dataset.classroom = uniqueClassroomName;
                    td.dataset.day = day;
                    const courses = dataToRender[uniqueClassroomName]?.[day] || [];
                    courses.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
                    courses.forEach(course => {
                        const classDiv = this.createClassElement(course, uniqueClassroomName, day, {});
                        classDiv.classList.add('readonly');
                        classDiv.querySelector('.delete-btn').remove();
                        td.appendChild(classDiv);
                    });
                    tr.appendChild(td);
                }
                AppElements.scheduleBody.appendChild(tr);
            });
        }
        this.initializeTooltips();
    },

    addUpcomingClassIndicators: function() {
        document.querySelectorAll('.class-item.upcoming-highlight').forEach(classItem => {
            const parentRow = classItem.closest('tr');
            if (!parentRow) return;
            const headerCell = parentRow.querySelector('td:first-child');
            if (!headerCell) return;
            
            const classroomNameSpan = headerCell.querySelector('.classroom-name-main');
            if (classroomNameSpan && !headerCell.querySelector('.upcoming-badge')) {
                const badge = document.createElement('span');
                badge.className = 'upcoming-badge';
                badge.textContent = '即將上課';
                classroomNameSpan.insertAdjacentElement('afterend', badge);
            }
        });
    },

    renderDayViewByTime: function(dataToRender) {
        const day = app.currentDayIndex;
        let allCoursesForDay = [];
        for (const classroom in dataToRender) {
            if (dataToRender[classroom][day]) {
                dataToRender[classroom][day].forEach(course => {
                    allCoursesForDay.push({ ...course, classroom: classroom });
                });
            }
        }
        allCoursesForDay.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
        allCoursesForDay.forEach(course => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 classroom-cell-stacked"><span class="classroom-name-main">${course.classroom}</span></td>`;
            const td = document.createElement('td');
            td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
            td.dataset.classroom = course.classroom;
            td.dataset.day = day;
            const classDiv = this.createClassElement(course, course.classroom, day, {});
            td.appendChild(classDiv);
            tr.appendChild(td);
            AppElements.scheduleBody.appendChild(tr);
        });
    },

    renderByTeacher: function(dataToRender) {
        // 1. Get all unique teachers from the data
        const teachers = new Set();
        Object.values(dataToRender).forEach(classroom => {
            Object.values(classroom).forEach(day => {
                day.forEach(course => {
                    if (course.teacher) teachers.add(course.teacher);
                });
            });
        });
        const sortedTeachers = Array.from(teachers).sort();

        // 2. Iterate through teachers to create rows
        sortedTeachers.forEach(teacher => {
            const tr = document.createElement('tr');
            // First cell is the teacher's name
            tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 classroom-cell-stacked"><span class="classroom-name-main">${teacher}</span></td>`;
            
            const daysToRender = app.currentViewMode === AppConfig.MODES.WEEK ? [0, 1, 2, 3, 4, 5, 6] : [app.currentDayIndex];

            // 3. Iterate through the days to create cells
            for (const day of daysToRender) {
                const td = document.createElement('td');
                td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
                td.dataset.teacher = teacher; // For context
                td.dataset.day = day;

                // 4. Find all courses for this teacher on this day
                let coursesForDay = [];
                for (const classroom in dataToRender) {
                    if (dataToRender[classroom][day]) {
                        dataToRender[classroom][day].forEach(course => {
                            if (course.teacher === teacher) {
                                coursesForDay.push({ ...course, classroom: classroom }); // Add classroom info
                            }
                        });
                    }
                }

                // 5. Sort and render the courses into the cell
                coursesForDay.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
                coursesForDay.forEach(course => {
                    const classDiv = this.createClassElement(course, course.classroom, day, { viewContext: 'teacherSort' });
                    td.appendChild(classDiv);
                });
                tr.appendChild(td);
            }
            AppElements.scheduleBody.appendChild(tr);
        });
    },

    renderByClassroom: function(dataToRender) {
        const classroomsWithSchedule = new Set([...app.classrooms, ...Object.keys(dataToRender)]);
        const sortedClassrooms = app.sortClassrooms(Array.from(classroomsWithSchedule));
        sortedClassrooms.forEach(classroom => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 classroom-cell-stacked"><span class="classroom-name-main">${classroom}</span></td>`;
            const daysToRender = app.currentViewMode === AppConfig.MODES.WEEK ? [0, 1, 2, 3, 4, 5, 6] : [app.currentDayIndex];
            for (const day of daysToRender) {
                const td = document.createElement('td');
                td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
                td.dataset.classroom = classroom;
                td.dataset.day = day;
                const classes = (dataToRender[classroom]?.[day] || []);
                classes.sort((a, b) => app.timeToMinutes(a.timeStart) - app.timeToMinutes(b.timeStart));
                let lastColor = null;
                classes.forEach((classItem) => {
                    let currentColor = app.courseColorMap[classItem.name] || '#E2E8F0';
                    let finalColor = currentColor;
                    if (currentColor === lastColor) {
                        const currentIndex = AppConfig.COURSE_COLORS.indexOf(currentColor);
                        const nextIndex = (currentIndex + 1) % AppConfig.COURSE_COLORS.length;
                        finalColor = AppConfig.COURSE_COLORS[nextIndex];
                    }
                                        const classDiv = this.createClassElement(classItem, classroom, day, { overrideColor: finalColor });
                    td.appendChild(classDiv);
                    lastColor = finalColor;
                });

                // Add the placeholder for adding new courses
                if (app.activeScheduleId !== AppConfig.ALL_SCHEDULES_ID) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'add-new-placeholder';
                    placeholder.textContent = '+ 新增課程';
                    td.appendChild(placeholder);
                }

                tr.appendChild(td);
            }
            AppElements.scheduleBody.appendChild(tr);
        });
    },

    setupDragAndDrop: function() {
        try {
            const isDraggable = app.viewSortMode === 'classroom' && app.activeScheduleId !== AppConfig.ALL_SCHEDULES_ID;

            document.querySelectorAll('.schedule-cell').forEach(cell => {
                if (cell.sortable) cell.sortable.destroy();
                cell.sortable = new Sortable(cell, {
                    group: {
                        name: 'classes',
                        pull: isDraggable,
                        put: isDraggable
                    },
                    animation: 150,
                    disabled: !isDraggable,
                    onStart: (evt) => {
                        if (!isDraggable) return;
                        app.originalSourceListElement = evt.from;
                    },
                    onMove: (evt) => {
                        return isDraggable && evt.from !== evt.to;
                    },
                    onEnd: (evt) => {
                        if (!isDraggable) return;
                        app.handleDrop(evt);
                    }
                });
            });
        } catch (e) {
            console.error('設置拖曳功能失敗:', e);
            this.showNotification('設置拖曳功能失敗', 'error');
        }
    }
  };

  return uiModule;
}
</script>
