<script>
/**
 * Shared view-decision helpers used by production HTML modules.
 * Pure decisions live here so restore, renderer, card, and PDF call-sites
 * use one authored implementation at runtime.
 */
var ViewDecisionHelpers = (function() {
  const LEGAL_SORT_MODES = ['classroom', 'teacher', 'time'];

  return {
    resolveRestoredSort: function({ currentViewMode, storedSort, dayMode }) {
      if (currentViewMode === dayMode) return 'time';
      return LEGAL_SORT_MODES.includes(storedSort) ? storedSort : 'classroom';
    },

    resolveRenderTarget: function({ activeScheduleId, allSchedulesId, currentViewMode, viewSortMode, dayMode }) {
      let scheduleRenderer;
      if (viewSortMode === 'classroom') {
        scheduleRenderer = 'classroom';
      } else if (viewSortMode === 'teacher') {
        scheduleRenderer = 'teacher';
      } else if (currentViewMode === dayMode && viewSortMode === 'time') {
        scheduleRenderer = 'time';
      } else if (viewSortMode === 'time') {
        scheduleRenderer = 'weekTime';
      } else {
        scheduleRenderer = 'classroom';
      }

      return {
        renderer: activeScheduleId === allSchedulesId ? 'allSchedules' : scheduleRenderer,
        scheduleRenderer
      };
    },

    resolveClassElementFields: function(viewContext) {
      return {
        showTeacher: viewContext === 'default' || viewContext === 'timeSort',
        showClassroom: viewContext === 'teacherSort' || viewContext === 'timeSort'
      };
    },

    resolvePdfBottomText: function({ viewSortMode, teacher = '', classroom = '' }) {
      if (viewSortMode === 'teacher') return `(教室：${classroom})`;
      if (viewSortMode === 'time') return `${teacher} · ${classroom}`;
      return `(${teacher})`;
    },

    resolvePdfDiagonalLabel: function({ currentViewMode, viewSortMode, weekMode }) {
      if (currentViewMode === weekMode && viewSortMode === 'time') return '時間';
      return viewSortMode === 'teacher' ? '老師' : '教室';
    }
  };
})();
</script>
