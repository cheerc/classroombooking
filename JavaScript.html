<script>
(function() {
    // App object now focuses on state management and data operations.
    const App = {
        // --- STATE ---
        schedules: {},
        activeScheduleId: null,
        activeMetadataTimestamp: null,
        classrooms: [],
        scheduleData: {},
        tags: [], // This holds all tags for the current schedule
        tagFilterTagify: null, // To hold the tagify instance for the filter
        courseColorMap: {},
        lastSyncTime: null,
        scheduleLastModified: {},
        loadingTimeout: null,
        isConnecting: false,
        activeInlineForm: null,
        originalSourceListElement: null,
        isDirty: false,
        cleanStateSnapshot: '',
        activeFilters: [],
        currentUserEmail: '',
        currentViewMode: localStorage.getItem('lastViewMode') || AppConfig.MODES.WEEK,
        dayViewSortMode: 'time',
        currentDayIndex: (() => {
            // If the initial view mode is 'day', set the index to today. Otherwise, default to Monday (0).
            if ((localStorage.getItem('lastViewMode') || AppConfig.MODES.WEEK) === AppConfig.MODES.DAY) {
                const today = new Date().getDay();
                return (today === 0) ? 6 : today - 1; // Sunday is 0, we want it to be 6.
            }
            return 0;
        })(),
        nextUpcomingClassIds: new Set(),
        
        // --- MODULES ---
        modals: null,
        historyModule: null,
        ui: null,
        interaction: null,

        init: function() {
            // Initialize all modules
            this.modals = createModalModule(this);
            this.historyModule = createHistoryModule(this);
            this.ui = createUIModule(this);
            this.interaction = createInteractionModule(this);

            const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
            this.currentUserEmail = this.getShortUserName(fullEmail);

            // The initial load logic is now split. We first load from local storage,
            // then fetch from server, which will then call loadInitialSchedules again.
            this.interaction.addEventListeners();
            AppElements.versionBadge.textContent = `版本 ${AppConfig.APP_VERSION}`;

            setTimeout(() => {
                this.loadDataFromServer().catch(error => {
                    console.warn("Initial data load failed:", error.message);
                });
            }, 500);

            // Set up a timer to periodically check for the next upcoming class.
            setInterval(() => {
                // First, always recalculate which classes are upcoming.
                this.findNextUpcomingClasses();

                // Then, if we are in a view where the upcoming status is relevant (today's day view),
                // always re-render the table to reflect the passage of time.
                const today = new Date();
                const todayIndex = (today.getDay() === 0) ? 6 : today.getDay() - 1;
                if (this.currentViewMode === AppConfig.MODES.DAY && this.currentDayIndex === todayIndex) {
                    this.ui.renderScheduleTable();
                }
            }, 60 * 1000); // Check every minute
        },

        // --- DATA & SCHEDULE LOGIC ---
        showFirstTimeScheduleSelector: function() {
            const modal = AppElements.firstTimeScheduleSelectModal;
            const select = AppElements.firstTimeScheduleSelect;
            const confirmBtn = AppElements.firstTimeScheduleConfirmBtn;

            select.innerHTML = ''; // Clear previous options
            const scheduleIds = Object.keys(this.schedules);

            if (scheduleIds.length === 0) {
                select.innerHTML = '<option disabled>沒有可用的課表</option>';
                confirmBtn.disabled = true;
            } else {
                scheduleIds.forEach(id => {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = this.schedules[id].name;
                    select.appendChild(option);
                });
                confirmBtn.disabled = false;
            }

            modal.style.display = 'flex';

            confirmBtn.onclick = () => {
                const selectedId = select.value;
                if (selectedId) {
                    modal.style.display = 'none';
                    this.loadSchedule(selectedId);
                    this.ui.updateScheduleSelect(); // Ensure main dropdown is also updated
                }
            };
        },

        loadInitialSchedules: function() {
            const localActiveId = localStorage.getItem('activeScheduleId');
            
            // Check if the locally stored ID is a valid schedule that we just got from the server
            if (localActiveId && this.schedules[localActiveId]) {
                this.loadSchedule(localActiveId);
                this.ui.updateScheduleSelect();
            } else {
                // If no local preference, or the preference is invalid (e.g., schedule was deleted)
                if (Object.keys(this.schedules).length > 0) {
                    // We have schedules from the server, so we MUST ask the user to choose one.
                    this.showFirstTimeScheduleSelector();
                } else {
                    // No schedules on the server at all. This is a rare edge case.
                    this.ui.showNotification("雲端沒有任何課表。請聯絡管理員新增一個。", "info", 5000);
                    this.schedules = {};
                    this.activeScheduleId = null;
                    this.ui.renderScheduleTable(); // Render an empty table
                    this.ui.updateScheduleSelect();
                }
            }
        },

        loadSchedule: function(scheduleId) {
            if (scheduleId === AppConfig.ALL_SCHEDULES_ID) {
                this.activeScheduleId = AppConfig.ALL_SCHEDULES_ID;
                this.classrooms = [];
                this.scheduleData = {};
                this.tags = []; // This will be populated by the 'All Schedules' logic
                this.ui.renderScheduleTable();
                this.ui.updateGlobalUIForScheduleMode();
                localStorage.setItem('activeScheduleId', scheduleId);
                return;
            }

            if (!this.schedules[scheduleId]) {
                this.ui.showNotification(`錯誤：找不到指定的課表 ID: ${scheduleId}`, 'error');
                const firstId = Object.keys(this.schedules)[0];
                if (firstId) this.loadSchedule(firstId);
                return;
            }
            this.activeScheduleId = scheduleId;
            const schedule = this.schedules[scheduleId];

            if (!schedule.data) {
                this.ui.showNotification(`課表 "${schedule.name || '未命名'}" 格式錯誤，將為其創建新的空資料。`, 'error', 5000);
                schedule.data = { classrooms: [], scheduleData: {}, tags: [] };
            }

            this.classrooms = schedule.data.classrooms || [];
            this.scheduleData = this.ensureDataIds(schedule.data.scheduleData || {});
            // Deprecated: this.tags is no longer loaded directly.
            // this.tags = schedule.data.tags || [];
            this.tags = this.getAllTags(); // Dynamically get all tags
            
            // Initialize the tag filter for the current schedule
            this.ui.initializeTagFilter();

            // Load and apply persisted tag filters
            this.loadAndApplyPersistedFilters();

            this.buildCourseColorMap();
            this.ui.updateClassroomList();
            this.ui.renderScheduleTable();
            this.ui.updateGlobalUIForScheduleMode();
            this.ui.updateSyncStatus(AppConfig.STATUS.OFFLINE);
            this.historyModule.resetHistory(); // Moved from loadDataFromServer
            localStorage.setItem('activeScheduleId', scheduleId);
        },

        saveSchedulesToLocal: function() {
            localStorage.setItem('schedules', JSON.stringify(this.schedules));
        },

        handleAddSchedule: async function() {
            const newName = AppElements.newScheduleNameInput.value.trim();
            if (!newName) {
                this.ui.showNotification('課表名稱不能為空', 'error');
                return;
            }
            this.ui.showLoading('正在新增課表...');
            const newId = `schedule_${Date.now()}`;
            try {
                const result = await ServerApi.call('addSchedule', { id: newId, name: newName, metadataTimestamp: this.activeMetadataTimestamp });
                if (result.error) {
                    throw new Error(result.error);
                }
                this.activeMetadataTimestamp = result.newMetadataTimestamp;
                this.schedules[newId] = { 
                    name: newName, 
                    createdBy: result.createdBy, 
                    data: { classrooms: [], scheduleData: {}, tags: [] } 
                };
                AppElements.newScheduleNameInput.value = '';
                this.ui.renderScheduleList();
                this.ui.updateScheduleSelect();
                this.ui.showNotification(`已新增課表: ${newName}`);
            } catch (err) {
                this.ui.showNotification(`新增課表失敗: ${err.message}`, 'error');
            } finally {
                this.ui.hideLoading();
            }
        },

        handleScheduleListClick: async function(e) {
            const renameBtn = e.target.closest('.rename-schedule-btn');
            const deleteBtn = e.target.closest('.delete-schedule-btn');
            const copyBtn = e.target.closest('.copy-schedule-btn');

            if (renameBtn) {
                const id = renameBtn.dataset.id;
                const oldName = this.schedules[id].name;
                const newName = await this.modals.showPrompt('請輸入新的課表名稱：', oldName);
                if (newName && newName.trim() !== oldName) {
                    this.ui.showLoading('正在重新命名...');
                    try {
                        const result = await ServerApi.call('renameSchedule', { id: id, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        this.schedules[id].name = newName.trim();
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表已重新命名');
                    } catch (err) {
                        this.ui.showNotification(`重新命名失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }

            if (deleteBtn) {
                const id = deleteBtn.dataset.id;
                if (await this.modals.showConfirm(`確定要刪除課表 "${this.schedules[id].name}" 嗎？此操作無法復原。`)) {
                    this.ui.showLoading('正在刪除課表...');
                    try {
                        const result = await ServerApi.call('deleteSchedule', { id: id, metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        delete this.schedules[id];
                        if (id === this.activeScheduleId) {
                            this.activeScheduleId = Object.keys(this.schedules)[0];
                            this.loadSchedule(this.activeScheduleId);
                        }
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表已刪除');
                    } catch (err) {
                        this.ui.showNotification(`刪除失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }

            if (copyBtn) {
                const sourceId = copyBtn.dataset.id;
                const sourceName = this.schedules[sourceId].name;
                const newName = await this.modals.showPrompt('請為複製的課表命名：', `${sourceName} (複製)`);
                if (newName && newName.trim()) {
                    this.ui.showLoading('正在複製課表，請稍候...');
                    try {
                        const result = await ServerApi.call('copySchedule', { sourceId: sourceId, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        const newId = result.newId;
                        this.schedules[newId] = {
                            name: newName.trim(),
                            createdBy: result.createdBy,
                            data: JSON.parse(JSON.stringify(this.schedules[sourceId].data))
                        };
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表複製成功！');
                    } catch (err) {
                        this.ui.showNotification(`複製失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }
        },

        handleScheduleSelectChange: async function(e) {
            const newId = e.target.value;
            if (this.isDirty) {
                if (!await this.modals.showConfirm('您有未儲存的變更，確定要切換課表並捨棄變更嗎？')) {
                    e.target.value = this.activeScheduleId; // Revert selection
                    return;
                }
            }
            if (newId === AppConfig.ALL_SCHEDULES_ID) {
                this.activeScheduleId = AppConfig.ALL_SCHEDULES_ID;
                
                const allTags = new Set();
                const allSchedulesData = {};

                Object.values(this.schedules).forEach(schedule => {
                    if (!schedule.data) return;
                    if (schedule.data.tags) {
                        schedule.data.tags.forEach(tag => allTags.add(tag));
                    }
                    if (schedule.data.scheduleData) {
                        Object.entries(schedule.data.scheduleData).forEach(([classroom, days]) => {
                            if (!allSchedulesData[classroom]) allSchedulesData[classroom] = {};
                            Object.entries(days).forEach(([day, courses]) => {
                                if (!allSchedulesData[classroom][day]) allSchedulesData[classroom][day] = [];
                                allSchedulesData[classroom][day].push(...courses);
                            });
                        });
                    }
                });
                
                this.tags = Array.from(allTags).sort();
                this.buildCourseColorMap(allSchedulesData);
                
                this.ui.renderScheduleTable();
                this.ui.updateGlobalUIForScheduleMode();
                localStorage.setItem('activeScheduleId', this.activeScheduleId);
            } else {
                this.loadSchedule(newId);
            }
        },

        // --- FILTER LOGIC ---
        loadAndApplyPersistedFilters: function() {
            const persistedTagsJSON = localStorage.getItem('activeTagFilters');
            if (persistedTagsJSON) {
                try {
                    const persistedTags = JSON.parse(persistedTagsJSON);
                    const allCurrentTags = new Set(this.getAllTags());
                    
                    // Filter out tags that no longer exist
                    const validPersistedTags = persistedTags.filter(tag => allCurrentTags.has(tag));
                    
                    this.activeFilters = validPersistedTags.map(tag => ({ type: 'tag', value: tag }));
                    
                    if (persistedTags.length !== validPersistedTags.length) {
                        // If some tags were removed, update localStorage
                        localStorage.setItem('activeTagFilters', JSON.stringify(validPersistedTags));
                    }
                } catch (e) {
                    console.error("Failed to parse persisted tag filters:", e);
                    localStorage.removeItem('activeTagFilters');
                    this.activeFilters = [];
                }
            } else {
                this.activeFilters = [];
            }
            this.ui.updateClearFilterButtonVisibility();
            this.ui.updateAdvancedFilterButtonState();
        },

        toggleAllTagFilterCheckboxes: function(shouldBeChecked) {
            AppElements.tagFilterList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = shouldBeChecked;
            });
        },

        applyTagFilters: function() {
            if (!this.tagFilterTagify) return;
            const selectedTags = this.tagFilterTagify.value.map(tag => tag.value);
            
            // Clear any non-tag filters before applying new tag filters
            this.activeFilters = this.activeFilters.filter(f => f.type === 'tag');
            
            // Add the new tags to the active filters
            const existingTags = new Set(this.activeFilters.map(f => f.value));
            selectedTags.forEach(tag => {
                if (!existingTags.has(tag)) {
                    this.activeFilters.push({ type: 'tag', value: tag });
                }
            });

            // Also, remove tags from activeFilters that are no longer in selectedTags
            const selectedTagsSet = new Set(selectedTags);
            this.activeFilters = this.activeFilters.filter(f => f.type !== 'tag' || selectedTagsSet.has(f.value));
            
            localStorage.setItem('activeTagFilters', JSON.stringify(selectedTags));

            this.ui.renderScheduleTable();
            this.ui.updateClearFilterButtonVisibility();
            this.historyModule.saveState();
        },

        clearTagFilters: function() {
            this.activeFilters = this.activeFilters.filter(f => f.type !== 'tag');
            localStorage.removeItem('activeTagFilters');
            
            if (this.tagFilterTagify) {
                this.tagFilterTagify.removeAllTags();
            }

            this.ui.renderScheduleTable();
            this.ui.updateClearFilterButtonVisibility();
            this.historyModule.saveState();
        },

        toggleAllFilterCheckboxes: function(shouldBeChecked) {
            AppElements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = shouldBeChecked;
            });
        },

        applyFilters: function() {
            const filterType = AppElements.filterTypeSelector.querySelector('input[name="filterType"]:checked').value;
            const selectedItems = Array.from(AppElements.filterCourseList.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            this.activeFilters = selectedItems.map(item => ({ type: filterType, value: item }));
            this.ui.renderScheduleTable();
            this.ui.updateClearFilterButtonVisibility();
            AppElements.filterModal.style.display = 'none';
        },

        clearFilters: function() {
            this.activeFilters = [];
            this.modals.populateFilterModal();
            this.ui.renderScheduleTable();
            this.ui.updateClearFilterButtonVisibility();
            this.ui.updateAdvancedFilterButtonState();
            AppElements.filterModal.style.display = 'none';
            this.historyModule.saveState();
        },

        // --- API COMMUNICATION ---
        loadVersions: async function() {
            const select = AppElements.versionHistorySelect;
            select.innerHTML = '<option>正在載入中...</option>';
            this.ui.showNotification('正在獲取版本列表...', 'info');
            
            try {
                const versions = await ServerApi.call('getVersions', this.activeScheduleId);
                if (!versions || versions.error) throw new Error(versions ? versions.error : '未知錯誤');
                
                select.innerHTML = '';
                if (versions.length > 0) {
                    versions.forEach(v => {
                        const option = document.createElement('option');
                        option.value = v.id;
                        option.textContent = `${new Date(v.id).toLocaleString()} by ${this.getShortUserName(v.user)}`;
                        select.appendChild(option);
                    });
                    this.ui.showNotification('版本列表已更新', 'success');
                } else {
                    select.innerHTML = '<option>此課表沒有歷史紀錄</option>';
                }
            } catch (error) {
                this.ui.showNotification('獲取版本列表失敗: ' + error.message, 'error');
                select.innerHTML = '<option>獲取失敗</option>';
            }
        },

        handleLoadVersion: async function() {
            const select = AppElements.versionHistorySelect;
            const versionId = select.value;
            if (!versionId || select.options[select.selectedIndex].text === '沒有歷史紀錄') {
                this.ui.showNotification('請選擇一個有效的版本', 'error');
                return;
            }
            if (this.isDirty && !await this.modals.showConfirm(`您有未儲存的變更，確定要讀取歷史版本並覆蓋當前的課表嗎？`)) {
                return;
            }
            AppElements.versionHistoryModal.style.display = 'none';
            this.ui.showLoading('正在讀取歷史版本...');

            try {
                const data = await ServerApi.call('getVersionData', versionId);
                if (!data || !data.success) throw new Error(data ? data.error : '未知錯誤');

                const currentSchedule = this.schedules[this.activeScheduleId];
                currentSchedule.data.classrooms = data.classrooms || [];
                currentSchedule.data.scheduleData = this.ensureDataIds(data.scheduleData || {});
                currentSchedule.data.tags = data.tags || [];
                
                this.saveSchedulesToLocal();
                this.loadSchedule(this.activeScheduleId);

                this.ui.updateSyncStatus(AppConfig.STATUS.OFFLINE, this.lastCloudModifiedTime);
                this.ui.showNotification(`已在本地載入版本: ${new Date(data.versionId).toLocaleString()}`, 'info');
            } catch (error) {
                this.ui.showNotification('讀取版本失敗: ' + error.message, 'error');
            } finally {
                this.ui.hideLoading();
            }
        },

        saveDataToLocal: function() {
            try {
                this.saveSchedulesToLocal();
                localStorage.setItem('activeScheduleId', this.activeScheduleId);
                localStorage.setItem('app_version', AppConfig.APP_VERSION);
                if (this.lastSyncTime) localStorage.setItem('lastSyncTime', this.lastSyncTime.toISOString());
            } catch (e) {
                console.error("保存數據到本地失敗:", e);
                this.ui.showNotification("保存數據失敗，可能是存儲空間不足", "error");
            }
        },

        loadDataFromServer: async function() {
            if (this.isConnecting) {
                this.ui.showNotification("A sync operation is already in progress.", "info");
                return;
            }
            this.isConnecting = true;
            this.ui.manageLoadingState('start', { message: '正在從雲端同步資料...' });

            try {
                const result = await ServerApi.call('getData');
                if (!result || result.error) throw new Error(result ? result.error : '從服務器獲取的數據為空');
                
                this.schedules = result.schedules || {};
                this.scheduleLastModified = {}; // Clear old timestamps
                for (const id in this.schedules) {
                    if (this.schedules[id].lastModified) {
                        this.scheduleLastModified[id] = this.schedules[id].lastModified;
                        // The timestamp is sensitive and only needed for the save operation,
                        // let's not keep it in the main data object that gets saved to local storage.
                        delete this.schedules[id].lastModified;
                    }
                }

                this.activeScheduleId = result.activeScheduleId || Object.keys(this.schedules)[0];
                this.activeMetadataTimestamp = result.metadataTimestamp;

                // After fetching data, the client decides which schedule to load.
                this.loadInitialSchedules();

                this.lastSyncTime = new Date();
                this.saveSchedulesToLocal();
                this.ui.manageLoadingState('end', { success: true, message: '從雲端讀取數據成功！' });

            } catch (error) {
                this.ui.manageLoadingState('end', { success: false, message: `讀取失敗: ${error.message}` });
            } finally {
                this.isConnecting = false;
            }
        },

        saveDataToServer: async function() {
            if (this.isConnecting) return;
            this.isConnecting = true;
            this.ui.manageLoadingState('start', { message: '正在檢查版本並儲存至雲端...' });

            try {
                const currentScheduleTimestamp = this.scheduleLastModified[this.activeScheduleId];
                if (!currentScheduleTimestamp) {
                    throw new Error("找不到當前課表的版本資訊，無法儲存。請嘗試重新載入。");
                }

                const dataToSend = {
                    scheduleId: this.activeScheduleId,
                    activeScheduleId: this.activeScheduleId,
                    lastModified: currentScheduleTimestamp, // *** STEP 4: Attach the specific timestamp
                    scheduleData: {
                        classrooms: this.classrooms,
                        scheduleData: this.scheduleData,
                        tags: this.tags
                    }
                };

                const saveResult = await ServerApi.call('saveData', dataToSend);

                // *** STEP 4: Handle new conflict error
                if (saveResult && saveResult.conflict) {
                    this.modals.showConfirm(saveResult.error, true); // Show the specific error from server
                    this.ui.manageLoadingState('end', { success: false, isConflict: true });
                    return;
                }

                if (!saveResult || !saveResult.success) {
                    throw new Error(saveResult?.error || '儲存時發生未知錯誤');
                }

                this.lastSyncTime = new Date();
                this.scheduleLastModified[this.activeScheduleId] = saveResult.lastModified;
                this.historyModule.updateCleanSnapshot();
                this.historyModule.checkDirty();
                this.ui.manageLoadingState('end', { success: true, message: '數據已成功儲存到雲端！' });

            } catch (error) {
                this.ui.manageLoadingState('end', { success: false, message: `數據儲存失敗: ${error.message}` });
            } finally {
                this.isConnecting = false;
            }
        },

        findNextUpcomingClasses: function() {
            this.nextUpcomingClassIds.clear();
            
            const today = new Date();
            const todayIndex = (today.getDay() === 0) ? 6 : today.getDay() - 1;

            // This feature is only active when viewing today in day mode.
            if (this.currentViewMode !== AppConfig.MODES.DAY || this.currentDayIndex !== todayIndex) {
                return;
            }

            const nowInMinutes = today.getHours() * 60 + today.getMinutes();
            const thresholdInMinutes = 30;
            let futureClasses = [];

            // First, find all classes in the future for today
            for (const classroom in this.scheduleData) {
                if (this.scheduleData[classroom]?.[todayIndex]) {
                    this.scheduleData[classroom][todayIndex].forEach(course => {
                        const startTimeInMinutes = this.timeToMinutes(course.timeStart);
                        if (startTimeInMinutes >= nowInMinutes) {
                            futureClasses.push(course);
                        }
                    });
                }
            }

            if (futureClasses.length > 0) {
                // Rule 1: Prioritize classes within the 30-minute threshold
                const withinThresholdClasses = futureClasses.filter(course => {
                    const startTimeInMinutes = this.timeToMinutes(course.timeStart);
                    const timeDifference = startTimeInMinutes - nowInMinutes;
                    return timeDifference >= 0 && timeDifference <= thresholdInMinutes;
                });

                if (withinThresholdClasses.length > 0) {
                    withinThresholdClasses.forEach(course => this.nextUpcomingClassIds.add(course.id));
                } else {
                    // Rule 2: If none in threshold, find the very next one(s)
                    const nextStartTime = Math.min(...futureClasses.map(c => this.timeToMinutes(c.timeStart)));
                    futureClasses.forEach(course => {
                        if (this.timeToMinutes(course.timeStart) === nextStartTime) {
                            this.nextUpcomingClassIds.add(course.id);
                        }
                    });
                }
            }
            // This function no longer needs to return a value; it just updates the state.
        },

        // --- UTILITY ---
        getAllTags: function() {
            const allTags = new Set();
            if (!this.scheduleData) return [];
            Object.values(this.scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(classItem => {
                            if (classItem.tags && Array.isArray(classItem.tags)) {
                                classItem.tags.forEach(tag => allTags.add(tag));
                            }
                        });
                    }
                });
            });
            return Array.from(allTags).sort();
        },

        getShortUserName: function(email) {
            if (!email || email.indexOf('@') === -1) return email;
            return email.split('@')[0];
        },

        isCurrentUserAdmin: function() {
            const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
            return fullEmail.toLowerCase() === 'cheerc@talented.com.tw';
        },

        canManageCurrentScheduleSettings: function() {
            if (this.isCurrentUserAdmin()) {
                return true;
            }
            if (this.activeScheduleId === AppConfig.ALL_SCHEDULES_ID) {
                return false; // Cannot manage settings in "All Schedules" view
            }
            const schedule = this.schedules[this.activeScheduleId];
            if (!schedule || !schedule.createdBy) {
                return false; // No schedule or creator info
            }
            return this.currentUserEmail === this.getShortUserName(schedule.createdBy);
        },

        ensureDataIds: function(scheduleData) {
            if (!scheduleData) return {};
            Object.values(scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(classItem => {
                            if (classItem && !classItem.id) {
                                classItem.id = this.generateUniqueId();
                            }
                            // Compatibility fix: Rename `departments` to `tags` if it exists
                            if (classItem && classItem.departments && !classItem.tags) {
                                classItem.tags = classItem.departments;
                                delete classItem.departments;
                            }
                        });
                    }
                });
            });
            return scheduleData;
        },

        generateUniqueId: function() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        },

        stringToHashCode: function(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
            }
            return hash;
        },

        buildCourseColorMap: function(dataSource = this.scheduleData) {
            this.courseColorMap = {};
            const allNames = new Set();
            if (!dataSource) return;

            Object.values(dataSource).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(item => allNames.add(item.name));
                    }
                });
            });

            const sortedNames = Array.from(allNames).sort();
            sortedNames.forEach(name => {
                const hash = this.stringToHashCode(name);
                const colorIndex = Math.abs(hash) % AppConfig.COURSE_COLORS.length;
                this.courseColorMap[name] = AppConfig.COURSE_COLORS[colorIndex];
            });
        },

        sortClassrooms: function(classroomList) {
            try {
                return [...classroomList].sort((a, b) => {
                    const numA = parseInt((a.match(/\d+/) || ['0'])[0]);
                    const numB = parseInt((b.match(/\d+/) || ['0'])[0]);
                    const hundredsA = Math.floor(numA / 100);
                    const hundredsB = Math.floor(numB / 100);
                    if (hundredsA !== hundredsB) return hundredsB - hundredsA;
                    return (numA % 100) - (numB % 100);
                });
            } catch (e) {
                console.error('排序教室失敗:', e);
                return classroomList || [];
            }
        },

        checkTimeConflict: function(classroom, day, newClass) {
            if (!this.scheduleData[classroom]?.[day]) return false;
            const newStart = this.timeToMinutes(newClass.timeStart);
            const newEnd = this.timeToMinutes(newClass.timeEnd);
            return this.scheduleData[classroom][day].some((existingClass) => {
                if (existingClass.id === newClass.id) return false;
                const existingStart = this.timeToMinutes(existingClass.timeStart);
                const existingEnd = this.timeToMinutes(existingClass.timeEnd);
                return newStart < existingEnd && newEnd > existingStart;
            });
        },

        timeToMinutes: function(timeStr) {
            try {
                const [hours, minutes] = timeStr.split(':').map(Number);
                return hours * 60 + minutes;
            } catch (e) {
                console.error('時間轉換失敗:', e, timeStr);
                return 0;
            }
        },

        formatTime: function(timeStr) {
            if (!timeStr) return '00:00';
            timeStr = timeStr.trim();
            if (AppConfig.TIME_REGEX.test(timeStr)) {
                const [hours, minutes] = timeStr.split(':');
                return hours.padStart(2, '0') + ':' + minutes.padStart(2, '0');
            }
            return '00:00';
        },

        filterDataByActiveFilters: function(data) {
            const nameFilters = new Set(this.activeFilters.filter(f => f.type === 'name').map(f => f.value));
            const tagFilters = new Set(this.activeFilters.filter(f => f.type === 'tag').map(f => f.value));
            const teacherFilters = new Set(this.activeFilters.filter(f => f.type === 'teacher').map(f => f.value));

            // If no filters of a certain type are active, the match should be true.
            if (nameFilters.size === 0 && tagFilters.size === 0 && teacherFilters.size === 0) {
                return data;
            }

            const filteredData = {};
            for (const classroom in data) {
                filteredData[classroom] = {};
                for (const day in data[classroom]) {
                    const filteredDay = data[classroom][day].filter(course => {
                        const nameMatch = nameFilters.size === 0 || nameFilters.has(course.name);
                        // Logic change: for tags/tags, check if the course has AT LEAST ONE of the selected tags.
                        const tagMatch = tagFilters.size === 0 || (course.tags && course.tags.some(d => tagFilters.has(d)));
                        const teacherMatch = teacherFilters.size === 0 || teacherFilters.has(course.teacher);
                        
                        // Logic change: Now we need to decide how filters interact.
                        // Let's assume for now that filters of DIFFERENT types are ANDed,
                        // but filters of the SAME type (like multiple tags) are ORed (which is handled by the .some() above).
                        // The current logic already does this.
                        return nameMatch && tagMatch && teacherMatch;
                    });
                    if (filteredDay.length > 0) {
                        filteredData[classroom][day] = filteredDay;
                    }
                }
            }
            return filteredData;
        },

        countOccurrences: function(predicate) {
            let count = 0;
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (predicate(item)) {
                            count++;
                        }
                    });
                }
            }
            return count;
        },

        updateAllOccurrences: function(predicate, updateFn) {
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (predicate(item)) {
                            updateFn(item);
                        }
                    });
                }
            }
        },

        handleDrop: function(evt) {
            const { from, to, item, newIndex } = evt;
            const classId = item.dataset.id;
            const fromClassroom = from.dataset.classroom, fromDay = parseInt(from.dataset.day);
            const toClassroom = to.dataset.classroom, toDay = parseInt(to.dataset.day);

            this.originalSourceListElement = null;

            if (from === to) {
                this.ui.renderScheduleTable();
                return;
            }

            const fromDaySchedule = this.scheduleData[fromClassroom]?.[fromDay] || [];
            const itemIndex = fromDaySchedule.findIndex(c => c.id === classId);
            
            if (itemIndex === -1) {
                console.error("Could not find dragged item in data model.");
                this.ui.renderScheduleTable();
                return;
            }
            
            const [movedItem] = fromDaySchedule.splice(itemIndex, 1);

            if (!this.scheduleData[toClassroom]) this.scheduleData[toClassroom] = {};
            if (!this.scheduleData[toClassroom][toDay]) this.scheduleData[toClassroom][toDay] = [];
            
            this.scheduleData[toClassroom][toDay].splice(newIndex, 0, movedItem);

            if (this.scheduleData[fromClassroom]?.[fromDay]?.length === 0) {
                delete this.scheduleData[fromClassroom][fromDay];
            }
            
            this.scheduleData[toClassroom][toDay].sort((a, b) => this.timeToMinutes(a.timeStart) - this.timeToMinutes(b.timeStart));
            
            this.ui.renderScheduleTable();
            this.saveDataToLocal();
            this.ui.showNotification('已移動課程');
            this.historyModule.saveState();
        }
    };

    // --- Initialization ---
    window.App = App; // Expose App to global scope for modules
    App.init();

})();
</script>
