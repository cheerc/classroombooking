<script>
(function() {
    // 將全局變數放入一個命名空間或對象，減少污染
    const App = {
        // --- STATE ---
        APP_VERSION: '6.1.1',
        TIME_REGEX: /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/,
        WEEKDAYS: ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'],
        COURSE_COLORS: [
            '#93c5fd', // Jordy Blue
            '#73EEDC', // Turquoise
            '#DBF4A7', // Mindaro
            '#fca5a5', // Melon
            '#5BC0EB', // Aero
            '#C5D8D1', // Ash grey
            '#23CE6B', // Emerald
            '#FDE74C', // Maize
            '#F5AE80', // Sandy Brown
            '#FF5E5B'  // Bittersweet
        ],
        classrooms: [],
        scheduleData: {},
        courseColorMap: {},
        lastSyncTime: null,
        lastCloudModifiedTime: null,
        loadingTimeout: null,
        isConnecting: false,
        history: [],
        historyIndex: -1,
        activeInlineForm: null,
        originalSourceListElement: null,
        isDirty: false, // Flag to track unsaved changes
        cleanStateSnapshot: '', // Snapshot of the last clean state
        activeFilters: [], // Array to hold active course name filters
        filterPresets: {}, // Object to hold all filter presets, loaded from server
        currentUserEmail: '', // To store the email of the current user

        elements: {
            loadingOverlay: document.getElementById('loading-overlay'),
            loadingText: document.getElementById('loading-text'),
            loadingCancel: document.getElementById('loading-cancel'),
            notification: document.getElementById('notification'),
            syncStatus: document.getElementById('sync-status'),
            syncStatusText: document.getElementById('sync-status-text'),
            lastSyncTimeText: document.getElementById('last-sync-time'),
            classroomNameInput: document.getElementById('classroom-name'),
            addClassroomBtn: document.getElementById('add-classroom'),
            classroomList: document.getElementById('classroom-list'),
            scheduleBody: document.getElementById('schedule-body'),
            saveToCloudBtn: document.getElementById('save-to-cloud-btn'),
            loadFromCloudBtn: document.getElementById('load-from-cloud-btn'),
            clearAllBtn: document.getElementById('clear-all'),
            undoBtn: document.getElementById('undo-btn'),
            redoBtn: document.getElementById('redo-btn'),
            versionHistorySelect: document.getElementById('version-history'),
            refreshVersionsBtn: document.getElementById('refresh-versions'),
            loadVersionBtn: document.getElementById('load-version'),
            showClassroomManagerBtn: document.getElementById('show-classroom-manager-btn'),
            classroomManagerModal: document.getElementById('classroom-manager-modal'),
            classroomManagerModalClose: document.getElementById('classroom-manager-modal-close'),
            showVersionHistoryBtn: document.getElementById('show-version-history-btn'),
            versionHistoryModal: document.getElementById('version-history-modal'),
            versionHistoryModalClose: document.getElementById('version-history-modal-close'),
            confirmModal: document.getElementById('confirm-modal'),
            confirmText: document.getElementById('confirm-text'),
            confirmOk: document.getElementById('confirm-ok'),
            confirmCancel: document.getElementById('confirm-cancel'),
            promptModal: document.getElementById('prompt-modal'),
            promptText: document.getElementById('prompt-text'),
            promptInput: document.getElementById('prompt-input'),
            promptOk: document.getElementById('prompt-ok'),
            promptCancel: document.getElementById('prompt-cancel'),
            showHelpBtn: document.getElementById('show-help-btn'),
            helpModal: document.getElementById('help-modal'),
            helpModalClose: document.getElementById('help-modal-close'),
            // Filter elements
            showFilterBtn: document.getElementById('show-filter-btn'),
            filterModal: document.getElementById('filter-modal'),
            filterModalClose: document.getElementById('filter-modal-close'),
            filterCourseList: document.getElementById('filter-course-list'),
            filterSelectAll: document.getElementById('filter-select-all'),
            filterDeselectAll: document.getElementById('filter-deselect-all'),
            filterApply: document.getElementById('filter-apply'),
            filterClear: document.getElementById('filter-clear'),
            filterPresetSelect: document.getElementById('filter-preset-select'),
            saveFilterPresetAsBtn: document.getElementById('save-filter-preset-as'),
            loadFilterPresetBtn: document.getElementById('load-filter-preset'),
            deleteFilterPresetBtn: document.getElementById('delete-filter-preset'),
            activeFilterDisplay: document.getElementById('active-filter-display'),
        },

        init: function() {
            const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
            this.currentUserEmail = this.getShortUserName(fullEmail);
            try {
                this.loadDataFromLocal();
            } catch (e) {
                console.error('從本地載入數據失敗:', e);
                this.classrooms = [];
                this.scheduleData = {};
            }
            this.updateClassroomList();
            this.renderScheduleTable();
            this.updateSyncStatus('offline');
            this.addEventListeners();
            this.resetHistory(); // This will also set the initial clean snapshot

            setTimeout(() => {
                this.loadDataFromServer().catch(error => {
                    console.warn("Initial data load failed:", error.message);
                    // No need to reset history again, already done
                });
            }, 500);
        },

        addEventListeners: function() {
            const els = this.elements;
            els.loadingCancel.addEventListener('click', () => {
                if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
                this.hideLoading();
                this.showNotification('已取消載入，使用本地數據', 'info');
                this.isConnecting = false;
            });
            els.addClassroomBtn.addEventListener('click', () => this.handleAddClassroom());
            els.saveToCloudBtn.addEventListener('click', async () => {
                if (await this.showConfirm('確定要將本地資料儲存到雲端嗎？<br>這將會建立一個新的版本紀錄。')) {
                    this.saveDataToServer();
                }
            });
            els.loadFromCloudBtn.addEventListener('click', async () => {
                if (this.isDirty && !await this.showConfirm('您有未儲存的變更，確定要從雲端讀取資料並覆蓋嗎？')) {
                    return;
                }
                this.loadDataFromServer();
            });
            els.clearAllBtn.addEventListener('click', () => this.handleClearAll());
            els.refreshVersionsBtn.addEventListener('click', () => this.loadVersions());
            els.loadVersionBtn.addEventListener('click', () => this.handleLoadVersion());
            els.undoBtn.addEventListener('click', () => this.undo());
            els.redoBtn.addEventListener('click', () => this.redo());
            
            // Modal Listeners
            els.showClassroomManagerBtn.addEventListener('click', () => els.classroomManagerModal.style.display = 'flex');
            els.classroomManagerModalClose.addEventListener('click', () => els.classroomManagerModal.style.display = 'none');
            els.classroomManagerModal.addEventListener('click', (e) => {
                if (e.target === els.classroomManagerModal) {
                    els.classroomManagerModal.style.display = 'none';
                }
            });

            els.showVersionHistoryBtn.addEventListener('click', () => els.versionHistoryModal.style.display = 'flex');
            els.versionHistoryModalClose.addEventListener('click', () => els.versionHistoryModal.style.display = 'none');
            els.versionHistoryModal.addEventListener('click', (e) => {
                if (e.target === els.versionHistoryModal) {
                    els.versionHistoryModal.style.display = 'none';
                }
            });

            els.classroomList.addEventListener('click', this.handleDeleteClassroomClick.bind(this));
            els.scheduleBody.addEventListener('click', this.handleScheduleBodyClick.bind(this));
            document.addEventListener('click', this.handleDocumentClick.bind(this), true);
            document.addEventListener('keydown', this.handleGlobalKeydown.bind(this));

            els.showHelpBtn.addEventListener('click', () => this.showHelpModal());
            els.helpModalClose.addEventListener('click', () => this.hideHelpModal());
            els.helpModal.addEventListener('click', (e) => {
                if (e.target === els.helpModal) {
                    this.hideHelpModal();
                }
            });

            // Add beforeunload listener to prevent accidental closing
            window.addEventListener('beforeunload', (e) => {
                if (this.isDirty) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            // Filter Listeners
            els.showFilterBtn.addEventListener('click', () => this.showFilterModal());
            els.filterModalClose.addEventListener('click', () => els.filterModal.style.display = 'none');
            els.filterModal.addEventListener('click', (e) => {
                if (e.target === els.filterModal) {
                    els.filterModal.style.display = 'none';
                }
            });
            els.filterSelectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(true));
            els.filterDeselectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(false));
            els.filterApply.addEventListener('click', () => this.applyFilters());
            els.filterClear.addEventListener('click', () => this.clearFilters());
            els.saveFilterPresetAsBtn.addEventListener('click', () => this.saveFilterPresetAs());
            els.loadFilterPresetBtn.addEventListener('click', () => this.loadFilterPreset());
            els.deleteFilterPresetBtn.addEventListener('click', () => this.deleteFilterPreset());
        },

        // --- Filter Logic ---
        showFilterModal: function() {
            this.populateFilterModal();
            this.updateFilterPresetDropdown();
            this.elements.filterModal.style.display = 'flex';
        },

        populateFilterModal: function() {
            const courseNames = new Set();
            Object.values(this.scheduleData).forEach(classroom => {
                Object.values(classroom).forEach(day => {
                    day.forEach(course => courseNames.add(course.name));
                });
            });

            const sortedNames = Array.from(courseNames).sort();
            const listElement = this.elements.filterCourseList;
            listElement.innerHTML = '';

            sortedNames.forEach(name => {
                const isChecked = this.activeFilters.includes(name);
                const div = document.createElement('div');
                div.className = 'flex items-center';
                div.innerHTML = `
                    <input type="checkbox" id="filter-${name}" value="${name}" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" ${isChecked ? 'checked' : ''}>
                    <label for="filter-${name}" class="ml-2 block text-sm text-gray-900 truncate">${name}</label>
                `;
                listElement.appendChild(div);
            });
        },

        toggleAllFilterCheckboxes: function(shouldBeChecked) {
            this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = shouldBeChecked;
            });
        },

        applyFilters: function() {
            const selectedCourses = [];
            this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                selectedCourses.push(cb.value);
            });
            this.activeFilters = selectedCourses;
            this.renderScheduleTable();
            this.updateActiveFilterDisplay();
            this.elements.filterModal.style.display = 'none';
            this.saveState(); // Make applying a filter an undoable action
        },

        clearFilters: function() {
            this.activeFilters = [];
            this.toggleAllFilterCheckboxes(false);
            this.renderScheduleTable();
            this.updateActiveFilterDisplay();
            this.elements.filterModal.style.display = 'none';
            this.saveState(); // Make clearing a filter an undoable action
        },

        updateActiveFilterDisplay: function() {
            const display = this.elements.activeFilterDisplay;
            if (this.activeFilters.length === 0) {
                display.textContent = '未套用任何篩選';
            } else {
                display.textContent = `已篩選 ${this.activeFilters.length} 門課程`;
            }
        },

        updateFilterPresetDropdown: function() {
            const presets = this.filterPresets;
            const select = this.elements.filterPresetSelect;
            select.innerHTML = '';
            const presetNames = Object.keys(presets);
            if (presetNames.length === 0) {
                select.innerHTML = '<option value="">沒有已儲存的組合</option>';
                select.disabled = true;
            } else {
                presetNames.sort().forEach(name => {
                    const preset = presets[name];
                    let displayText = name;
                    if (preset && typeof preset === 'object') {
                        const savedBy = preset.savedBy ? `由 ${this.getShortUserName(preset.savedBy)}` : '';
                        const modifiedAt = preset.modifiedAt ? ` 於 ${new Date(preset.modifiedAt).toLocaleString()}` : '';
                        if (savedBy || modifiedAt) {
                            displayText += ` (${savedBy}${modifiedAt} 儲存)`;
                        }
                    }
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = displayText;
                    select.appendChild(option);
                });
                select.disabled = false;
            }
        },

        saveFilterPresetAs: async function() {
            const selectedCourses = Array.from(this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

            if (selectedCourses.length === 0) {
                this.showNotification('沒有選擇任何課程，無法儲存空篩選。', 'info');
                return;
            }

            const presetName = await this.showPrompt('請為這個篩選組合命名：');
            if (!presetName || presetName.trim() === '') {
                this.showNotification('已取消儲存，名稱不能為空。', 'info');
                return;
            }

            if (this.filterPresets[presetName] && !await this.showConfirm(`"${presetName}" 已存在，確定要覆蓋嗎？`)) {
                return;
            }

            this.filterPresets[presetName] = {
                courses: selectedCourses,
                savedBy: this.currentUserEmail,
                modifiedAt: new Date().toISOString()
            };
            this.showNotification(`已成功儲存篩選組合 "${presetName}"！`, 'success');
            this.updateFilterPresetDropdown();
            this.saveState(); // This will trigger dirty check
        },

        loadFilterPreset: function() {
            const presetName = this.elements.filterPresetSelect.value;
            if (!presetName) {
                this.showNotification('請先從下拉選單中選擇一個組合。', 'info');
                return;
            }
            const preset = this.filterPresets[presetName];

            if (preset) {
                // Handle both old and new data structures for backward compatibility
                const presetCourses = Array.isArray(preset) ? preset : preset.courses;
                this.activeFilters = presetCourses || [];
                this.populateFilterModal(); // Refresh checkboxes in modal
                this.applyFilters();
                this.showNotification(`已成功讀取並套用 "${presetName}"！`, 'success');
            } else {
                this.showNotification('找不到指定的篩選組合。', 'error');
            }
        },

        deleteFilterPreset: async function() {
            const presetName = this.elements.filterPresetSelect.value;
            if (!presetName) {
                this.showNotification('請先從下拉選單中選擇一個要刪除的組合。', 'info');
                return;
            }

            if (await this.showConfirm(`確定要刪除篩選組合 "${presetName}" 嗎？`)) {
                delete this.filterPresets[presetName];
                this.showNotification(`已刪除組合 "${presetName}"`, 'success');
                this.updateFilterPresetDropdown();
                this.saveState(); // This will trigger dirty check
            }
        },

        syncFilterPresetsOnRename: function(oldName, newName) {
            let isChanged = false;
            for (const presetName in this.filterPresets) {
                const preset = this.filterPresets[presetName];
                // Handle both old and new data structures
                const courseList = Array.isArray(preset) ? preset : preset.courses;
                
                if (courseList) {
                    const index = courseList.indexOf(oldName);
                    if (index > -1) {
                        courseList[index] = newName;
                        isChanged = true;
                    }
                }
            }
            if (isChanged) {
                this.showNotification('已自動同步更新儲存的篩選組合。', 'info', 4000);
                // No need to call saveState() here as it will be called by the parent function
            }
        },

        handleGlobalKeydown: function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                if (this.elements.confirmModal.style.display !== 'none') {
                    this.elements.confirmCancel.click();
                    return;
                }
                if (this.activeInlineForm) {
                    this.activeInlineForm.close();
                    return;
                }
                if (this.elements.helpModal.style.display !== 'none') {
                    this.hideHelpModal();
                    return;
                }
                if (this.elements.classroomManagerModal.style.display !== 'none') {
                    this.elements.classroomManagerModal.style.display = 'none';
                    return;
                }
                if (this.elements.versionHistoryModal.style.display !== 'none') {
                    this.elements.versionHistoryModal.style.display = 'none';
                    return;
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                e.preventDefault();
                this.undo();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
                e.preventDefault();
                this.redo();
            }
        },

        handleDocumentClick: function(e) {
            if (e.target.closest('.class-item')) {
                return;
            }
            if (!e.target.closest('.inline-add-form')) {
                this.clearAllSelections();
            }
            if (this.activeInlineForm && !e.target.closest('.inline-add-form') && !this.activeInlineForm.isDirty()) {
                this.activeInlineForm.close(true);
            }
        },

        handleEmptyCellDoubleClick: async function(e, cell) {
            if (this.activeInlineForm) {
                const isClosed = await this.activeInlineForm.close();
                if (!isClosed) return;
            }
            const classroom = cell.dataset.classroom;
            const day = parseInt(cell.dataset.day);
            if (!classroom || isNaN(day)) return;
            const daySelectorHtml = this.WEEKDAYS.map((dayName, index) => `
                <label>
                    <input type="checkbox" class="inline-day-checkbox" value="${index}" ${index === day ? 'checked' : ''}>
                    ${dayName.replace('星期', '')}
                </label>
            `).join('');
            const formDiv = document.createElement('div');
            formDiv.setAttribute('class', 'inline-add-form');
            formDiv.innerHTML = `
                <button title="取消" class="inline-add-cancel-btn">×</button>
                <div class="inline-day-selector">${daySelectorHtml}</div>
                <input type="text" placeholder="課程名稱" class="inline-input" name="name" required>
                <div class="inline-time-inputs">
                    <input type="time" class="inline-input" name="timeStart" required>
                    <span>-</span>
                    <input type="time" class="inline-input" name="timeEnd" required>
                </div>
                <input type="text" placeholder="使用人" class="inline-input" name="teacher">
                <div class="inline-form-actions">
                    <button title="儲存" class="save-inline">✓</button>
                </div>
            `;
            cell.appendChild(formDiv);
            formDiv.querySelector('input[name="name"]').focus();
            const isDirty = () => {
                return formDiv.querySelector('input[name="name"]').value.trim() !== '' ||
                       formDiv.querySelector('input[name="timeStart"]').value.trim() !== '' ||
                       formDiv.querySelector('input[name="timeEnd"]').value.trim() !== '' ||
                       formDiv.querySelector('input[name="teacher"]').value.trim() !== '';
            };
            const closeHandler = async (force = false) => {
                if (!force && isDirty()) {
                    if (!await this.showConfirm('您有未儲存的變更，確定要捨棄嗎？')) {
                        return false;
                    }
                }
                formDiv.remove();
                this.activeInlineForm = null;
                return true;
            };
            this.activeInlineForm = { close: closeHandler, isDirty: isDirty };
            const handleSave = () => {
                const name = formDiv.querySelector('input[name="name"]').value.trim();
                const timeStart = formDiv.querySelector('input[name="timeStart"]').value.trim();
                const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value.trim();
                const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
                const selectedDays = Array.from(formDiv.querySelectorAll('.inline-day-checkbox:checked')).map(cb => parseInt(cb.value));
                if (!name) { this.showNotification('課程名稱不能為空！', 'error'); return; }
                if (selectedDays.length === 0) { this.showNotification('請至少選擇一個星期！', 'error'); return; }
                if (!timeStart || !timeEnd) { this.showNotification('請輸入完整的開始與結束時間！', 'error'); return; }
                const formattedTimeStart = this.formatTime(timeStart);
                const formattedTimeEnd = this.formatTime(timeEnd);
                if (this.timeToMinutes(formattedTimeStart) >= this.timeToMinutes(formattedTimeEnd)) { this.showNotification('開始時間不能晚於或等於結束時間！', 'error'); return; }
                let hasConflictOccurred = false;
                if (!this.courseColorMap[name]) this.buildCourseColorMap();
                selectedDays.forEach(selectedDay => {
                    const classItem = { id: this.generateUniqueId(), name, timeStart: formattedTimeStart, timeEnd: formattedTimeEnd, teacher };
                    if (this.checkTimeConflict(classroom, selectedDay, classItem)) {
                        this.showNotification(`在 ${classroom} ${this.WEEKDAYS[selectedDay]} 有時間衝突！`, 'info', 5000);
                        hasConflictOccurred = true;
                    }
                    if (!this.scheduleData[classroom]) this.scheduleData[classroom] = {};
                    if (!this.scheduleData[classroom][selectedDay]) this.scheduleData[classroom][selectedDay] = [];
                    const daySchedule = this.scheduleData[classroom][selectedDay];
                    const insertIndex = daySchedule.findIndex(item => this.timeToMinutes(item.timeStart) > this.timeToMinutes(classItem.timeStart));
                    daySchedule.splice(insertIndex === -1 ? daySchedule.length : insertIndex, 0, classItem);
                });
                if (selectedDays.length > 0) {
                    if (!hasConflictOccurred) this.showNotification('已新增課程');
                    this.renderScheduleTable();
                    this.saveDataToLocal();
                    this.saveState();
                }
                formDiv.remove();
                this.activeInlineForm = null;
            };
            formDiv.querySelector('.save-inline').addEventListener('click', handleSave);
            formDiv.querySelector('.inline-add-cancel-btn').addEventListener('click', () => closeHandler());
            formDiv.addEventListener('keydown', (evt) => {
                if (evt.key === 'Enter') { evt.preventDefault(); handleSave(); } 
                else if (evt.key === 'Escape') { evt.preventDefault(); closeHandler(); }
            });
        },

        handleScheduleBodyClick: function(event) {
            const classElement = event.target.closest('.class-item');
            const deleteBtn = event.target.closest('.delete-btn');
            if (deleteBtn) {
                this.handleDeleteClassClick(event, deleteBtn);
                return;
            }
            const cell = event.target.closest('.schedule-cell');
            if (!classElement && cell && !cell.querySelector('.inline-add-form')) {
                if (this.clickTimer && this.lastClickedId === 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    this.handleEmptyCellDoubleClick(event, cell);
                } else {
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day;
                    this.clickTimer = setTimeout(() => {
                        this.clearAllSelections();
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
                return;
            }
            if (classElement) {
                const classId = classElement.dataset.id;
                if (this.clickTimer && this.lastClickedId === classId) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    this.handleEditFieldClick(event, event.target.closest('.editable') || classElement.querySelector('.editable'));
                } else {
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = classId;
                    this.clickTimer = setTimeout(() => {
                        this.toggleSelection(classElement);
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
            }
        },

        handleDeleteClassroomClick: async function(event) {
            const btn = event.target.closest('.delete-classroom');
            if (!btn) return;
            const classroom = btn.getAttribute('data-classroom');
            if (this.scheduleData[classroom] && Object.values(this.scheduleData[classroom]).some(day => day.length > 0)) {
                this.showNotification('無法刪除教室：請先移除此教室的所有課程登記！', 'error', 5000);
                return;
            }
            if (await this.showConfirm(`確定要刪除教室 "${classroom}" 嗎？`)) {
                this.classrooms = this.classrooms.filter(c => c !== classroom);
                delete this.scheduleData[classroom];
                this.updateClassroomList();
                this.renderScheduleTable();
                this.saveDataToLocal();
                this.showNotification('已刪除教室: ' + classroom);
                this.saveState();
            }
        },

        handleDeleteClassClick: async function(event, btn) {
            const classElement = btn.closest('.class-item');
            const classId = classElement.dataset.id;
            const classroom = btn.dataset.classroom;
            const day = parseInt(btn.dataset.day);
            const className = classElement.querySelector('[data-field="name"]').textContent;
            if (await this.showConfirm(`確定要刪除課程 "${className}" 嗎？`)) {
                if (!this.scheduleData[classroom] || !this.scheduleData[classroom][day]) return;
                const classIndex = this.scheduleData[classroom][day].findIndex(c => c.id === classId);
                if (classIndex > -1) {
                    this.scheduleData[classroom][day].splice(classIndex, 1);
                    if (this.scheduleData[classroom][day].length === 0) {
                        delete this.scheduleData[classroom][day];
                    }
                    this.renderScheduleTable();
                    this.showNotification('已刪除課程');
                    this.saveDataToLocal();
                    this.saveState();
                }
            }
        },

        handleEditFieldClick: function(e, element) {
            this.clearAllSelections();
            if (element.querySelector('input')) return;
            e.stopPropagation();

            const field = element.dataset.field;
            const classElement = element.closest('.class-item');
            const classId = classElement.dataset.id;
            const classroom = element.closest('td').dataset.classroom;
            const day = parseInt(element.closest('td').dataset.day);
            
            const classItem = this.scheduleData[classroom]?.[day]?.find(c => c.id === classId);
            if (!classItem) return;

            const originalName = classItem.name;
            const originalTeacher = classItem.teacher;
            let currentValue = classItem[field];
            if (field === 'time') {
                currentValue = `${classItem.timeStart}-${classItem.timeEnd}`;
            }
            
            if (field === 'time') {
                const timeStartInput = document.createElement('input');
                timeStartInput.type = 'time';
                timeStartInput.value = classItem.timeStart;
                let timeInputClass = 'inline-input';
                timeStartInput.setAttribute('class', timeInputClass);
                
                const timeEndInput = document.createElement('input');
                timeEndInput.type = 'time';
                timeEndInput.value = classItem.timeEnd;
                timeEndInput.setAttribute('class', timeInputClass);

                const timeContainer = document.createElement('div');
                timeContainer.setAttribute('class', 'inline-time-inputs');
                timeContainer.appendChild(timeStartInput);
                timeContainer.appendChild(document.createTextNode(' - '));
                timeContainer.appendChild(timeEndInput);
                
                element.innerHTML = '';
                element.appendChild(timeContainer);
                timeStartInput.focus();

                const cleanup = (isSuccess) => {
                    timeStartInput.removeEventListener('blur', blurHandler);
                    timeEndInput.removeEventListener('blur', blurHandler);
                    timeContainer.removeEventListener('keydown', handleKeydown);
                    if (!isSuccess) {
                       this.renderScheduleTable();
                    }
                };

                const handleUpdate = () => {
                    const newStart = this.formatTime(timeStartInput.value);
                    const newEnd = this.formatTime(timeEndInput.value);

                    if (newStart === classItem.timeStart && newEnd === classItem.timeEnd) {
                        cleanup(true);
                        this.renderScheduleTable();
                        return;
                    }

                    if (this.timeToMinutes(newStart) >= this.timeToMinutes(newEnd)) {
                        this.showNotification('開始時間不能晚於或等於結束時間！', 'error');
                        cleanup(false);
                        return;
                    }
                    
                    classItem.timeStart = newStart;
                    classItem.timeEnd = newEnd;
                    
                    this.renderScheduleTable();
                    this.showNotification('已更新課程資訊');
                    this.saveDataToLocal();
                    this.saveState();
                };

                const handleKeydown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); timeEndInput.blur(); } 
                    else if (e.key === 'Escape') { e.preventDefault(); cleanup(false); }
                };

                const blurHandler = (e) => {
                    if (e.relatedTarget === timeStartInput || e.relatedTarget === timeEndInput) {
                        return;
                    }
                    handleUpdate();
                };

                timeStartInput.addEventListener('blur', blurHandler);
                timeEndInput.addEventListener('blur', blurHandler);
                timeContainer.addEventListener('keydown', handleKeydown);
                return;
            }

            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentValue;
            let inputClasses = 'w-full p-1 border border-blue-500 rounded';
            input.setAttribute('class', inputClasses);
            element.innerHTML = '';
            element.appendChild(input);
            input.focus();
            input.select();

            const cleanup = (isSuccess) => {
                input.removeEventListener('blur', handleUpdate);
                input.removeEventListener('keydown', handleKeydown);
                if (!isSuccess) {
                   this.renderScheduleTable();
                }
            };

            const handleUpdate = async () => {
                let newValue = input.value.trim();
                
                if (newValue === currentValue) {
                    cleanup(true);
                    this.renderScheduleTable();
                    return;
                }

                if (field === 'name' && !newValue) {
                    this.showNotification('課程名稱不能為空！', 'error');
                    cleanup(false);
                    return;
                }

                if (field === 'name') {
                    const otherOccurrences = this.countNameOccurrences(originalName, classId);
                    if (otherOccurrences > 0) {
                        const confirmAll = await this.showConfirm(`找到 ${otherOccurrences} 個其他名為 "${originalName}" 的課程。<br>要全部一起改名為 "${newValue}" 嗎？`);
                        if (confirmAll) {
                            this.updateAllNameOccurrences(originalName, newValue);
                            this.syncFilterPresetsOnRename(originalName, newValue);

                            // Also update the currently active filter to reflect the change
                            const activeFilterIndex = this.activeFilters.indexOf(originalName);
                            if (activeFilterIndex > -1) {
                                this.activeFilters[activeFilterIndex] = newValue;
                            }
                        } else {
                            classItem.name = newValue;
                        }
                    } else {
                        classItem.name = newValue;
                    }
                    this.buildCourseColorMap();
                } else if (field === 'teacher') {
                    const otherOccurrences = this.countTeacherOccurrences(originalName, originalTeacher, classId);
                    if (otherOccurrences > 0) {
                        const confirmAll = await this.showConfirm(`找到 ${otherOccurrences} 堂其他由 "${originalTeacher}" 上的 "${originalName}" 課程。<br>要將使用人一起變更為 "${newValue}" 嗎？`);
                        if (confirmAll) {
                            this.updateAllTeacherOccurrences(originalName, originalTeacher, newValue);
                        } else {
                            classItem.teacher = newValue; // If user cancels, update only the current item
                        }
                    } else {
                        classItem.teacher = newValue;
                    }
                }

                this.renderScheduleTable();
                this.showNotification('已更新課程資訊');
                this.saveDataToLocal();
                this.saveState();
            };

            const handleKeydown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); } 
                else if (e.key === 'Escape') { e.preventDefault(); cleanup(false); }
            };
            input.addEventListener('blur', handleUpdate);
            input.addEventListener('keydown', handleKeydown);
        },

        // --- Data & API ---
        loadVersions: function() {
            this.showNotification('正在獲取版本列表...', 'info');
            google.script.run
                .withSuccessHandler((versions) => {
                    if (!versions || versions.error) {
                        this.showNotification('獲取版本列表失敗: ' + (versions ? versions.error : '未知錯誤'), 'error');
                        return;
                    }
                    const select = this.elements.versionHistorySelect;
                    select.innerHTML = '';
                    if (versions.length > 0) {
                        versions.forEach(v => {
                            const option = document.createElement('option');
                            option.value = v.id;
                            option.textContent = `${new Date(v.id).toLocaleString()} by ${v.user}`;
                            select.appendChild(option);
                        });
                    } else {
                        select.innerHTML = '<option>沒有歷史紀錄</option>';
                    }
                    this.showNotification('版本列表已更新', 'success');
                })
                .withFailureHandler((error) => this.showNotification('獲取版本列表失敗: ' + error.message, 'error'))
                .getVersions();
        },

        handleLoadVersion: async function() {
            const select = this.elements.versionHistorySelect;
            const versionId = select.value;
            if (!versionId || select.options[select.selectedIndex].text === '沒有歷史紀錄') {
                this.showNotification('請選擇一個有效的版本', 'error');
                return;
            }
            if (this.isDirty && !await this.showConfirm(`您有未儲存的變更，確定要讀取歷史版本並覆蓋嗎？`)) {
                return;
            }
            this.elements.versionHistoryModal.style.display = 'none';
            this.showLoading('正在讀取歷史版本...');
            google.script.run
                .withSuccessHandler((data) => {
                    this.hideLoading();
                    if (data && data.success) {
                        this.classrooms = data.classrooms || [];
                        this.scheduleData = this.ensureDataIds(data.scheduleData || {});
                        this.filterPresets = data.filterPresets || {}; // Load from server
                        this.buildCourseColorMap();
                        this.saveDataToLocal(); // Still save to local for offline access
                        this.updateClassroomList();
                        this.renderScheduleTable();
                        this.updateSyncStatus('offline', this.lastCloudModifiedTime);
                        this.showNotification('已在本地載入版本: ' + new Date(data.versionId).toLocaleString(), 'info');
                        this.resetHistory();
                    } else {
                        this.showNotification('讀取版本失敗: ' + (data ? data.error : '未知錯誤'), 'error');
                    }
                })
                .withFailureHandler((error) => {
                    this.hideLoading();
                    this.showNotification('讀取版本失敗: ' + error.message, 'error');
                })
                .getVersionData(versionId);
        },

        loadDataFromLocal: function() {
            try {
                this.classrooms = JSON.parse(localStorage.getItem('classrooms')) || [];
                this.scheduleData = this.ensureDataIds(JSON.parse(localStorage.getItem('scheduleData')) || {});
                // filterPresets are now loaded from server, not localStorage
                this.buildCourseColorMap();
                this.lastSyncTime = localStorage.getItem('lastSyncTime') ? new Date(localStorage.getItem('lastSyncTime')) : null;
            } catch (e) {
                console.error('從本地載入數據失敗:', e);
                this.classrooms = []; this.scheduleData = {}; this.lastSyncTime = null;
                this.showNotification("從本地載入數據失敗，數據可能已損壞", "error");
            }
        },

        saveDataToLocal: function() {
            try {
                localStorage.setItem('classrooms', JSON.stringify(this.classrooms || []));
                localStorage.setItem('scheduleData', JSON.stringify(this.scheduleData || {}));
                localStorage.setItem('app_version', this.APP_VERSION);
                if (this.lastSyncTime) localStorage.setItem('lastSyncTime', this.lastSyncTime.toISOString());
            } catch (e) {
                console.error("保存數據到本地失敗:", e);
                this.showNotification("保存數據失敗，可能是存儲空間不足", "error");
            }
        },

        loadDataFromServer: function() {
            return new Promise((resolve, reject) => {
                if (this.isConnecting) return reject(new Error("A sync operation is already in progress."));
                this.isConnecting = true;
                this.showLoading('從雲端讀取數據...');
                this.updateSyncStatus('syncing');
                [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = true);

                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    return setTimeout(() => this.handleApiError(reject, new Error('google.script.run is not available.')), 1000);
                }

                google.script.run
                    .withSuccessHandler((result) => {
                        this.handleApiSuccess(() => {
                            if (!result || result.error) throw new Error(result ? result.error : '從服務器獲取的數據為空');
                            this.classrooms = result.classrooms || [];
                            this.scheduleData = this.ensureDataIds(result.scheduleData || {});
                            this.filterPresets = result.filterPresets || {}; // Load from server
                            this.buildCourseColorMap();
                            this.updateLastModifiedTime(result.lastModified);
                            this.lastSyncTime = new Date();
                            this.saveDataToLocal(); // Still save to local for offline access
                            this.updateClassroomList();
                            this.renderScheduleTable();
                            this.updateSyncStatus('online', result.lastModified);
                            this.showNotification('從雲端讀取數據成功！');
                            this.resetHistory();
                            resolve(result);
                        }, reject);
                    })
                    .withFailureHandler((error) => this.handleApiError(reject, error, '從雲端讀取數據失敗'))
                    .getData();
            });
        },

        saveDataToServer: function() {
            if (this.isConnecting) return;
            this.isConnecting = true;
            this.showLoading('正在檢查雲端資料版本...');
            this.updateSyncStatus('syncing');
            [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = true);

            if (typeof google === 'undefined' || !google.script || !google.script.run) {
                return setTimeout(() => this.handleApiError(() => {}, new Error('google.script.run is not available.')), 1000);
            }

            google.script.run
                .withSuccessHandler(latestData => {
                    if (latestData.error) throw new Error(latestData.error);
                    const serverLastModified = latestData.lastModified ? new Date(latestData.lastModified).getTime() : null;
                    const localLastModified = this.lastCloudModifiedTime ? this.lastCloudModifiedTime.getTime() : null;

                    if (serverLastModified === localLastModified || !localLastModified) {
                        this.showLoading('版本一致，正在保存數據...');
                        const dataToSend = {
                            classrooms: JSON.parse(JSON.stringify(this.classrooms || [])),
                            scheduleData: JSON.parse(JSON.stringify(this.scheduleData || {})),
                            filterPresets: JSON.parse(JSON.stringify(this.filterPresets || {}))
                        };
                        google.script.run
                            .withSuccessHandler(saveResult => {
                                this.handleApiSuccess(() => {
                                    if (!saveResult || !saveResult.success) throw new Error(saveResult?.error || '儲存時發生未知錯誤');
                                    this.lastSyncTime = new Date();
                                    this.updateLastModifiedTime(saveResult.lastModified);
                                    this.updateSyncStatus('online', saveResult.lastModified);
                                    this.showNotification('數據已成功儲存到雲端！');
                                    this.saveDataToLocal();
                                    this.updateCleanSnapshot();
                                    this.checkDirty();
                                });
                            })
                            .withFailureHandler(error => this.handleApiError(() => {}, error, '數據儲存失敗'))
                            .saveData(dataToSend);
                    } else {
                        this.handleApiSuccess(() => {
                            this.updateSyncStatus('error');
                            const conflictMessage = '儲存失敗！雲端資料已被其他人修改。<br><br>為避免覆蓋他人工作，請先「從雲端讀取資料」同步後，再重新進行您的變更。';
                            this.showConfirm(conflictMessage, true);
                        });
                    }
                })
                .withFailureHandler(error => this.handleApiError(() => {}, error, '檢查雲端版本失敗'))
                .getData();
        },

        handleApiSuccess: function(logic, reject) {
            try {
                logic();
            } catch (error) {
                this.showNotification('處理數據失敗: ' + error.message, 'error');
                this.updateSyncStatus('error');
                if (reject) reject(error);
            } finally {
                this.hideLoading();
                this.isConnecting = false;
                [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = false);
            }
        },

        handleApiError: function(reject, error, message = '無法連接到雲端') {
            this.showNotification(`${message}: ${error.message}`, 'error');
            this.updateSyncStatus('error');
            this.hideLoading();
            this.isConnecting = false;
            [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = false);
            if (reject) reject(error);
        },

        showLoading: function(message = '載入中，請稍候...') {
            this.elements.loadingText.textContent = message;
            this.elements.loadingOverlay.style.display = 'flex';
            if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
            this.loadingTimeout = setTimeout(() => {
                this.hideLoading();
                this.showNotification('載入超時，使用本地數據', 'error');
                this.isConnecting = false;
            }, 30000);
        },

        hideLoading: function() {
            this.elements.loadingOverlay.style.display = 'none';
            if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
        },

        showConfirm: function(message, isAlert = false) {
            return new Promise((resolve) => {
                this.elements.confirmText.innerHTML = message;
                this.elements.confirmCancel.style.display = isAlert ? 'none' : 'inline-block';
                this.elements.confirmModal.style.display = 'flex';
                const okHandler = () => { cleanup(); resolve(true); };
                const cancelHandler = () => { cleanup(); resolve(false); };
                const cleanup = () => {
                    this.elements.confirmOk.removeEventListener('click', okHandler);
                    this.elements.confirmCancel.removeEventListener('click', cancelHandler);
                    this.elements.confirmModal.style.display = 'none';
                };
                this.elements.confirmOk.addEventListener('click', okHandler, { once: true });
                this.elements.confirmCancel.addEventListener('click', cancelHandler, { once: true });
            });
        },

        showPrompt: function(message, defaultValue = '') {
            return new Promise((resolve) => {
                const els = this.elements;
                els.promptText.textContent = message;
                els.promptInput.value = defaultValue;
                els.promptModal.style.display = 'flex';
                els.promptInput.focus();
                els.promptInput.select();

                const okHandler = () => {
                    cleanup();
                    resolve(els.promptInput.value);
                };

                const cancelHandler = () => {
                    cleanup();
                    resolve(null); // Resolve with null on cancel
                };

                const keydownHandler = (e) => {
                    if (e.key === 'Enter') {
                        okHandler();
                    } else if (e.key === 'Escape') {
                        cancelHandler();
                    }
                };

                const cleanup = () => {
                    els.promptOk.removeEventListener('click', okHandler);
                    els.promptCancel.removeEventListener('click', cancelHandler);
                    els.promptInput.removeEventListener('keydown', keydownHandler);
                    els.promptModal.style.display = 'none';
                };

                els.promptOk.addEventListener('click', okHandler, { once: true });
                els.promptCancel.addEventListener('click', cancelHandler, { once: true });
                els.promptInput.addEventListener('keydown', keydownHandler);
            });
        },

        showHelpModal: function() {
            this.elements.helpModal.style.display = 'flex';
        },

        hideHelpModal: function() {
            this.elements.helpModal.style.display = 'none';
        },

        updateSyncStatus: function(status, time) {
            const els = this.elements;
            let statusText = '', timeText = '', statusClass = '';
            switch (status) {
                case 'syncing': statusText = '正在同步...'; statusClass = 'syncing'; break;
                case 'online': statusText = '資料已是最新'; statusClass = 'online'; if (time) timeText = '雲端更新於: ' + new Date(time).toLocaleString(); break;
                case 'offline': statusText = '離線模式'; statusClass = 'offline'; if (this.lastCloudModifiedTime) timeText = '雲端最後更新: ' + this.lastCloudModifiedTime.toLocaleString(); break;
                case 'error': statusText = '同步失敗'; statusClass = 'error'; timeText = '請檢查網路連線或稍後再試'; break;
            }
            els.syncStatusText.textContent = statusText;
            els.lastSyncTimeText.textContent = timeText;
            els.syncStatus.setAttribute('class', 'sync-status ' + statusClass);
        },

        updateLastModifiedTime: function(time) {
            try { this.lastCloudModifiedTime = time ? new Date(time) : null; } 
            catch (e) { console.error("解析雲端修改時間失敗:", e); this.lastCloudModifiedTime = null; }
        },

        showNotification: function(message, type = 'success', duration = 3000) {

            notification.innerHTML = message;
            notification.classList.remove('success', 'error', 'info');
            notification.classList.add(type, 'show');
            setTimeout(() => notification.classList.remove('show'), duration);
        },

        createClassElement: function(classItem, classroom, day, overrideColor = null) {
            const hasConflict = this.checkTimeConflict(classroom, day, classItem);
            const conflictIcon = hasConflict 
                ? `<div class="conflict-icon" title="時間衝突"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.752a3 3 0 01-2.598 4.5H4.644a3 3 0 01-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg></div>`
                : '';
            
            const bgColor = overrideColor || this.courseColorMap[classItem.name] || '#E2E8F0';

            const classDiv = document.createElement('div');
            let classString = `class-item ${hasConflict ? 'conflict' : ''}`;
            classDiv.setAttribute('class', classString);
            classDiv.style.backgroundColor = bgColor;
            classDiv.dataset.id = classItem.id;
            classDiv.dataset.name = classItem.name;
            classDiv.innerHTML = `
                <div class="font-medium editable" data-field="name">${classItem.name}</div>
                <div class="editable" data-field="time">${classItem.timeStart}-${classItem.timeEnd}</div>
                <div class="editable" data-field="teacher">${classItem.teacher}</div>
                <span class="delete-btn" data-classroom="${classroom}" data-day="${day}">×</span>
                ${conflictIcon}
            `;
            return classDiv;
        },

        toggleSelection: function(clickedElement) {
            const courseName = clickedElement.dataset.name;
            const isAlreadyPrimary = clickedElement.classList.contains('primary-selection');

            this.clearAllSelections();

            if (!isAlreadyPrimary) {
                const allClassElements = document.querySelectorAll('.class-item');
                allClassElements.forEach(el => {
                    if (el.dataset.name === courseName) {
                        if (el === clickedElement) {
                            el.classList.add('primary-selection');
                        } else {
                            el.classList.add('selected');
                        }
                    }
                });
            }
        },

        clearAllSelections: function() {
            document.querySelectorAll('.class-item.selected, .class-item.primary-selection').forEach(el => {
                el.classList.remove('selected', 'primary-selection');
            });
        },

        renderScheduleTable: function() {
            try {
                let dataToRender = this.scheduleData;
                if (this.activeFilters && this.activeFilters.length > 0) {
                    dataToRender = {};
                    const filteredSet = new Set(this.activeFilters);
                    for (const classroom in this.scheduleData) {
                        dataToRender[classroom] = {};
                        for (const day in this.scheduleData[classroom]) {
                            const filteredDay = this.scheduleData[classroom][day].filter(course => filteredSet.has(course.name));
                            if (filteredDay.length > 0) {
                                dataToRender[classroom][day] = filteredDay;
                            }
                        }
                    }
                }

                this.elements.scheduleBody.innerHTML = '';
                const classroomsWithSchedule = new Set([...this.classrooms, ...Object.keys(dataToRender)]);
                const sortedClassrooms = this.sortClassrooms(Array.from(classroomsWithSchedule));
                sortedClassrooms.forEach(classroom => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td class="border border-gray-300 p-2 font-medium bg-gray-100 align-top">${classroom}</td>`;
                    for (let day = 0; day < 7; day++) {
                        const td = document.createElement('td');
                        td.setAttribute('class', 'border border-gray-300 p-2 schedule-cell align-top');
                        td.dataset.classroom = classroom;
                        td.dataset.day = day;
                        const classes = (dataToRender[classroom]?.[day] || []);
                        let lastColor = null;
                        classes.forEach((classItem) => {
                            let currentColor = this.courseColorMap[classItem.name] || '#E2E8F0';
                            let finalColor = currentColor;
                            if (currentColor === lastColor) {
                                const currentIndex = this.COURSE_COLORS.indexOf(currentColor);
                                const nextIndex = (currentIndex + 1) % this.COURSE_COLORS.length;
                                finalColor = this.COURSE_COLORS[nextIndex];
                            }
                            const classDiv = this.createClassElement(classItem, classroom, day, finalColor);
                            td.appendChild(classDiv);
                            lastColor = finalColor;
                        });
                        tr.appendChild(td);
                    }
                    this.elements.scheduleBody.appendChild(tr);
                });
                this.setupDragAndDrop();
            } catch (e) {
                console.error('渲染課程表失敗:', e);
                this.showNotification('渲染課程表失敗', 'error');
            }
        },

        setupDragAndDrop: function() {
            try {
                document.querySelectorAll('.schedule-cell').forEach(cell => {
                    if (cell.sortable) cell.sortable.destroy();
                    cell.sortable = new Sortable(cell, {
                        group: 'classes',
                        animation: 150,
                        onStart: (evt) => {
                            this.originalSourceListElement = evt.from;
                        },
                        onMove: (evt) => {
                            if (evt.to === this.originalSourceListElement) {
                                return true;
                            }
                            return evt.from !== evt.to;
                        },
                        onEnd: (evt) => {
                            const { from, to, item, newIndex } = evt;
                            const classId = item.dataset.id;
                            const fromClassroom = from.dataset.classroom, fromDay = parseInt(from.dataset.day);
                            const toClassroom = to.dataset.classroom, toDay = parseInt(to.dataset.day);

                            this.originalSourceListElement = null;

                            if (from === to) {
                                this.renderScheduleTable();
                                return;
                            }

                            const fromDaySchedule = this.scheduleData[fromClassroom]?.[fromDay] || [];
                            const itemIndex = fromDaySchedule.findIndex(c => c.id === classId);
                            
                            if (itemIndex === -1) {
                                console.error("Could not find dragged item in data model.");
                                this.renderScheduleTable();
                                return;
                            }
                            
                            const [movedItem] = fromDaySchedule.splice(itemIndex, 1);

                            if (!this.scheduleData[toClassroom]) this.scheduleData[toClassroom] = {};
                            if (!this.scheduleData[toClassroom][toDay]) this.scheduleData[toClassroom][toDay] = [];
                            
                            this.scheduleData[toClassroom][toDay].splice(newIndex, 0, movedItem);

                            if (this.scheduleData[fromClassroom] && this.scheduleData[fromClassroom][fromDay] && this.scheduleData[fromClassroom][fromDay].length === 0) {
                                delete this.scheduleData[fromClassroom][fromDay];
                            }
                            
                            this.scheduleData[toClassroom][toDay].sort((a, b) => this.timeToMinutes(a.timeStart) - this.timeToMinutes(b.timeStart));
                            
                            this.renderScheduleTable();
                            this.saveDataToLocal();
                            this.showNotification('已移動課程');
                            this.saveState();
                        }
                    });
                });
            } catch (e) {
                console.error('設置拖曳功能失敗:', e);
                this.showNotification('設置拖曳功能失敗', 'error');
            }
        },

        // --- Business Logic & Actions ---
        handleAddClassroom: function() {
            const classroomName = this.elements.classroomNameInput.value.trim();
            if (!classroomName) return;
            if (this.classrooms.includes(classroomName)) {
                this.showNotification('此教室名稱已存在！', 'error');
                return;
            }
            this.classrooms.push(classroomName);
            this.elements.classroomNameInput.value = '';
            this.updateClassroomList();
            this.renderScheduleTable();
            this.saveDataToLocal();
            this.showNotification('已新增教室: ' + classroomName);
            this.saveState();
        },

        handleClearAll: async function() {
            if (await this.showConfirm('確定要清除所有本地暫存資料嗎？<br>此操作不可恢復！')) {
                this.classrooms = [];
                this.scheduleData = {};
                this.filterPresets = {}; // Clear filter presets from memory
                this.activeFilters = []; // Clear active filters
                this.lastSyncTime = null;
                this.courseColorMap = {};
                this.updateLastModifiedTime(null);
                this.updateClassroomList();
                this.renderScheduleTable();
                this.updateActiveFilterDisplay(); // Update filter display text
                this.updateSyncStatus('offline');
                localStorage.removeItem('classrooms');
                localStorage.removeItem('scheduleData');
                localStorage.removeItem('lastSyncTime');
                this.showNotification('已清除本地暫存資料');
                this.resetHistory(); // This will create a new clean state with empty presets
            }
        },

        // --- History (Undo/Redo) ---
        saveState: function() {
            this.history = this.history.slice(0, this.historyIndex + 1);
            const currentState = {
                classrooms: JSON.parse(JSON.stringify(this.classrooms)),
                scheduleData: JSON.parse(JSON.stringify(this.scheduleData)),
                filterPresets: JSON.parse(JSON.stringify(this.filterPresets)),
                activeFilters: JSON.parse(JSON.stringify(this.activeFilters))
            };
            this.history.push(currentState);
            this.historyIndex = this.history.length - 1;
            if (this.history.length > 50) { this.history.shift(); this.historyIndex--; }
            this.updateUndoRedoButtons();
            this.checkDirty();
        },

        resetHistory: function() {
            const initialState = {
                classrooms: JSON.parse(JSON.stringify(this.classrooms)),
                scheduleData: JSON.parse(JSON.stringify(this.scheduleData)),
                filterPresets: JSON.parse(JSON.stringify(this.filterPresets)),
                activeFilters: JSON.parse(JSON.stringify(this.activeFilters))
            };
            this.history = [initialState];
            this.historyIndex = 0;
            this.updateUndoRedoButtons();
            this.updateCleanSnapshot();
            this.checkDirty();
        },

        undo: function() {
            if (this.historyIndex > 0) {
                this.historyIndex--;
                this.loadState(this.history[this.historyIndex]);
            }
        },

        redo: function() {
            if (this.historyIndex < this.history.length - 1) {
                this.historyIndex++;
                this.loadState(this.history[this.historyIndex]);
            }
        },

        loadState: function(state) {
            this.classrooms = JSON.parse(JSON.stringify(state.classrooms));
            this.scheduleData = JSON.parse(JSON.stringify(state.scheduleData));
            this.filterPresets = JSON.parse(JSON.stringify(state.filterPresets));
            this.activeFilters = JSON.parse(JSON.stringify(state.activeFilters));
            this.buildCourseColorMap();
            this.updateClassroomList();
            this.renderScheduleTable();
            this.updateActiveFilterDisplay();
            this.saveDataToLocal();
            this.updateUndoRedoButtons();
            this.checkDirty();
        },

        updateUndoRedoButtons: function() {
            this.elements.undoBtn.disabled = this.historyIndex <= 0;
            this.elements.redoBtn.disabled = this.historyIndex >= this.history.length - 1;
        },

        updateCleanSnapshot: function() {
            this.cleanStateSnapshot = JSON.stringify({
                classrooms: this.classrooms,
                scheduleData: this.scheduleData,
                filterPresets: this.filterPresets
            });
        },

        checkDirty: function() {
            const currentStateSnapshot = JSON.stringify({
                classrooms: this.classrooms,
                scheduleData: this.scheduleData,
                filterPresets: this.filterPresets
            });
            this.setDirty(currentStateSnapshot !== this.cleanStateSnapshot);
        },

        setDirty: function(isDirty) {
            if (this.isDirty === isDirty) return;
            this.isDirty = isDirty;
            const saveBtn = this.elements.saveToCloudBtn;
            if (isDirty) {
                saveBtn.classList.add('animate-pulse');
            } else {
                saveBtn.classList.remove('animate-pulse');
            }
        },

        getShortUserName: function(email) {
            if (!email || email.indexOf('@') === -1) return email;
            return email.split('@')[0];
        },

        // --- Utility ---
        ensureDataIds: function(scheduleData) {
            if (!scheduleData) return {};
            Object.values(scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(classItem => {
                            if (classItem && !classItem.id) {
                                classItem.id = this.generateUniqueId();
                            }
                        });
                    }
                });
            });
            return scheduleData;
        },

        generateUniqueId: function() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        },

        stringToHashCode: function(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) + hash) + char;
            }
            return hash;
        },

        buildCourseColorMap: function() {
            this.courseColorMap = {};
            const allNames = new Set();
            if (!this.scheduleData) return;

            Object.values(this.scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(item => allNames.add(item.name));
                    }
                });
            });

            const sortedNames = Array.from(allNames).sort();
            sortedNames.forEach(name => {
                const hash = this.stringToHashCode(name);
                const colorIndex = Math.abs(hash) % this.COURSE_COLORS.length;
                this.courseColorMap[name] = this.COURSE_COLORS[colorIndex];
            });
        },

        sortClassrooms: function(classroomList) {
            try {
                return [...classroomList].sort((a, b) => {
                    const numA = parseInt((a.match(/\d+/) || ['0'])[0]);
                    const numB = parseInt((b.match(/\d+/) || ['0'])[0]);
                    const hundredsA = Math.floor(numA / 100);
                    const hundredsB = Math.floor(numB / 100);
                    if (hundredsA !== hundredsB) return hundredsB - hundredsA;
                    return (numA % 100) - (numB % 100);
                });
            } catch (e) {
                console.error('排序教室失敗:', e);
                return classroomList || [];
            }
        },

        checkTimeConflict: function(classroom, day, newClass) {
            if (!this.scheduleData[classroom]?.[day]) return false;
            const newStart = this.timeToMinutes(newClass.timeStart);
            const newEnd = this.timeToMinutes(newClass.timeEnd);
            return this.scheduleData[classroom][day].some((existingClass) => {
                if (existingClass.id === newClass.id) return false;
                const existingStart = this.timeToMinutes(existingClass.timeStart);
                const existingEnd = this.timeToMinutes(existingClass.timeEnd);
                return newStart < existingEnd && newEnd > existingStart;
            });
        },

        timeToMinutes: function(timeStr) {
            try {
                const [hours, minutes] = timeStr.split(':').map(Number);
                return hours * 60 + minutes;
            } catch (e) {
                console.error('時間轉換失敗:', e, timeStr);
                return 0;
            }
        },

        formatTime: function(timeStr) {
            if (!timeStr) return '00:00';
            timeStr = timeStr.trim();
            if (this.TIME_REGEX.test(timeStr)) {
                const [hours, minutes] = timeStr.split(':');
                return hours.padStart(2, '0') + ':' + minutes.padStart(2, '0');
            }
            return '00:00';
        },

        countNameOccurrences: function(name, excludeId) {
            let count = 0;
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (item.name === name && item.id !== excludeId) {
                            count++;
                        }
                    });
                }
            }
            return count;
        },

        updateAllNameOccurrences: function(oldName, newName) {
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (item.name === oldName) {
                            item.name = newName;
                        }
                    });
                }
            }
        },

        countTeacherOccurrences: function(courseName, teacherName, excludeId) {
            let count = 0;
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (item.name === courseName && item.teacher === teacherName && item.id !== excludeId) {
                            count++;
                        }
                    });
                }
            }
            return count;
        },

        updateAllTeacherOccurrences: function(courseName, oldTeacher, newTeacher) {
            for (const classroom in this.scheduleData) {
                for (const day in this.scheduleData[classroom]) {
                    this.scheduleData[classroom][day].forEach(item => {
                        if (item.name === courseName && item.teacher === oldTeacher) {
                            item.teacher = newTeacher;
                        }
                    });
                }
            }
        }
    };
    document.addEventListener('DOMContentLoaded', function() {
        App.init();
        window.App = App;
    });
})();
</script>
