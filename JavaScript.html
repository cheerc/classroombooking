<script>
(function() {
    // 將全局變數放入一個命名空間或對象，減少污染
    const App = {
        // --- STATE ---
        APP_VERSION: '6.3.0',
        schedules: {}, // Object to hold all schedule tables
        activeScheduleId: null, // ID of the currently active schedule
        activeMetadataTimestamp: null, // Timestamp for the list of schedules
        TIME_REGEX: /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/,
        WEEKDAYS: ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'],
        COURSE_COLORS: [
            '#93c5fd', // Jordy Blue
            '#73EEDC', // Turquoise
            '#DBF4A7', // Mindaro
            '#fca5a5', // Melon
            '#92DBFA', // Pale azure
            '#C5D8D1', // Ash grey
            '#B5EBCC', // Celadon
            '#FDE74C', // Maize
            '#F5AE80', // Sandy Brown
            '#D6D1CD'  // Timberwolf
        ],
        classrooms: [],
        scheduleData: {},
        departments: [],
        courseColorMap: {},
        lastSyncTime: null,
        lastCloudModifiedTime: null,
        loadingTimeout: null,
        isConnecting: false,
        history: [],
        historyIndex: -1,
        activeInlineForm: null,
        originalSourceListElement: null,
        isDirty: false, // Flag to track unsaved changes
        cleanStateSnapshot: '', // Snapshot of the last clean state
        activeFilters: [], // Array to hold active course name filters
        currentUserEmail: '', // To store the email of the current user
        currentViewMode: 'week', // 'week' or 'day'
        dayViewSortMode: 'time', // 'classroom' or 'time'
        currentDayIndex: 0, // 0 for Monday, 6 for Sunday

        elements: {
            // View mode elements
            viewModeWeekBtn: document.getElementById('view-mode-week'),
            viewModeDayBtn: document.getElementById('view-mode-day'),
            dayViewSortSelector: document.getElementById('day-view-sort-selector'),
            daySortClassroomBtn: document.getElementById('day-sort-classroom'),
            daySortTimeBtn: document.getElementById('day-sort-time'),
            dayViewControls: document.getElementById('day-view-controls'),
            prevDayBtn: document.getElementById('prev-day-btn'),
            nextDayBtn: document.getElementById('next-day-btn'),
            currentDayDisplay: document.getElementById('current-day-display'),

            // Schedule Manager elements
            scheduleSelect: document.getElementById('schedule-select'),
            manageSchedulesBtn: document.getElementById('manage-schedules-btn'),
            scheduleManagerModal: document.getElementById('schedule-manager-modal'),
            scheduleManagerModalClose: document.getElementById('schedule-manager-modal-close'),
            newScheduleNameInput: document.getElementById('new-schedule-name'),
            addScheduleBtn: document.getElementById('add-schedule'),
            scheduleList: document.getElementById('schedule-list'),
            
            loadingOverlay: document.getElementById('loading-overlay'),
            loadingText: document.getElementById('loading-text'),
            loadingCancel: document.getElementById('loading-cancel'),
            notification: document.getElementById('notification'),
            syncStatus: document.getElementById('sync-status'),
            syncStatusText: document.getElementById('sync-status-text'),
            lastSyncTimeText: document.getElementById('last-sync-time'),
            classroomNameInput: document.getElementById('classroom-name'),
            addClassroomBtn: document.getElementById('add-classroom'),
            classroomList: document.getElementById('classroom-list'),
            scheduleBody: document.getElementById('schedule-body'),
            saveToCloudBtn: document.getElementById('save-to-cloud-btn'),
            loadFromCloudBtn: document.getElementById('load-from-cloud-btn'),
            clearAllBtn: document.getElementById('clear-all'),
            undoBtn: document.getElementById('undo-btn'),
            redoBtn: document.getElementById('redo-btn'),
            versionHistorySelect: document.getElementById('version-history'),
            refreshVersionsBtn: document.getElementById('refresh-versions'),
            loadVersionBtn: document.getElementById('load-version'),
            showClassroomManagerBtn: document.getElementById('show-classroom-manager-btn'),
            classroomManagerModal: document.getElementById('classroom-manager-modal'),
            classroomManagerModalClose: document.getElementById('classroom-manager-modal-close'),
            showDepartmentManagerBtn: document.getElementById('show-department-manager-btn'),
            departmentManagerModal: document.getElementById('department-manager-modal'),
            departmentManagerModalClose: document.getElementById('department-manager-modal-close'),
            departmentNameInput: document.getElementById('department-name'),
            addDepartmentBtn: document.getElementById('add-department'),
            departmentList: document.getElementById('department-list'),
            showVersionHistoryBtn: document.getElementById('show-version-history-btn'),
            versionHistoryModal: document.getElementById('version-history-modal'),
            versionHistoryModalClose: document.getElementById('version-history-modal-close'),
            confirmModal: document.getElementById('confirm-modal'),
            confirmText: document.getElementById('confirm-text'),
            confirmOk: document.getElementById('confirm-ok'),
            confirmCancel: document.getElementById('confirm-cancel'),
            promptModal: document.getElementById('prompt-modal'),
            promptText: document.getElementById('prompt-text'),
            promptInput: document.getElementById('prompt-input'),
                promptOk: document.getElementById('prompt-ok'),
                promptCancel: document.getElementById('prompt-cancel'),
            showHelpBtn: document.getElementById('show-help-btn'),
            helpModal: document.getElementById('help-modal'),
            helpModalClose: document.getElementById('help-modal-close'),
            // Filter elements
            showFilterBtn: document.getElementById('show-filter-btn'),
            filterModal: document.getElementById('filter-modal'),
            filterModalClose: document.getElementById('filter-modal-close'),
            filterTypeSelector: document.getElementById('filter-type-selector'),
            filterListTitle: document.getElementById('filter-list-title'),
            filterCourseList: document.getElementById('filter-course-list'),
            filterSearchContainer: document.getElementById('filter-search-container'),
            filterSelectAll: document.getElementById('filter-select-all'),
            filterDeselectAll: document.getElementById('filter-deselect-all'),
            filterApply: document.getElementById('filter-apply'),
            filterClear: document.getElementById('filter-clear'),
            activeFilterDisplay: document.getElementById('active-filter-display'),
            departmentQuickFilter: document.getElementById('department-quick-filter'),
        },

        // --- API Communication ---
        ServerApi: {
            /**
             * Generic wrapper for google.script.run that returns a Promise.
             * @param {string} functionName The name of the Apps Script function to call.
             * @param {...any} args The arguments to pass to the function.
             * @returns {Promise<any>} A promise that resolves with the result or rejects with an error.
             */
            call: function(functionName, ...args) {
                return new Promise((resolve, reject) => {
                    if (typeof google === 'undefined' || !google.script || !google.script.run) {
                        // This helps in local development/testing where the API isn't present.
                        console.error("google.script.run is not available.");
                        return reject(new Error('Cannot connect to the server.'));
                    }

                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        [functionName](...args);
                });
            }
        },

        init: function() {
            const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
            this.currentUserEmail = this.getShortUserName(fullEmail);

            // --- 權限控管 ---
            if (fullEmail.toLowerCase() !== 'cheerc@talented.com.tw') {
                const adminElements = [
                    this.elements.showClassroomManagerBtn,
                    this.elements.showDepartmentManagerBtn,
                    this.elements.showVersionHistoryBtn,
                    this.elements.manageSchedulesBtn, // <-- Add this line
                    document.getElementById('admin-separator')
                ];
                adminElements.forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }

            this.loadInitialSchedules();
            this.addEventListeners();
            this.setViewMode('week'); // Initialize view mode

            setTimeout(() => {
                this.loadDataFromServer().catch(error => {
                    console.warn("Initial data load failed:", error.message);
                });
            }, 500);
        },

        setupModalListeners: function(triggerBtn, modal, closeBtn, onOpen) {
            if (!modal || !closeBtn) return;
            
            const openModal = () => {
                if (onOpen) onOpen();
                modal.style.display = 'flex';
            }
            const closeModal = () => modal.style.display = 'none';

            if (triggerBtn) {
                triggerBtn.addEventListener('click', openModal);
            }
            
            closeBtn.addEventListener('click', closeModal);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
        },

        addEventListeners: function() {
            const els = this.elements;
            els.loadingCancel.addEventListener('click', () => {
                if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
                this.hideLoading();
                this.showNotification('已取消載入，使用本地數據', 'info');
                this.isConnecting = false;
            });
            els.addClassroomBtn.addEventListener('click', () => this.handleAddClassroom());
            els.addDepartmentBtn.addEventListener('click', () => this.handleAddDepartment());
            els.saveToCloudBtn.addEventListener('click', async () => {
                if (await this.showConfirm('確定要將本地資料儲存到雲端嗎？<br>這將會建立一個新的版本紀錄。')) {
                    this.saveDataToServer();
                }
            });
            els.loadFromCloudBtn.addEventListener('click', async () => {
                if (this.isDirty && !await this.showConfirm('您有未儲存的變更，確定要從雲端讀取資料並覆蓋嗎？')) {
                    return;
                }
                this.loadDataFromServer();
            });
            els.clearAllBtn.addEventListener('click', () => this.handleClearAll());
            els.loadVersionBtn.addEventListener('click', () => this.handleLoadVersion());
            els.undoBtn.addEventListener('click', () => this.undo());
            els.redoBtn.addEventListener('click', () => this.redo());
            
            // Modal Listeners
            this.setupModalListeners(els.showClassroomManagerBtn, els.classroomManagerModal, els.classroomManagerModalClose);
            this.setupModalListeners(els.showDepartmentManagerBtn, els.departmentManagerModal, els.departmentManagerModalClose);
            this.setupModalListeners(els.showVersionHistoryBtn, els.versionHistoryModal, els.versionHistoryModalClose, () => this.loadVersions());
            this.setupModalListeners(els.showHelpBtn, els.helpModal, els.helpModalClose);
            this.setupModalListeners(els.showFilterBtn, els.filterModal, els.filterModalClose, () => this.populateFilterModal());
            this.setupModalListeners(els.manageSchedulesBtn, els.scheduleManagerModal, els.scheduleManagerModalClose, () => this.renderScheduleList());

            els.addScheduleBtn.addEventListener('click', () => this.handleAddSchedule());
            els.scheduleList.addEventListener('click', this.handleScheduleListClick.bind(this));
            els.scheduleSelect.addEventListener('change', this.handleScheduleSelectChange.bind(this));

            els.classroomList.addEventListener('click', this.handleDeleteClassroomClick.bind(this));
            els.departmentList.addEventListener('click', this.handleDeleteDepartmentClick.bind(this));
            els.scheduleBody.addEventListener('click', this.handleScheduleBodyClick.bind(this));
            document.addEventListener('click', this.handleDocumentClick.bind(this), true);
            document.addEventListener('keydown', this.handleGlobalKeydown.bind(this));

            // Add beforeunload listener to prevent accidental closing
            window.addEventListener('beforeunload', (e) => {
                if (this.isDirty) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            els.filterTypeSelector.addEventListener('change', () => this.populateFilterModal());
            els.filterSelectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(true));
            els.filterDeselectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(false));
            els.filterApply.addEventListener('click', () => this.applyFilters());
            els.filterClear.addEventListener('click', () => this.clearFilters());
            els.departmentQuickFilter.addEventListener('change', () => this.renderScheduleTable());

            // View Mode Listeners
            els.viewModeWeekBtn.addEventListener('click', () => this.setViewMode('week'));
            els.viewModeDayBtn.addEventListener('click', () => this.setViewMode('day'));
            
            // Day Sort Listeners
            els.daySortClassroomBtn.addEventListener('click', () => this.setDayViewSortMode('classroom'));
            els.daySortTimeBtn.addEventListener('click', () => this.setDayViewSortMode('time'));

            // Delegated event listener for header controls
            const tableHead = this.elements.scheduleBody.previousElementSibling;
            tableHead.addEventListener('click', (e) => {
                const prevBtn = e.target.closest('#header-prev-day-btn');
                const nextBtn = e.target.closest('#header-next-day-btn');
                if (prevBtn) {
                    this.changeDay(-1);
                } else if (nextBtn) {
                    this.changeDay(1);
                }
            });

            this.initializeTooltips();
        },

        // --- Schedule Management Logic ---
        loadInitialSchedules: function() {
            // In this phase, we'll just create a default schedule if none exist.
            const localSchedules = localStorage.getItem('schedules');
            if (localSchedules) {
                this.schedules = JSON.parse(localSchedules);
            } else {
                this.schedules = {
                    'default': { name: '預設課表', data: { classrooms: [], scheduleData: {}, departments: [] } }
                };
            }

            const localActiveId = localStorage.getItem('activeScheduleId');
            this.activeScheduleId = localActiveId && this.schedules[localActiveId] ? localActiveId : Object.keys(this.schedules)[0];

            this.loadSchedule(this.activeScheduleId);
            this.updateScheduleSelect();
        },

        loadSchedule: function(scheduleId) {
            if (!this.schedules[scheduleId]) {
                this.showNotification('錯誤：找不到指定的課表 ID: ' + scheduleId, 'error');
                const firstId = Object.keys(this.schedules)[0];
                if (firstId) {
                    this.loadSchedule(firstId);
                }
                return;
            }
            this.activeScheduleId = scheduleId;
            const schedule = this.schedules[scheduleId];

            // Defensive check for malformed schedule data
            if (!schedule.data) {
                this.showNotification(`課表 "${schedule.name || '未命名'}" 格式錯誤，缺少資料。將為其創建新的空資料。`, 'error', 5000);
                console.error("Malformed schedule object detected:", schedule);
                schedule.data = { classrooms: [], scheduleData: {}, departments: [] };
            }

            this.classrooms = schedule.data.classrooms || [];
            this.scheduleData = this.ensureDataIds(schedule.data.scheduleData || {});
            this.departments = schedule.data.departments || [];
            
            this.buildCourseColorMap();
            this.updateClassroomList();
            this.updateDepartmentList();
            this.renderScheduleTable();
            this.updateSyncStatus('offline');
            this.resetHistory();
            localStorage.setItem('activeScheduleId', scheduleId);
        },

        updateScheduleSelect: function() {
            const select = this.elements.scheduleSelect;
            select.innerHTML = '';
            for (const id in this.schedules) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = this.schedules[id].name;
                select.appendChild(option);
            }
            select.value = this.activeScheduleId;
        },

        renderScheduleList: function() {
            const listElement = this.elements.scheduleList;
            listElement.innerHTML = '';
            const currentUser = this.getShortUserName(typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '');
            const isAdmin = currentUser.toLowerCase() === 'cheerc';

            for (const id in this.schedules) {
                const schedule = this.schedules[id];
                const createdBy = this.getShortUserName(schedule.createdBy || '未知');
                const canManage = isAdmin || (currentUser === createdBy);

                const li = document.createElement('li');
                li.className = 'schedule-list-item';
                
                let buttonsHtml = `<button class="copy-schedule-btn text-green-600 hover:text-green-800 text-sm" data-id="${id}">複製</button>`;
                if (canManage) {
                    buttonsHtml += `<button class="rename-schedule-btn text-blue-600 hover:text-blue-800 text-sm ml-2" data-id="${id}">重新命名</button>`;
                    buttonsHtml += `<button class="delete-schedule-btn text-red-600 hover:text-red-800 text-sm ml-2" data-id="${id}">刪除</button>`;
                }

                li.innerHTML = `
                    <div class="schedule-info">
                        <span class="schedule-name" data-tooltip="${schedule.name}" data-id="${id}">${schedule.name}</span>
                        <span class="schedule-owner">(建立者: ${createdBy})</span>
                    </div>
                    <div class="schedule-actions">
                        ${buttonsHtml}
                    </div>
                `;
                listElement.appendChild(li);
            }
            this.initializeTooltips(); // Initialize tooltips for newly created elements
        },

        handleAddSchedule: async function() {
            const newName = this.elements.newScheduleNameInput.value.trim();
            if (!newName) {
                this.showNotification('課表名稱不能為空', 'error');
                return;
            }
            this.showLoading('正在新增課表...');
            const newId = 'schedule_' + Date.now();
            try {
                const result = await this.ServerApi.call('addSchedule', { id: newId, name: newName, metadataTimestamp: this.activeMetadataTimestamp });
                if (result.error) {
                    throw new Error(result.error);
                }
                this.activeMetadataTimestamp = result.newMetadataTimestamp; // Update metadata timestamp
                this.schedules[newId] = { 
                    name: newName, 
                    createdBy: result.createdBy, 
                    data: { classrooms: [], scheduleData: {}, departments: [] } 
                };
                this.elements.newScheduleNameInput.value = '';
                this.renderScheduleList();
                this.updateScheduleSelect();
                this.showNotification(`已新增課表: ${newName}`);
            } catch (err) {
                this.showNotification(`新增課表失敗: ${err.message}`, 'error');
            } finally {
                this.hideLoading();
            }
        },

        handleScheduleListClick: async function(e) {
            const renameBtn = e.target.closest('.rename-schedule-btn');
            const deleteBtn = e.target.closest('.delete-schedule-btn');
            const copyBtn = e.target.closest('.copy-schedule-btn');

            if (renameBtn) {
                const id = renameBtn.dataset.id;
                const oldName = this.schedules[id].name;
                const newName = await this.showPrompt('請輸入新的課表名稱：', oldName);
                if (newName && newName.trim() !== oldName) {
                    this.showLoading('正在重新命名...');
                    try {
                        const result = await this.ServerApi.call('renameSchedule', { id: id, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp; // Update metadata timestamp
                        this.schedules[id].name = newName.trim();
                        this.renderScheduleList();
                        this.updateScheduleSelect();
                        this.showNotification('課表已重新命名');
                    } catch (err) {
                        this.showNotification(`重新命名失敗: ${err.message}`, 'error');
                    } finally {
                        this.hideLoading();
                    }
                }
            }

            if (deleteBtn) {
                const id = deleteBtn.dataset.id;
                if (await this.showConfirm(`確定要刪除課表 "${this.schedules[id].name}" 嗎？此操作無法復原。`)) {
                    this.showLoading('正在刪除課表...');
                    try {
                        const result = await this.ServerApi.call('deleteSchedule', { id: id, metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp; // Update metadata timestamp
                        delete this.schedules[id];
                        if (id === this.activeScheduleId) {
                            this.activeScheduleId = Object.keys(this.schedules)[0];
                            this.loadSchedule(this.activeScheduleId);
                        }
                        this.renderScheduleList();
                        this.updateScheduleSelect();
                        this.showNotification('課表已刪除');
                    } catch (err) {
                        this.showNotification(`刪除失敗: ${err.message}`, 'error');
                    } finally {
                        this.hideLoading();
                    }
                }
            }

            if (copyBtn) {
                const sourceId = copyBtn.dataset.id;
                const sourceName = this.schedules[sourceId].name;
                const newName = await this.showPrompt('請為複製的課表命名：', `${sourceName} (複製)`);
                if (newName && newName.trim()) {
                    this.showLoading('正在複製課表，請稍候...');
                    try {
                        const result = await this.ServerApi.call('copySchedule', { sourceId: sourceId, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp; // Update metadata timestamp
                        const newId = result.newId;
                        this.schedules[newId] = {
                            name: newName.trim(),
                            createdBy: result.createdBy,
                            data: JSON.parse(JSON.stringify(this.schedules[sourceId].data))
                        };
                        this.renderScheduleList();
                        this.updateScheduleSelect();
                        this.showNotification('課表複製成功！');
                    } catch (err) {
                        this.showNotification(`��製失敗: ${err.message}`, 'error');
                    } finally {
                        this.hideLoading();
                    }
                }
            }
        },

        handleScheduleSelectChange: async function(e) {
            const newId = e.target.value;
            if (this.isDirty) {
                if (!await this.showConfirm('您有未儲存的變更，確定要切換課表並捨棄變更嗎？')) {
                    e.target.value = this.activeScheduleId; // Revert selection
                    return;
                }
            }
            this.loadSchedule(newId);
        },

        saveSchedulesToLocal: function() {
            localStorage.setItem('schedules', JSON.stringify(this.schedules));
        },

        initializeTooltips: function() {
            let activeTooltip = {
                element: null,
                hideTimeout: null
            };

            document.querySelectorAll('[data-tooltip]:not([data-tooltip-initialized])').forEach(el => {
                el.setAttribute('data-tooltip-initialized', 'true');

                const showTooltip = () => {
                    // Immediately remove any existing tooltip to prevent overlap/stuck tooltips
                    if (activeTooltip.element) {
                        activeTooltip.element.remove();
                    }
                    clearTimeout(activeTooltip.hideTimeout);

                    // Create and show the new tooltip
                    const tooltipDiv = document.createElement('div');
                    tooltipDiv.className = 'fixed bg-gray-800 text-white text-xs rounded py-1 px-2 shadow-lg';
                    tooltipDiv.style.zIndex = '1050';
                    tooltipDiv.textContent = el.getAttribute('data-tooltip');
                    document.body.appendChild(tooltipDiv);
                    activeTooltip.element = tooltipDiv;

                    // Positioning logic
                    const rect = el.getBoundingClientRect();
                    const tooltipRect = tooltipDiv.getBoundingClientRect();
                    const viewportWidth = window.innerWidth;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
                    let top = rect.top - tooltipRect.height - 5;
                    if (left < 5) left = 5;
                    if (left + tooltipRect.width > viewportWidth - 5) left = viewportWidth - tooltipRect.width - 5;
                    if (top < 5) top = rect.bottom + 5;
                    tooltipDiv.style.left = `${left}px`;
                    tooltipDiv.style.top = `${top}px`;
                };

                const hideTooltip = (immediately = false) => {
                    clearTimeout(activeTooltip.hideTimeout);
                    activeTooltip.hideTimeout = setTimeout(() => {
                        if (activeTooltip.element) {
                            activeTooltip.element.remove();
                            activeTooltip.element = null;
                        }
                    }, immediately ? 0 : 50);
                };

                el.addEventListener('mouseenter', showTooltip);
                el.addEventListener('mouseleave', hideTooltip);
                el.addEventListener('click', () => hideTooltip(true));
            });
        },

        // --- Filter Logic ---
        populateFilterModal: function() {
            const filterType = this.elements.filterTypeSelector.querySelector('input[name="filterType"]:checked').value;
            const items = new Set();
            let title = '選擇要顯示的課程';

            // 1. Populate the search input for course names
            const searchContainer = this.elements.filterSearchContainer;
            if (filterType === 'name') {
                searchContainer.style.display = 'block';
                if (!searchContainer.querySelector('#filter-search-input')) {
                    searchContainer.innerHTML = `
                        <input type="text" id="filter-search-input" placeholder="在此搜尋以快速勾選..." class="filter-search-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    `;
                    searchContainer.querySelector('#filter-search-input').addEventListener('input', (e) => {
                        const searchText = e.target.value.toLowerCase().trim();
                        this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                            const courseName = cb.value.toLowerCase();
                            cb.checked = searchText ? courseName.includes(searchText) : false;
                        });
                    });
                }
            } else {
                searchContainer.style.display = 'none';
            }


            // 2. Gather all items based on filter type (with added defensive checks)
            Object.values(this.scheduleData).forEach(classroom => {
                if (typeof classroom !== 'object' || classroom === null) return; // Check if classroom is a valid object
                Object.values(classroom).forEach(day => {
                    if (!Array.isArray(day)) return; // Check if day is a valid array
                    day.forEach(course => {
                        if (!course) return; // Check if course exists
                        if (filterType === 'name' && course.name) {
                            items.add(course.name);
                        } else if (filterType === 'department') {
                            title = '選擇要顯示的部門';
                            (course.departments || []).forEach(dept => {
                                if (dept) items.add(dept);
                            });
                        } else if (filterType === 'teacher') {
                            title = '選擇要顯示的使用人';
                            if (course.teacher) items.add(course.teacher);
                        }
                    });
                });
            });

            // 3. Render the checkbox list
            this.elements.filterListTitle.textContent = title;
            const sortedItems = Array.from(items).sort();
            const listElement = this.elements.filterCourseList;
            listElement.innerHTML = '';

            sortedItems.forEach(item => {
                const isChecked = this.activeFilters.some(f => f.value === item && f.type === filterType);
                const div = document.createElement('div');
                div.setAttribute('class', 'flex items-center');
                div.innerHTML = `
                    <input type="checkbox" id="filter-${item}" value="${item}" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" ${isChecked ? 'checked' : ''}>
                    <label for="filter-${item}" class="ml-2 block text-sm text-gray-900 truncate">${item}</label>
                `;
                listElement.appendChild(div);
            });
            
            // Clear search input when repopulating
            const searchInput = searchContainer.querySelector('#filter-search-input');
            if (searchInput) searchInput.value = '';
        },

        toggleAllFilterCheckboxes: function(shouldBeChecked) {
            this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = shouldBeChecked;
            });
        },

        applyFilters: function() {
            const filterType = this.elements.filterTypeSelector.querySelector('input[name="filterType"]:checked').value;
            const selectedItems = [];
            this.elements.filterCourseList.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                selectedItems.push(cb.value);
            });

            // Set the active filters to only the current type and selection
            this.activeFilters = selectedItems.map(item => ({ type: filterType, value: item }));

            this.renderScheduleTable();
            this.updateActiveFilterDisplay();
            this.elements.filterModal.style.display = 'none';
            this.saveState(); // Make applying a filter an undoable action
        },

        clearFilters: function() {
            this.activeFilters = [];
            this.populateFilterModal(); // Repopulate to uncheck everything
            this.renderScheduleTable();
            this.updateActiveFilterDisplay();
            this.elements.filterModal.style.display = 'none';
            this.saveState(); // Make clearing a filter an undoable action
        },

        updateActiveFilterDisplay: function() {
            const display = this.elements.activeFilterDisplay;
            if (this.activeFilters.length === 0) {
                display.textContent = '未套用任何篩選';
            } else {
                const counts = this.activeFilters.reduce((acc, f) => {
                    if (f.type === 'name') acc.name = (acc.name || 0) + 1;
                    else if (f.type === 'department') acc.department = (acc.department || 0) + 1;
                    else if (f.type === 'teacher') acc.teacher = (acc.teacher || 0) + 1;
                    return acc;
                }, {});
                
                const parts = [];
                if (counts.name) parts.push(`${counts.name} 門課程`);
                if (counts.department) parts.push(`${counts.department} 個部門`);
                if (counts.teacher) parts.push(`${counts.teacher} 位使用人`);

                display.textContent = `已篩選: ${parts.join(', ')}`;
            }
        },

        handleGlobalKeydown: function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                if (this.elements.confirmModal.style.display !== 'none') {
                    this.elements.confirmCancel.click();
                    return;
                }
                if (this.activeInlineForm) {
                    // Ask to close and discard changes on Escape
                    this.activeInlineForm.close();
                    return;
                }
                if (this.elements.classroomManagerModal.style.display !== 'none') {
                    this.elements.classroomManagerModal.style.display = 'none';
                    return;
                }
                if (this.elements.versionHistoryModal.style.display !== 'none') {
                    this.elements.versionHistoryModal.style.display = 'none';
                    return;
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                e.preventDefault();
                this.undo();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
                e.preventDefault();
                this.redo();
            }
        },

        handleDocumentClick: function(e) {
            // If the click is on the department editor pop-up, let it handle itself.
            if (e.target.closest('.department-editor')) {
                return;
            }

            // If an inline form is active and the click is outside of it, trigger its close/blur behavior.
            if (this.activeInlineForm && !e.target.closest('.inline-add-form')) {
                this.activeInlineForm.close();
            } 
            // If there's no active form and the click is outside any class item, clear selections.
            else if (!this.activeInlineForm && !e.target.closest('.class-item')) {
                this.clearAllSelections();
            }
        },

        _createOrEditCourseForm: async function(container, classItemToEdit, context) {
            const isEditMode = classItemToEdit !== null;
            const { classroom, day } = context;
            const originalData = isEditMode ? { ...classItemToEdit } : {};

            const formDiv = document.createElement('div');
            formDiv.setAttribute('class', 'inline-add-form');

            // --- Form HTML ---
            const daySelectorHtml = isEditMode ? '' : this.WEEKDAYS.map((dayName, index) => `
                <label><input type="checkbox" class="inline-day-checkbox" value="${index}" ${index === day ? 'checked' : ''}> ${dayName.replace('星期', '')}</label>
            `).join('');

            const departmentCheckboxes = this.departments.map(dept => {
                const isChecked = isEditMode && (classItemToEdit.departments || []).includes(dept);
                return `<label><input type="checkbox" class="inline-department-checkbox" value="${dept}" ${isChecked ? 'checked' : ''}> ${dept}</label>`;
            }).join('');
            
            const departmentSelectorHtml = this.departments.length > 0 ? `
                <div class="inline-department-selector">
                    <div class="inline-selector-title">部門:</div>
                    ${departmentCheckboxes}
                </div>` : '';

            formDiv.innerHTML = `
                <button title="取消" class="inline-add-cancel-btn">×</button>
                ${isEditMode ? '' : `<div class="inline-day-selector">${daySelectorHtml}</div>`}
                <input type="text" placeholder="課程名稱" class="inline-input" name="name" value="${isEditMode ? classItemToEdit.name : ''}" required>
                <div class="inline-time-inputs">
                    <input type="time" class="inline-input" name="timeStart" value="${isEditMode ? classItemToEdit.timeStart : ''}" required>
                    <span>-</span>
                    <input type="time" class="inline-input" name="timeEnd" value="${isEditMode ? classItemToEdit.timeEnd : ''}" required>
                </div>
                <input type="text" placeholder="使用人" class="inline-input" name="teacher" value="${isEditMode ? classItemToEdit.teacher : ''}">
                ${departmentSelectorHtml}
                <div class="inline-form-actions">
                    <button title="儲存" class="save-inline">✓</button>
                </div>
            `;

            if (isEditMode) {
                container.innerHTML = ''; // Clear the class-item div
            }
            container.appendChild(formDiv);
            formDiv.querySelector('input[name="name"]').focus();

            // --- Form Logic ---
            const isDirty = () => {
                const name = formDiv.querySelector('input[name="name"]').value.trim();
                const timeStart = formDiv.querySelector('input[name="timeStart"]').value;
                const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value;
                const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
                const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);

                if (!isEditMode) {
                    return name !== '' || timeStart !== '' || timeEnd !== '' || teacher !== '';
                }
                
                return name !== originalData.name ||
                       timeStart !== originalData.timeStart ||
                       timeEnd !== originalData.timeEnd ||
                       teacher !== originalData.teacher ||
                       JSON.stringify(selectedDepartments.sort()) !== JSON.stringify((originalData.departments || []).sort());
            };

            const handleSave = async () => {
                const name = formDiv.querySelector('input[name="name"]').value.trim();
                const timeStart = formDiv.querySelector('input[name="timeStart"]').value.trim();
                const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value.trim();
                const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
                const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);
                const selectedDays = isEditMode ? [day] : Array.from(formDiv.querySelectorAll('.inline-day-checkbox:checked')).map(cb => parseInt(cb.value));

                if (!name) { this.showNotification('課程名稱不能為空！', 'error'); return false; }
                if (!teacher) { this.showNotification('使用人不能為空！', 'error'); return false; }
                if (selectedDepartments.length === 0) { this.showNotification('請至少選擇一個部門！', 'error'); return false; }
                if (selectedDays.length === 0) { this.showNotification('請至少選擇一個星期！', 'error'); return false; }
                if (!timeStart || !timeEnd) { this.showNotification('請輸入完整的開始與結束時間！', 'error'); return false; }

                const formattedTimeStart = this.formatTime(timeStart);
                const formattedTimeEnd = this.formatTime(timeEnd);
                if (this.timeToMinutes(formattedTimeStart) >= this.timeToMinutes(formattedTimeEnd)) { this.showNotification('開始時間不能晚於或等於結束時間！', 'error'); return false; }

                if (isEditMode) {
                    const classItem = classItemToEdit;
                    if (name !== originalData.name) {
                        const otherNameOccurrences = this._countOccurrences(item => item.name === originalData.name && item.id !== classItem.id);
                        if (otherNameOccurrences > 0) {
                            const confirmAll = await this.showConfirm(`找到 ${otherNameOccurrences} 個其他名為 "${originalData.name}" 的課程。<br>要全部一起改名為 "${name}" 嗎？`);
                            if (confirmAll) {
                                this._updateAllOccurrences(item => item.name === originalData.name, item => item.name = name);
                                const activeFilterIndex = this.activeFilters.findIndex(f => f.type === 'name' && f.value === originalData.name);
                                if (activeFilterIndex > -1) this.activeFilters[activeFilterIndex].value = name;
                            } else {
                                classItem.name = name;
                            }
                        } else {
                            classItem.name = name;
                        }
                        this.buildCourseColorMap();
                    }

                    if (teacher !== originalData.teacher) {
                        const otherTeacherOccurrences = this._countOccurrences(item => item.name === originalData.name && item.teacher === originalData.teacher && item.id !== classItem.id);
                        if (otherTeacherOccurrences > 0) {
                            const confirmAll = await this.showConfirm(`找到 ${otherTeacherOccurrences} 堂其他由 "${originalData.teacher}" 上的 "${originalData.name}" 課程。<br>要將使用人一起變更為 "${teacher}" 嗎？`);
                            if (confirmAll) {
                                this._updateAllOccurrences(
                                    item => item.name === originalData.name && item.teacher === originalData.teacher,
                                    item => item.teacher = teacher
                                );
                            } else {
                                classItem.teacher = teacher;
                            }
                        } else {
                            classItem.teacher = teacher;
                        }
                    }

                    classItem.timeStart = formattedTimeStart;
                    classItem.timeEnd = formattedTimeEnd;
                    classItem.departments = selectedDepartments;
                    if (name === originalData.name) classItem.name = name;
                    if (teacher === originalData.teacher) classItem.teacher = teacher;

                } else {
                    let hasConflictOccurred = false;
                    if (!this.courseColorMap[name]) this.buildCourseColorMap();

                    selectedDays.forEach(selectedDay => {
                        const classItem = { 
                            id: this.generateUniqueId(), 
                            name, 
                            timeStart: formattedTimeStart, 
                            timeEnd: formattedTimeEnd, 
                            teacher,
                            departments: selectedDepartments
                        };

                        if (this.checkTimeConflict(classroom, selectedDay, classItem)) {
                            this.showNotification(`在 ${classroom} ${this.WEEKDAYS[selectedDay]} 有時間衝突！`, 'info', 5000);
                            hasConflictOccurred = true;
                        }

                        if (!this.scheduleData[classroom]) this.scheduleData[classroom] = {};
                        if (!this.scheduleData[classroom][selectedDay]) this.scheduleData[classroom][selectedDay] = [];

                        const daySchedule = this.scheduleData[classroom][selectedDay];
                        const insertIndex = daySchedule.findIndex(item => this.timeToMinutes(item.timeStart) > this.timeToMinutes(classItem.timeStart));
                        daySchedule.splice(insertIndex === -1 ? daySchedule.length : insertIndex, 0, classItem);
                    });
                    if (selectedDays.length > 0 && !hasConflictOccurred) this.showNotification('已新增課程');
                }
                return true;
            };

            let isClosing = false;
            const closeHandler = async (forceSave = false) => {
                if (isClosing) return true;

                if (forceSave) {
                    const saved = await handleSave();
                    if (!saved) return false; // Validation failed, keep form open
                    isClosing = true;
                } else {
                    if (isDirty()) {
                        if (!await this.showConfirm('您有未儲存的變更，確定要捨棄嗎？')) {
                            return false; // Abort closing
                        }
                    }
                    isClosing = true;
                }

                this.activeInlineForm = null;
                this.renderScheduleTable();
                if (forceSave) {
                    this.showNotification(isEditMode ? '已更新課程資訊' : '已新增課程');
                    this.saveDataToLocal();
                    this.saveState();
                }
                return true;
            };

            this.activeInlineForm = { close: closeHandler, isDirty: isDirty };

            formDiv.querySelector('.save-inline').addEventListener('click', (e) => { e.preventDefault(); closeHandler(true); });
            formDiv.querySelector('.inline-add-cancel-btn').addEventListener('click', () => closeHandler());
            formDiv.addEventListener('keydown', (evt) => { if (evt.key === 'Escape') { evt.preventDefault(); closeHandler(); } });
        },

        handleEmptyCellDoubleClick: async function(e, cell) {
            if (this.activeInlineForm) {
                const isClosed = await this.activeInlineForm.close();
                if (!isClosed) return;
            }
            const classroom = cell.dataset.classroom;
            const day = parseInt(cell.dataset.day);
            if (!classroom || isNaN(day)) return;

            this._createOrEditCourseForm(cell, null, { classroom, day });
        },

        handleEditFieldClick: async function(e, element) {
            if (this.activeInlineForm) {
                const isClosed = await this.activeInlineForm.close();
                if (!isClosed) return;
            }
            
            this.clearAllSelections();
            e.stopPropagation();

            const classElement = element.closest('.class-item');
            if (!document.body.contains(classElement)) return;

            const classId = classElement.dataset.id;
            const classroom = classElement.closest('td').dataset.classroom;
            const day = parseInt(classElement.closest('td').dataset.day);
            
            const classItem = this.scheduleData[classroom]?.[day]?.find(c => c.id === classId);
            if (!classItem) return;

            this._createOrEditCourseForm(classElement, classItem, { classroom, day });
        },

        handleScheduleBodyClick: function(event) {
            // If a form is already active, ignore all clicks on the schedule body.
            // The document-level click handler will manage closing the form.
            if (this.activeInlineForm) {
                return;
            }

            const classElement = event.target.closest('.class-item');
            const deleteBtn = event.target.closest('.delete-btn');

            if (deleteBtn) {
                this.handleDeleteClassClick(event, deleteBtn);
                return;
            }

            const cell = event.target.closest('.schedule-cell');
            if (!classElement && cell && !cell.querySelector('.inline-add-form')) {
                // Double-click logic for empty cells
                if (this.clickTimer && this.lastClickedId === 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    this.handleEmptyCellDoubleClick(event, cell);
                } else {
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day;
                    this.clickTimer = setTimeout(() => {
                        this.clearAllSelections();
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
                return;
            }

            if (classElement) {
                // Double-click logic for existing class items
                const classId = classElement.dataset.id;
                if (this.clickTimer && this.lastClickedId === classId) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    // The second click is the double-click, trigger edit.
                    this.handleEditFieldClick(event, event.target.closest('.editable') || classElement);
                } else {
                    // This is the first click. Set a timer.
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = classId;
                    this.clickTimer = setTimeout(() => {
                        // If the timer completes, it's a single click. Toggle selection.
                        this.toggleSelection(classElement);
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
            }
        },

        handleDeleteClassroomClick: async function(event) {
            const btn = event.target.closest('.delete-classroom');
            if (!btn) return;
            const classroom = btn.getAttribute('data-classroom');
            if (this.scheduleData[classroom] && Object.values(this.scheduleData[classroom]).some(day => day.length > 0)) {
                this.showNotification('無法刪除教室：請先移除此教室的所有課程登記！', 'error', 5000);
                return;
            }
            if (await this.showConfirm(`確定要刪除教室 "${classroom}" 嗎？`)) {
                this.classrooms = this.classrooms.filter(c => c !== classroom);
                delete this.scheduleData[classroom];
                this.updateClassroomList();
                this.renderScheduleTable();
                this.saveDataToLocal();
                this.showNotification('已刪除教室: ' + classroom);
                this.saveState();
            }
        },

        handleDeleteClassClick: async function(event, btn) {
            const classElement = btn.closest('.class-item');
            const classId = classElement.dataset.id;
            const classroom = btn.dataset.classroom;
            const day = parseInt(btn.dataset.day);
            const className = classElement.querySelector('[data-field="name"]').textContent;
            if (await this.showConfirm(`確定要刪除課程 "${className}" 嗎？`)) {
                if (!this.scheduleData[classroom] || !this.scheduleData[classroom][day]) return;
                const classIndex = this.scheduleData[classroom][day].findIndex(c => c.id === classId);
                if (classIndex > -1) {
                    this.scheduleData[classroom][day].splice(classIndex, 1);
                    if (this.scheduleData[classroom][day].length === 0) {
                        delete this.scheduleData[classroom][day];
                    }
                    this.renderScheduleTable();
                    this.showNotification('已刪除課程');
                    this.saveDataToLocal();
                    this.saveState();
                }
            }
        },

        showDepartmentEditor: function(element, classItem) {
            if (document.getElementById('department-editor')) return; // Editor is already open

            const editor = document.createElement('div');
            editor.id = 'department-editor';
            editor.setAttribute('class', 'department-editor');

            const departmentCheckboxes = this.departments.map(dept => {
                const isChecked = (classItem.departments || []).includes(dept);
                return `
                    <label>
                        <input type="checkbox" value="${dept}" ${isChecked ? 'checked' : ''}>
                        ${dept}
                    </label>
                `;
            }).join('');

            editor.innerHTML = `
                <div class="department-editor-header">編輯部門</div>
                <div class="department-editor-list">${departmentCheckboxes}</div>
                <div class="department-editor-actions">
                    <button id="department-editor-save">儲存</button>
                    <button id="department-editor-cancel">取消</button>
                </div>
            `;

            document.body.appendChild(editor);
            const rect = element.getBoundingClientRect();
            editor.style.top = `${rect.bottom + window.scrollY}px`;
            editor.style.left = `${rect.left + window.scrollX}px`;

            const closeEditor = () => {
                editor.remove();
                document.removeEventListener('click', outsideClickHandler, true);
            };

            const handleSave = () => {
                const selectedDepartments = Array.from(editor.querySelectorAll('input:checked')).map(cb => cb.value);
                classItem.departments = selectedDepartments;
                this.renderScheduleTable();
                this.saveDataToLocal();
                this.saveState();
                closeEditor();
            };

            const outsideClickHandler = (e) => {
                if (!editor.contains(e.target) && e.target !== element) {
                    closeEditor();
                }
            };

            document.getElementById('department-editor-save').addEventListener('click', handleSave);
            document.getElementById('department-editor-cancel').addEventListener('click', closeEditor);
            setTimeout(() => document.addEventListener('click', outsideClickHandler, true), 0);
        },

        renderList: function(listElement, items, renderItemFn) {
            listElement.innerHTML = '';
            items.forEach(item => {
                const li = renderItemFn(item);
                if (li) listElement.appendChild(li);
            });
        },

        updateDepartmentList: function() {
            try {
                const sortedDepartments = this.departments.slice().sort();
                this.renderList(this.elements.departmentList, sortedDepartments, (department) => {
                    const li = document.createElement('li');
                    li.setAttribute('class', 'flex justify-between items-center py-1 px-2 hover:bg-gray-100 rounded');
                    li.innerHTML = `<span>${department}</span><button class="delete-department text-red-600 hover:text-red-800" data-department="${department}"><svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>`;
                    return li;
                });
                this.populateDepartmentQuickFilter(); // Update quick filter dropdown
            } catch (e) {
                console.error('更新部門列表失敗:', e);
                this.showNotification('更新部門列表失敗', 'error');
            }
        },

        populateDepartmentQuickFilter: function() {
            const select = this.elements.departmentQuickFilter;
            if (!select) return;
            const currentVal = select.value;
            select.innerHTML = '<option value="all">所有部門</option>';
            const sortedDepartments = this.departments.slice().sort();
            sortedDepartments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                select.appendChild(option);
            });
            select.value = currentVal && this.departments.includes(currentVal) ? currentVal : 'all';
        },

        // --- Data & API ---
        loadVersions: async function() {
            const select = this.elements.versionHistorySelect;
            select.innerHTML = '<option>正在載入中...</option>';
            this.showNotification('正在獲取版本列表...', 'info');
            
            try {
                const versions = await this.ServerApi.call('getVersions', this.activeScheduleId);
                if (!versions || versions.error) {
                    throw new Error(versions ? versions.error : '未知錯誤');
                }
                
                select.innerHTML = '';
                if (versions.length > 0) {
                    versions.forEach(v => {
                        const option = document.createElement('option');
                        option.value = v.id;
                        option.textContent = `${new Date(v.id).toLocaleString()} by ${this.getShortUserName(v.user)}`;
                        select.appendChild(option);
                    });
                    this.showNotification('版本列表已更新', 'success');
                } else {
                    select.innerHTML = '<option>此課表沒有歷史紀錄</option>';
                }
            } catch (error) {
                this.showNotification('獲取版本列表失敗: ' + error.message, 'error');
                select.innerHTML = '<option>獲取失敗</option>';
            }
        },

        handleLoadVersion: async function() {
            const select = this.elements.versionHistorySelect;
            const versionId = select.value;
            if (!versionId || select.options[select.selectedIndex].text === '沒有歷史紀錄') {
                this.showNotification('請選擇一個有效的版本', 'error');
                return;
            }
            if (this.isDirty && !await this.showConfirm(`您有未儲存的變更，確定要讀取歷史版本並覆蓋當前的課表嗎？`)) {
                return;
            }
            this.elements.versionHistoryModal.style.display = 'none';
            this.showLoading('正在讀取歷史版本...');

            try {
                const data = await this.ServerApi.call('getVersionData', versionId);
                if (data && data.success) {
                    const currentSchedule = this.schedules[this.activeScheduleId];
                    currentSchedule.data.classrooms = data.classrooms || [];
                    currentSchedule.data.scheduleData = this.ensureDataIds(data.scheduleData || {});
                    currentSchedule.data.departments = data.departments || [];
                    
                    this.saveSchedulesToLocal();
                    this.loadSchedule(this.activeScheduleId);

                    this.updateSyncStatus('offline', this.lastCloudModifiedTime);
                    this.showNotification('已在本地載入版本: ' + new Date(data.versionId).toLocaleString(), 'info');
                } else {
                    throw new Error(data ? data.error : '未知錯誤');
                }
            } catch (error) {
                this.showNotification('讀取版本失敗: ' + error.message, 'error');
            } finally {
                this.hideLoading();
            }
        },

        saveDataToLocal: function() {
            // This function now saves the *entire* schedules object and active ID.
            // Individual schedule data is saved within the main object.
            try {
                this.saveSchedulesToLocal(); // Saves the whole schedules object
                localStorage.setItem('activeScheduleId', this.activeScheduleId);
                localStorage.setItem('app_version', this.APP_VERSION);
                if (this.lastSyncTime) localStorage.setItem('lastSyncTime', this.lastSyncTime.toISOString());
            } catch (e) {
                console.error("保存數據到本地失敗:", e);
                this.showNotification("保存數據失敗，可能是存儲空間不足", "error");
            }
        },

        loadDataFromServer: async function() {
            if (this.isConnecting) {
                this.showNotification("A sync operation is already in progress.", "info");
                return;
            }
            this.isConnecting = true;
            this.updateSyncStatus('syncing');
            [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = true);

            try {
                const result = await this.ServerApi.call('getData');
                if (!result || result.error) {
                    throw new Error(result ? result.error : '從服務器獲取的數據為空');
                }
                
                this.schedules = result.schedules || {};
                this.activeScheduleId = result.activeScheduleId || Object.keys(this.schedules)[0];
                this.activeMetadataTimestamp = result.metadataTimestamp;

                if (!this.activeScheduleId) {
                    this.loadInitialSchedules();
                } else {
                    this.loadSchedule(this.activeScheduleId);
                }

                this.updateScheduleSelect();
                this.updateLastModifiedTime(result.lastModified);
                this.lastSyncTime = new Date();
                this.saveSchedulesToLocal();
                this.updateSyncStatus('synced');
                this.showNotification('從雲端讀取數據成功！');
                this.resetHistory();
            } catch (error) {
                this.showNotification('從雲端讀取數據失敗: ' + error.message, 'error');
                this.updateSyncStatus('error');
            } finally {
                this.isConnecting = false;
                [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = false);
            }
        },

        saveDataToServer: async function() {
            if (this.isConnecting) return;
            this.isConnecting = true;
            this.updateSyncStatus('syncing');
            [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = true);

            try {
                const latestData = await this.ServerApi.call('getData');
                if (latestData.error) throw new Error(latestData.error);

                const serverLastModified = latestData.lastModified ? new Date(latestData.lastModified).getTime() : null;
                const localLastModified = this.lastCloudModifiedTime ? this.lastCloudModifiedTime.getTime() : null;

                if (serverLastModified !== localLastModified && localLastModified) {
                    this.updateSyncStatus('error');
                    this.showConfirm('儲存失敗！雲端資料已被其他人修改。<br><br>為避免覆蓋他人工作，請先「從雲端讀取資料」同步後，再重新進行您的變更。', true);
                    return;
                }

                this.showLoading('版本一致，正在保存數據...');
                const dataToSend = {
                    scheduleId: this.activeScheduleId,
                    activeScheduleId: this.activeScheduleId,
                    scheduleData: {
                        classrooms: this.classrooms,
                        scheduleData: this.scheduleData,
                        departments: this.departments
                    }
                };

                const saveResult = await this.ServerApi.call('saveData', dataToSend);
                if (!saveResult || !saveResult.success) {
                    throw new Error(saveResult?.error || '儲存時發生未知錯誤');
                }

                this.lastSyncTime = new Date();
                this.updateLastModifiedTime(saveResult.lastModified);
                this.updateSyncStatus('synced');
                this.showNotification('數據已成���儲存到雲端！');
                this.updateCleanSnapshot();
                this.checkDirty();

            } catch (error) {
                this.showNotification('數據儲存失敗: ' + error.message, 'error');
                this.updateSyncStatus('error');
            } finally {
                this.hideLoading();
                this.isConnecting = false;
                [this.elements.loadFromCloudBtn, this.elements.saveToCloudBtn].forEach(btn => btn.disabled = false);
            }
        },

        showLoading: function(message = '載入中，請稍候...') {
            this.elements.loadingText.textContent = message;
            this.elements.loadingOverlay.style.display = 'flex';
            if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
            this.loadingTimeout = setTimeout(() => {
                this.hideLoading();
                this.showNotification('載入超時，使用本地數據', 'error');
                this.isConnecting = false;
            }, 30000);
        },

        hideLoading: function() {
            this.elements.loadingOverlay.style.display = 'none';
            if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
        },

        showConfirm: function(message, isAlert = false) {
            return new Promise((resolve) => {
                this.elements.confirmText.innerHTML = message;
                this.elements.confirmCancel.style.display = isAlert ? 'none' : 'inline-block';
                this.elements.confirmModal.style.display = 'flex';
                const okHandler = () => { cleanup(); resolve(true); };
                const cancelHandler = () => { cleanup(); resolve(false); };
                const cleanup = () => {
                    this.elements.confirmOk.removeEventListener('click', okHandler);
                    this.elements.confirmCancel.removeEventListener('click', cancelHandler);
                    this.elements.confirmModal.style.display = 'none';
                };
                this.elements.confirmOk.addEventListener('click', okHandler, { once: true });
                this.elements.confirmCancel.addEventListener('click', cancelHandler, { once: true });
            });
        },

        showPrompt: function(message, defaultValue = '') {
            return new Promise((resolve) => {
                const els = this.elements;
                els.promptText.textContent = message;
                els.promptInput.value = defaultValue;
                els.promptModal.style.display = 'flex';
                els.promptInput.focus();
                els.promptInput.select();

                const okHandler = () => {
                    cleanup();
                    resolve(els.promptInput.value);
                };

                const cancelHandler = () => {
                    cleanup();
                    resolve(null); // Resolve with null on cancel
                };

                const keydownHandler = (e) => {
                    if (e.key === 'Enter') {
                        okHandler();
                    } else if (e.key === 'Escape') {
                        cancelHandler();
                    }
                };

                const cleanup = () => {
                    els.promptOk.removeEventListener('click', okHandler);
                    els.promptCancel.removeEventListener('click', cancelHandler);
                    els.promptInput.removeEventListener('keydown', keydownHandler);
                    els.promptModal.style.display = 'none';
                };

                els.promptOk.addEventListener('click', okHandler, { once: true });
                els.promptCancel.addEventListener('click', cancelHandler, { once: true });
                els.promptInput.addEventListener('keydown', keydownHandler);
            });
        },

        updateSyncStatus: function(status) {
            const els = this.elements;
            let icon = '', text = '', subtext = '', cssClass = '';

            const lastModifiedString = this.lastCloudModifiedTime 
                ? '雲端版本: ' + new Date(this.lastCloudModifiedTime).toLocaleString()
                : '未曾同步';

            switch (status) {
                case 'syncing':
                    icon = '🔄'; text = '正在同步...'; subtext = '請稍候...'; cssClass = 'syncing';
                    break;
                case 'error':
                    icon = '❌'; text = '同步失敗'; subtext = '請檢查網路或稍後再試'; cssClass = 'error';
                    break;
                case 'dirty':
                    icon = '⚠️'; text = '有未儲存的變更'; subtext = lastModifiedString; cssClass = 'dirty';
                    break;
                case 'synced':
                default: // 'synced' is now the default state
                    icon = '✅'; text = '資料已同步'; subtext = lastModifiedString; cssClass = 'synced';
                    break;
            }
            els.syncStatus.className = 'sync-status ' + cssClass;
            els.syncStatusText.textContent = `${icon} ${text}`;
            els.lastSyncTimeText.textContent = subtext;
        },

        updateLastModifiedTime: function(time) {
            try { this.lastCloudModifiedTime = time ? new Date(time) : null; } 
            catch (e) { console.error("解析雲端修改時間失敗:", e); this.lastCloudModifiedTime = null; }
        },

        createClassElement: function(classItem, classroom, day, overrideColor = null) {

            const conflictIcon = hasConflict 
                ? `<div class="conflict-icon" title="時間衝突"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.752a3 3 0 01-2.598 4.5H4.644a3 3 0 01-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" /></svg></div>`
                : '';
            
            const bgColor = overrideColor || this.courseColorMap[classItem.name] || '#E2E8F0';

            const departmentTags = (classItem.departments || []).map(dept => `<span class="department-tag-vertical">${dept}</span>`).join('');
            const allDepartmentsTooltip = (classItem.departments || []).join(', ');

            const classDiv = document.createElement('div');
            classDiv.setAttribute('class', `class-item ${hasConflict ? 'conflict' : ''}`);
            classDiv.style.backgroundColor = bgColor;
            classDiv.dataset.id = classItem.id;
            classDiv.dataset.name = classItem.name;
            classDiv.innerHTML = `
                <div class="class-item-content">
                    <div class="font-medium editable" data-field="name">${classItem.name}</div>
                    <div class="editable" data-field="time">${classItem.timeStart}-${classItem.timeEnd}</div>
                    <div class="editable" data-field="teacher">${classItem.teacher}</div>
                </div>
                <div class="department-tags-vertical-container editable" data-field="departments" data-tooltip="部門: ${allDepartmentsTooltip}">${departmentTags}</div>
                <span class="delete-btn" data-classroom="${classroom}" data-day="${day}">×</span>
                ${conflictIcon}
            `;
            return classDiv;
        },

            const courseName = clickedElement.dataset.name;
            const isAlreadyPrimary = clickedElement.classList.contains('primary-selection');

            this.clearAllSelections(); // This will remove .has-selection from body

            if (!isAlreadyPrimary) {
                document.body.classList.add('has-selection');
                const allClassElements = document.querySelectorAll('.class-item');
                allClassElements.forEach(el => {
                    if (el.dataset.name === courseName) {
                        if (el === clickedElement) {
                            el.classList.add('primary-selection');
                        } else {
                            el.classList.add('secondary-selection');
                        }
                    }
                });
            }
        },

            document.querySelectorAll('.class-item.primary-selection, .class-item.secondary-selection').forEach(el => {
                el.classList.remove('primary-selection', 'secondary-selection');

        },
