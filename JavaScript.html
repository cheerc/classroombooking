<script>
(function() {
    // 將全局變數放入一個命名空間或對象，減少污染
    const App = {
        // --- STATE ---
        schedules: {}, // Object to hold all schedule tables
        activeScheduleId: null, // ID of the currently active schedule
        activeMetadataTimestamp: null, // Timestamp for the list of schedules
        classrooms: [],
        scheduleData: {},
        departments: [],
        courseColorMap: {},
        lastSyncTime: null,
        lastCloudModifiedTime: null,
        loadingTimeout: null,
        isConnecting: false,
        activeInlineForm: null,
        originalSourceListElement: null,
        isDirty: false, // Flag to track unsaved changes
        cleanStateSnapshot: '', // Snapshot of the last clean state
        activeFilters: [], // Array to hold active course name filters
        currentUserEmail: '', // To store the email of the current user
        currentViewMode: 'week', // 'week' or 'day'
        dayViewSortMode: 'time', // 'classroom' or 'time'
        currentDayIndex: 0, // 0 for Monday, 6 for Sunday
        modals: null,
        historyModule: null,
        ui: null,

        init: function() {
            this.modals = createModalModule(this);
            this.historyModule = createHistoryModule(this);
            this.ui = createUIModule(this);
            const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
            this.currentUserEmail = this.getShortUserName(fullEmail);

            // --- 權限控管 ---
            if (fullEmail.toLowerCase() !== 'cheerc@talented.com.tw') {
                const adminElements = [
                    AppElements.showClassroomManagerBtn,
                    AppElements.showDepartmentManagerBtn,
                    AppElements.showVersionHistoryBtn,
                    AppElements.manageSchedulesBtn,
                    document.getElementById('admin-separator')
                ];
                adminElements.forEach(el => {
                    if (el) el.style.display = 'none';
                });
            }

            this.loadInitialSchedules();
            this.addEventListeners();
            this.ui.setViewMode('week');

            setTimeout(() => {
                this.loadDataFromServer().catch(error => {
                    console.warn("Initial data load failed:", error.message);
                });
            }, 500);
        },

        setupModalListeners: function(triggerBtn, modal, closeBtn, onOpen) {
            if (!modal || !closeBtn) return;
            
            const openModal = () => {
                if (onOpen) onOpen();
                modal.style.display = 'flex';
            }
            const closeModal = () => modal.style.display = 'none';

            if (triggerBtn) {
                triggerBtn.addEventListener('click', openModal);
            }
            
            closeBtn.addEventListener('click', closeModal);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });
        },

        addEventListeners: function() {
            const els = AppElements;
            els.loadingCancel.addEventListener('click', () => {
                if (this.loadingTimeout) clearTimeout(this.loadingTimeout);
                this.ui.hideLoading();
                this.ui.showNotification('已取消載入，使用本地數據', 'info');
                this.isConnecting = false;
            });
            els.addClassroomBtn.addEventListener('click', () => this.handleAddClassroom());
            els.addDepartmentBtn.addEventListener('click', () => this.handleAddDepartment());
            els.saveToCloudBtn.addEventListener('click', async () => {
                if (await this.modals.showConfirm('確定要將本地資料儲存到雲端嗎？<br>這將會建立一個新的版本紀錄。')) {
                    this.saveDataToServer();
                }
            });
            els.loadFromCloudBtn.addEventListener('click', async () => {
                if (this.isDirty && !await this.modals.showConfirm('您有未儲存的變更，確定要從雲端讀取資料並覆蓋嗎？')) {
                    return;
                }
                this.loadDataFromServer();
            });
            els.clearAllBtn.addEventListener('click', () => this.handleClearAll());
            els.loadVersionBtn.addEventListener('click', () => this.handleLoadVersion());
            els.undoBtn.addEventListener('click', () => this.historyModule.undo());
            els.redoBtn.addEventListener('click', () => this.historyModule.redo());
            
            this.setupModalListeners(els.showClassroomManagerBtn, els.classroomManagerModal, els.classroomManagerModalClose);
            this.setupModalListeners(els.showDepartmentManagerBtn, els.departmentManagerModal, els.departmentManagerModalClose);
            this.setupModalListeners(els.showVersionHistoryBtn, els.versionHistoryModal, els.versionHistoryModalClose, () => this.loadVersions());
            this.setupModalListeners(els.showHelpBtn, els.helpModal, els.helpModalClose);
            this.setupModalListeners(els.showFilterBtn, els.filterModal, els.filterModalClose, () => this.modals.populateFilterModal());
            this.setupModalListeners(els.manageSchedulesBtn, els.scheduleManagerModal, els.scheduleManagerModalClose, () => this.ui.renderScheduleList());

            els.addScheduleBtn.addEventListener('click', () => this.handleAddSchedule());
            els.scheduleList.addEventListener('click', this.handleScheduleListClick.bind(this));
            els.scheduleSelect.addEventListener('change', this.handleScheduleSelectChange.bind(this));

            els.classroomList.addEventListener('click', (e) => this.handleItemDelete(e, 'classroom'));
            els.departmentList.addEventListener('click', (e) => this.handleItemDelete(e, 'department'));
            els.scheduleBody.addEventListener('click', this.handleScheduleBodyClick.bind(this));
            document.addEventListener('click', this.handleDocumentClick.bind(this), true);
            document.addEventListener('keydown', this.handleGlobalKeydown.bind(this));

            window.addEventListener('beforeunload', (e) => {
                if (this.isDirty) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });

            els.filterTypeSelector.addEventListener('change', () => this.modals.populateFilterModal());
            els.filterSelectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(true));
            els.filterDeselectAll.addEventListener('click', () => this.toggleAllFilterCheckboxes(false));
            els.filterApply.addEventListener('click', () => this.applyFilters());
            els.filterClear.addEventListener('click', () => this.clearFilters());
            els.departmentQuickFilter.addEventListener('change', () => this.ui.renderScheduleTable());

            els.viewModeWeekBtn.addEventListener('click', () => this.ui.setViewMode('week'));
            els.viewModeDayBtn.addEventListener('click', () => this.ui.setViewMode('day'));
            
            els.daySortClassroomBtn.addEventListener('click', () => this.ui.setDayViewSortMode('classroom'));
            els.daySortTimeBtn.addEventListener('click', () => this.ui.setDayViewSortMode('time'));

            const tableHead = AppElements.scheduleBody.previousElementSibling;
            tableHead.addEventListener('click', (e) => {
                const prevBtn = e.target.closest('#header-prev-day-btn');
                const nextBtn = e.target.closest('#header-next-day-btn');
                if (prevBtn) {
                    this.ui.changeDay(-1);
                } else if (nextBtn) {
                    this.ui.changeDay(1);
                }
            });

            this.ui.initializeTooltips();
        },

        loadInitialSchedules: function() {
            const localSchedules = localStorage.getItem('schedules');
            if (localSchedules) {
                this.schedules = JSON.parse(localSchedules);
            } else {
                this.schedules = {
                    'default': { name: '預設課表', data: { classrooms: [], scheduleData: {}, departments: [] } }
                };
            }

            const localActiveId = localStorage.getItem('activeScheduleId');
            this.activeScheduleId = localActiveId && this.schedules[localActiveId] ? localActiveId : Object.keys(this.schedules)[0];

            this.loadSchedule(this.activeScheduleId);
            this.ui.updateScheduleSelect();
        },

        loadSchedule: function(scheduleId) {
            if (!this.schedules[scheduleId]) {
                this.ui.showNotification('錯誤：找不到指定的課表 ID: ' + scheduleId, 'error');
                const firstId = Object.keys(this.schedules)[0];
                if (firstId) {
                    this.loadSchedule(firstId);
                }
                return;
            }
            this.activeScheduleId = scheduleId;
            const schedule = this.schedules[scheduleId];

            if (!schedule.data) {
                this.ui.showNotification(`課表 "${schedule.name || '未命名'}" 格式錯誤，缺少資料。將為其創建新的空資料。`, 'error', 5000);
                console.error("Malformed schedule object detected:", schedule);
                schedule.data = { classrooms: [], scheduleData: {}, departments: [] };
            }

            this.classrooms = schedule.data.classrooms || [];
            this.scheduleData = this.ensureDataIds(schedule.data.scheduleData || {});
            this.departments = schedule.data.departments || [];
            
            this.buildCourseColorMap();
            this.ui.updateClassroomList();
            this.ui.updateDepartmentList();
            this.ui.renderScheduleTable();
            this.ui.updateSyncStatus('offline');
            this.historyModule.resetHistory();
            localStorage.setItem('activeScheduleId', scheduleId);
        },

        handleAddSchedule: async function() {
            const newName = AppElements.newScheduleNameInput.value.trim();
            if (!newName) {
                this.ui.showNotification('課表名稱不能為空', 'error');
                return;
            }
            this.ui.showLoading('正在新增課表...');
            const newId = 'schedule_' + Date.now();
            try {
                const result = await ServerApi.call('addSchedule', { id: newId, name: newName, metadataTimestamp: this.activeMetadataTimestamp });
                if (result.error) {
                    throw new Error(result.error);
                }
                this.activeMetadataTimestamp = result.newMetadataTimestamp;
                this.schedules[newId] = { 
                    name: newName, 
                    createdBy: result.createdBy, 
                    data: { classrooms: [], scheduleData: {}, departments: [] } 
                };
                AppElements.newScheduleNameInput.value = '';
                this.ui.renderScheduleList();
                this.ui.updateScheduleSelect();
                this.ui.showNotification(`已新增課表: ${newName}`);
            } catch (err) {
                this.ui.showNotification(`新增課表失敗: ${err.message}`, 'error');
            } finally {
                this.ui.hideLoading();
            }
        },

        handleScheduleListClick: async function(e) {
            const renameBtn = e.target.closest('.rename-schedule-btn');
            const deleteBtn = e.target.closest('.delete-schedule-btn');
            const copyBtn = e.target.closest('.copy-schedule-btn');

            if (renameBtn) {
                const id = renameBtn.dataset.id;
                const oldName = this.schedules[id].name;
                const newName = await this.modals.showPrompt('請輸入新的課表名稱：', oldName);
                if (newName && newName.trim() !== oldName) {
                    this.ui.showLoading('正在重新命名...');
                    try {
                        const result = await ServerApi.call('renameSchedule', { id: id, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        this.schedules[id].name = newName.trim();
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表已重新命名');
                    } catch (err) {
                        this.ui.showNotification(`重新命名失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }

            if (deleteBtn) {
                const id = deleteBtn.dataset.id;
                if (await this.modals.showConfirm(`確定要刪除課表 "${this.schedules[id].name}" 嗎？此操作無法復原。`)) {
                    this.ui.showLoading('正在刪除課表...');
                    try {
                        const result = await ServerApi.call('deleteSchedule', { id: id, metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        delete this.schedules[id];
                        if (id === this.activeScheduleId) {
                            this.activeScheduleId = Object.keys(this.schedules)[0];
                            this.loadSchedule(this.activeScheduleId);
                        }
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表已刪除');
                    } catch (err) {
                        this.ui.showNotification(`刪除失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }

            if (copyBtn) {
                const sourceId = copyBtn.dataset.id;
                const sourceName = this.schedules[sourceId].name;
                const newName = await this.modals.showPrompt('請為複製的課表命名：', `${sourceName} (複製)`);
                if (newName && newName.trim()) {
                    this.ui.showLoading('正在複製課表，請稍候...');
                    try {
                        const result = await ServerApi.call('copySchedule', { sourceId: sourceId, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                        if (result.error) { throw new Error(result.error); }
                        this.activeMetadataTimestamp = result.newMetadataTimestamp;
                        const newId = result.newId;
                        this.schedules[newId] = {
                            name: newName.trim(),
                            createdBy: result.createdBy,
                            data: JSON.parse(JSON.stringify(this.schedules[sourceId].data))
                        };
                        this.ui.renderScheduleList();
                        this.ui.updateScheduleSelect();
                        this.ui.showNotification('課表複製成功！');
                    } catch (err) {
                        this.ui.showNotification(`複製失敗: ${err.message}`, 'error');
                    } finally {
                        this.ui.hideLoading();
                    }
                }
            }
        },

        handleScheduleSelectChange: async function(e) {
            const newId = e.target.value;
            if (this.isDirty) {
                if (!await this.modals.showConfirm('您有未儲存的變更，確定要切換課表並捨棄變更嗎？')) {
                    e.target.value = this.activeScheduleId; // Revert selection
                    return;
                }
            }
            this.loadSchedule(newId);
        },

        saveSchedulesToLocal: function() {
            localStorage.setItem('schedules', JSON.stringify(this.schedules));
        },

        toggleAllFilterCheckboxes: function(shouldBeChecked) {
            AppElements.filterCourseList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = shouldBeChecked;
            });
        },

        applyFilters: function() {
            const filterType = AppElements.filterTypeSelector.querySelector('input[name="filterType"]:checked').value;
            const selectedItems = [];
            AppElements.filterCourseList.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                selectedItems.push(cb.value);
            });

            this.activeFilters = selectedItems.map(item => ({ type: filterType, value: item }));

            this.ui.renderScheduleTable();
            this.ui.updateActiveFilterDisplay();
            AppElements.filterModal.style.display = 'none';
            this.historyModule.saveState();
        },

        clearFilters: function() {
            this.activeFilters = [];
            this.modals.populateFilterModal();
            this.ui.renderScheduleTable();
            this.ui.updateActiveFilterDisplay();
            AppElements.filterModal.style.display = 'none';
            this.historyModule.saveState();
        },

        handleGlobalKeydown: function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                if (AppElements.confirmModal.style.display !== 'none') {
                    AppElements.confirmCancel.click();
                    return;
                }
                if (this.activeInlineForm) {
                    this.activeInlineForm.close();
                    return;
                }
                if (AppElements.classroomManagerModal.style.display !== 'none') {
                    AppElements.classroomManagerModal.style.display = 'none';
                    return;
                }
                if (AppElements.versionHistoryModal.style.display !== 'none') {
                    AppElements.versionHistoryModal.style.display = 'none';
                    return;
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                e.preventDefault();
                this.historyModule.undo();
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
                e.preventDefault();
                this.historyModule.redo();
            }
        },

        handleDocumentClick: function(e) {
            if (e.target.closest('.department-editor')) {
                return;
            }

            if (this.activeInlineForm && !e.target.closest('.inline-add-form') && !e.target.closest('.inline-notes-editor')) {
                this.activeInlineForm.close();
            } 
            else if (!this.activeInlineForm && !e.target.closest('.class-item')) {
                this.ui.clearAllSelections();
            }
        },

        _countOccurrences: function(predicate) {
            let count = 0;
            Object.values(this.scheduleData).forEach(classroom => {
                if (typeof classroom !== 'object' || classroom === null) return;
                Object.values(classroom).forEach(day => {
                    if (!Array.isArray(day)) return;
                    day.forEach(course => {
                        if (course && predicate(course)) {
                            count++;
                        }
                    });
                });
            });
            return count;
        },

        _updateAllOccurrences: function(predicate, updateFn) {
            Object.values(this.scheduleData).forEach(classroom => {
                if (typeof classroom !== 'object' || classroom === null) return;
                Object.values(classroom).forEach(day => {
                    if (!Array.isArray(day)) return;
                    day.forEach(course => {
                        if (course && predicate(course)) {
                            updateFn(course);
                        }
                    });
                });
            });
        },

        _buildCourseFormHtml: function(isEditMode, classItemToEdit, day) {
            const daySelectorHtml = isEditMode ? '' : AppConfig.WEEKDAYS.map((dayName, index) => `
                <label><input type="checkbox" class="inline-day-checkbox" value="${index}" ${index === day ? 'checked' : ''}> ${dayName.replace('星期', '')}</label>
            `).join('');

            const departmentCheckboxes = this.departments.map(dept => {
                const isChecked = isEditMode && (classItemToEdit.departments || []).includes(dept);
                return `<label><input type="checkbox" class="inline-department-checkbox" value="${dept}" ${isChecked ? 'checked' : ''}> ${dept}</label>`;
            }).join('');
            
            const departmentSelectorHtml = this.departments.length > 0 ? `
                <div class="inline-department-selector">
                    <div class="inline-selector-title">部門:</div>
                    ${departmentCheckboxes}
                </div>` : '';

            return `
                <button title="取消" class="inline-add-cancel-btn">×</button>
                ${isEditMode ? '' : `<div class="inline-day-selector">${daySelectorHtml}</div>`}
                <input type="text" placeholder="課程名稱" class="inline-input" name="name" value="${isEditMode ? classItemToEdit.name : ''}" required>
                <div class="inline-time-inputs">
                    <input type="time" class="inline-input" name="timeStart" value="${isEditMode ? classItemToEdit.timeStart : ''}" required>
                    <span>-</span>
                    <input type="time" class="inline-input" name="timeEnd" value="${isEditMode ? classItemToEdit.timeEnd : ''}" required>
                </div>
                <input type="text" placeholder="使用人" class="inline-input" name="teacher" value="${isEditMode ? classItemToEdit.teacher : ''}">
                ${departmentSelectorHtml}
                ${this.currentViewMode === 'day' ? `<textarea placeholder="備註 (僅在日檢視顯示/編輯)" class="inline-input" name="notes" style="min-height: 60px;">${isEditMode ? classItemToEdit.notes || '' : ''}</textarea>` : ''}
                <div class="inline-form-actions">
                    <button title="儲存" class="save-inline">✓</button>
                </div>
            `;
        },

        _handleCourseFormSave: async function(formDiv, isEditMode, originalData, context) {
            const { classroom, day } = context;
            const name = formDiv.querySelector('input[name="name"]').value.trim();
            const timeStart = formDiv.querySelector('input[name="timeStart"]').value.trim();
            const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value.trim();
            const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
            const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);
            const selectedDays = isEditMode ? [day] : Array.from(formDiv.querySelectorAll('.inline-day-checkbox:checked')).map(cb => parseInt(cb.value));
            const notesTextarea = formDiv.querySelector('textarea[name="notes"]');

            if (!name) { this.ui.showNotification('課程名稱不能為空！', 'error'); return false; }
            if (!teacher) { this.ui.showNotification('使用人不能為空！', 'error'); return false; }
            if (selectedDepartments.length === 0) { this.ui.showNotification('請至少選擇一個部門！', 'error'); return false; }
            if (selectedDays.length === 0) { this.ui.showNotification('請至少選擇一個星期！', 'error'); return false; }
            if (!timeStart || !timeEnd) { this.ui.showNotification('請輸入完整的開始與結束時間！', 'error'); return false; }

            const formattedTimeStart = this.formatTime(timeStart);
            const formattedTimeEnd = this.formatTime(timeEnd);
            if (this.timeToMinutes(formattedTimeStart) >= this.timeToMinutes(formattedTimeEnd)) { this.ui.showNotification('開始時間不能晚於或等於結束時間！', 'error'); return false; }

            if (isEditMode) {
                const classItem = this.scheduleData[context.classroom]?.[context.day]?.find(c => c.id === originalData.id);

                if (!classItem) {
                    this.ui.showNotification('錯誤：找不到要更新的課程項目。', 'error');
                    console.error("Could not find class item to update with id:", originalData.id);
                    return false;
                }

                if (name !== originalData.name) {
                    const otherNameOccurrences = this._countOccurrences(item => item.name === originalData.name && item.id !== classItem.id);
                    if (otherNameOccurrences > 0) {
                        const confirmAll = await this.modals.showConfirm(`找到 ${otherNameOccurrences} 個其他名為 "${originalData.name}" 的課程。<br>要全部一起改名為 "${name}" 嗎？`);
                        if (confirmAll) {
                            this._updateAllOccurrences(item => item.name === originalData.name, item => item.name = name);
                            const activeFilterIndex = this.activeFilters.findIndex(f => f.type === 'name' && f.value === originalData.name);
                            if (activeFilterIndex > -1) this.activeFilters[activeFilterIndex].value = name;
                        } else {
                            classItem.name = name;
                        }
                    } else {
                        classItem.name = name;
                    }
                    this.buildCourseColorMap();
                }

                if (teacher !== originalData.teacher) {
                    const otherTeacherOccurrences = this._countOccurrences(item => item.name === originalData.name && item.teacher === originalData.teacher && item.id !== classItem.id);
                    if (otherTeacherOccurrences > 0) {
                        const confirmAll = await this.modals.showConfirm(`找到 ${otherTeacherOccurrences} 堂其他由 "${originalData.teacher}" 上的 "${originalData.name}" 課程。<br>要將使用人一起變更為 "${teacher}" 嗎？`);
                        if (confirmAll) {
                            this._updateAllOccurrences(
                                item => item.name === originalData.name && item.teacher === originalData.teacher,
                                item => item.teacher = teacher
                            );
                        } else {
                            classItem.teacher = teacher;
                        }
                    } else {
                        classItem.teacher = teacher;
                    }
                }

                classItem.timeStart = formattedTimeStart;
                classItem.timeEnd = formattedTimeEnd;
                classItem.departments = selectedDepartments;
                if (notesTextarea) {
                    classItem.notes = notesTextarea.value.trim();
                }

            } else {
                let hasConflictOccurred = false;
                if (!this.courseColorMap[name]) this.buildCourseColorMap();

                selectedDays.forEach(selectedDay => {
                    const classItem = { 
                        id: this.generateUniqueId(), 
                        name, 
                        timeStart: formattedTimeStart, 
                        timeEnd: formattedTimeEnd, 
                        teacher,
                        departments: selectedDepartments,
                        notes: notesTextarea ? notesTextarea.value.trim() : ''
                    };

                    if (this.checkTimeConflict(classroom, selectedDay, classItem)) {
                        this.ui.showNotification(`在 ${classroom} ${AppConfig.WEEKDAYS[selectedDay]} 有時間衝突！`, 'info', 5000);
                        hasConflictOccurred = true;
                    }

                    if (!this.scheduleData[classroom]) this.scheduleData[classroom] = {};
                    if (!this.scheduleData[classroom][selectedDay]) this.scheduleData[classroom][selectedDay] = [];

                    const daySchedule = this.scheduleData[classroom][selectedDay];
                    const insertIndex = daySchedule.findIndex(item => this.timeToMinutes(item.timeStart) > this.timeToMinutes(classItem.timeStart));
                    daySchedule.splice(insertIndex === -1 ? daySchedule.length : insertIndex, 0, classItem);
                });
                if (selectedDays.length > 0 && !hasConflictOccurred) this.ui.showNotification('已新增課程');
            }
            return true;
        },

        _createInlineNotesEditor: function(notesDiv) {
            if (this.activeInlineForm) return;

            const classElement = notesDiv.closest('.class-item');
            const classId = classElement.dataset.id;
            const classroom = classElement.closest('td').dataset.classroom;
            const day = parseInt(classElement.closest('td').dataset.day);
            const classItem = this.scheduleData[classroom]?.[day]?.find(c => c.id === classId);

            if (!classItem) return;

            const originalNotes = classItem.notes || '';
            const textarea = document.createElement('textarea');
            textarea.className = 'inline-notes-editor';
            textarea.value = originalNotes;

            notesDiv.replaceWith(textarea);
            textarea.focus();
            textarea.select();

            const closeEditor = (shouldSave) => {
                if (shouldSave) {
                    const newNotes = textarea.value.trim();
                    if (newNotes !== originalNotes) {
                        classItem.notes = newNotes;
                        this.saveDataToLocal();
                        this.historyModule.saveState();
                    }
                }
                this.activeInlineForm = null;
                this.ui.renderScheduleTable();
            };

            this.activeInlineForm = { close: () => closeEditor(false) };

            textarea.addEventListener('blur', () => closeEditor(true));
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeEditor(false);
                }
            });
        },

        _createOrEditCourseForm: async function(container, classItemToEdit, context) {
            const isEditMode = classItemToEdit !== null;
            const originalData = isEditMode ? { ...classItemToEdit } : {};

            const formDiv = document.createElement('div');
            formDiv.setAttribute('class', 'inline-add-form');
            formDiv.innerHTML = this._buildCourseFormHtml(isEditMode, classItemToEdit, context.day);

            if (isEditMode) {
                container.innerHTML = '';
            }
            container.appendChild(formDiv);
            formDiv.querySelector('input[name="name"]').focus();

            const isDirty = () => {
                const name = formDiv.querySelector('input[name="name"]').value.trim();
                const timeStart = formDiv.querySelector('input[name="timeStart"]').value;
                const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value;
                const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
                const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);

                if (!isEditMode) {
                    return name !== '' || timeStart !== '' || timeEnd !== '' || teacher !== '';
                }
                
                return name !== originalData.name ||
                       timeStart !== originalData.timeStart ||
                       timeEnd !== originalData.timeEnd ||
                       teacher !== originalData.teacher ||
                       JSON.stringify(selectedDepartments.sort()) !== JSON.stringify((originalData.departments || []).sort());
            };

            const closeHandler = async (forceSave = false) => {
                if (this.activeInlineForm && this.activeInlineForm.isClosing) return true;
                if(this.activeInlineForm) this.activeInlineForm.isClosing = true;

                if (forceSave) {
                    const saved = await this._handleCourseFormSave(formDiv, isEditMode, originalData, context);
                    if (!saved) { 
                        if(this.activeInlineForm) this.activeInlineForm.isClosing = false;
                        return false; 
                    }
                } else {
                    if (isDirty()) {
                        if (!await this.modals.showConfirm('您有未儲存的變更，確定要捨棄嗎？')) {
                            if(this.activeInlineForm) this.activeInlineForm.isClosing = false;
                            return false;
                        }
                    }
                }

                this.activeInlineForm = null;
                this.ui.renderScheduleTable();
                if (forceSave) {
                    this.ui.showNotification(isEditMode ? '已更新課程資訊' : '已新增課程');
                    this.saveDataToLocal();
                    this.historyModule.saveState();
                }
                return true;
            };

            this.activeInlineForm = { close: closeHandler, isDirty: isDirty, isClosing: false };

            formDiv.querySelector('.save-inline').addEventListener('click', (e) => { e.preventDefault(); closeHandler(true); });
            formDiv.querySelector('.inline-add-cancel-btn').addEventListener('click', () => closeHandler());
            formDiv.addEventListener('keydown', (evt) => { if (evt.key === 'Escape') { evt.preventDefault(); closeHandler(); } });
        },

        handleEmptyCellDoubleClick: async function(e, cell) {
            if (this.activeInlineForm) {
                const isClosed = await this.activeInlineForm.close();
                if (!isClosed) return;
            }
            const classroom = cell.dataset.classroom;
            const day = parseInt(cell.dataset.day);
            if (!classroom || isNaN(day)) return;

            this._createOrEditCourseForm(cell, null, { classroom, day });
        },

        handleEditFieldClick: async function(e, element) {
            if (this.activeInlineForm) {
                const isClosed = await this.activeInlineForm.close();
                if (!isClosed) return;
            }
            
            this.ui.clearAllSelections();
            e.stopPropagation();

            const classElement = element.closest('.class-item');
            if (!document.body.contains(classElement)) return;

            const classId = classElement.dataset.id;
            const classroom = classElement.closest('td').dataset.classroom;
            const day = parseInt(classElement.closest('td').dataset.day);
            
            const classItem = this.scheduleData[classroom]?.[day]?.find(c => c.id === classId);
            if (!classItem) return;

            this._createOrEditCourseForm(classElement, classItem, { classroom, day });
        },

        handleScheduleBodyClick: function(event) {
            if (this.activeInlineForm) {
                return;
            }

            const classElement = event.target.closest('.class-item');
            const deleteBtn = event.target.closest('.delete-btn');

            if (deleteBtn) {
                this.handleDeleteClassClick(event, deleteBtn);
                return;
            }

            const cell = event.target.closest('.schedule-cell');
            if (!classElement && cell && !cell.querySelector('.inline-add-form')) {
                if (this.clickTimer && this.lastClickedId === 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    this.handleEmptyCellDoubleClick(event, cell);
                } else {
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day;
                    this.clickTimer = setTimeout(() => {
                        this.ui.clearAllSelections();
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
                return;
            }

            if (classElement) {
                const classId = classElement.dataset.id;
                if (this.clickTimer && this.lastClickedId === classId) {
                    clearTimeout(this.clickTimer);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                    
                    const notesElement = event.target.closest('.course-notes');
                    if (notesElement && this.currentViewMode === 'day') {
                        this._createInlineNotesEditor(notesElement);
                    } else {
                        this.handleEditFieldClick(event, event.target.closest('.editable') || classElement);
                    }
                } else {
                    clearTimeout(this.clickTimer);
                    this.lastClickedId = classId;
                    this.clickTimer = setTimeout(() => {
                        this.ui.toggleSelection(classElement);
                        this.clickTimer = null;
                        this.lastClickedId = null;
                    }, 250);
                }
            }
        },

        handleDeleteClassClick: async function(event, btn) {
            const classElement = btn.closest('.class-item');
            const classId = classElement.dataset.id;
            const classroom = btn.dataset.classroom;
            const day = parseInt(btn.dataset.day);
            const className = classElement.querySelector('[data-field="name"]').textContent;
            if (await this.modals.showConfirm(`確定要刪除課程 "${className}" 嗎？`)) {
                if (!this.scheduleData[classroom] || !this.scheduleData[classroom][day]) return;
                const classIndex = this.scheduleData[classroom][day].findIndex(c => c.id === classId);
                if (classIndex > -1) {
                    this.scheduleData[classroom][day].splice(classIndex, 1);
                    if (this.scheduleData[classroom][day].length === 0) {
                        delete this.scheduleData[classroom][day];
                    }
                    this.ui.renderScheduleTable();
                    this.ui.showNotification('已刪除課程');
                    this.saveDataToLocal();
                    this.historyModule.saveState();
                }
            }
        },

        loadVersions: async function() {
            const select = AppElements.versionHistorySelect;
            select.innerHTML = '<option>正在載入中...</option>';
            this.ui.showNotification('正在獲取版本列表...', 'info');
            
            try {
                const versions = await ServerApi.call('getVersions', this.activeScheduleId);
                if (!versions || versions.error) {
                    throw new Error(versions ? versions.error : '未知錯誤');
                }
                
                select.innerHTML = '';
                if (versions.length > 0) {
                    versions.forEach(v => {
                        const option = document.createElement('option');
                        option.value = v.id;
                        option.textContent = `${new Date(v.id).toLocaleString()} by ${this.getShortUserName(v.user)}`;
                        select.appendChild(option);
                    });
                    this.ui.showNotification('版本列表已更新', 'success');
                } else {
                    select.innerHTML = '<option>此課表沒有歷史紀錄</option>';
                }
            } catch (error) {
                this.ui.showNotification('獲取版本列表失敗: ' + error.message, 'error');
                select.innerHTML = '<option>獲取失敗</option>';
            }
        },

        handleLoadVersion: async function() {
            const select = AppElements.versionHistorySelect;
            const versionId = select.value;
            if (!versionId || select.options[select.selectedIndex].text === '沒有歷史紀錄') {
                this.ui.showNotification('請選擇一個有效的版本', 'error');
                return;
            }
            if (this.isDirty && !await this.modals.showConfirm(`您有未儲存的變更，確定要讀取歷史版本並覆蓋當前的課表嗎？`)) {
                return;
            }
            AppElements.versionHistoryModal.style.display = 'none';
            this.ui.showLoading('正在讀取歷史版本...');

            try {
                const data = await ServerApi.call('getVersionData', versionId);
                if (data && data.success) {
                    const currentSchedule = this.schedules[this.activeScheduleId];
                    currentSchedule.data.classrooms = data.classrooms || [];
                    currentSchedule.data.scheduleData = this.ensureDataIds(data.scheduleData || {});
                    currentSchedule.data.departments = data.departments || [];
                    
                    this.saveSchedulesToLocal();
                    this.loadSchedule(this.activeScheduleId);

                    this.ui.updateSyncStatus('offline', this.lastCloudModifiedTime);
                    this.ui.showNotification('已在本地載入版本: ' + new Date(data.versionId).toLocaleString(), 'info');
                } else {
                    throw new Error(data ? data.error : '未知錯誤');
                }
            } catch (error) {
                this.ui.showNotification('讀取版本失敗: ' + error.message, 'error');
            } finally {
                this.ui.hideLoading();
            }
        },

        saveDataToLocal: function() {
            try {
                this.saveSchedulesToLocal();
                localStorage.setItem('activeScheduleId', this.activeScheduleId);
                localStorage.setItem('app_version', AppConfig.APP_VERSION);
                if (this.lastSyncTime) localStorage.setItem('lastSyncTime', this.lastSyncTime.toISOString());
            } catch (e) {
                console.error("保存數據到本地失敗:", e);
                this.ui.showNotification("保存數據失敗，可能是存儲空間不足", "error");
            }
        },

        loadDataFromServer: async function() {
            if (this.isConnecting) {
                this.ui.showNotification("A sync operation is already in progress.", "info");
                return;
            }
            this.isConnecting = true;
            this.ui.manageLoadingState('start', { message: '正在從雲端同步資料...' });

            try {
                const result = await ServerApi.call('getData');
                if (!result || result.error) {
                    throw new Error(result ? result.error : '從服務器獲取的數據為空');
                }
                
                this.schedules = result.schedules || {};
                this.activeScheduleId = result.activeScheduleId || Object.keys(this.schedules)[0];
                this.activeMetadataTimestamp = result.metadataTimestamp;

                if (!this.activeScheduleId) {
                    this.loadInitialSchedules();
                } else {
                    this.loadSchedule(this.activeScheduleId);
                }

                this.ui.updateScheduleSelect();
                this.updateLastModifiedTime(result.lastModified);
                this.lastSyncTime = new Date();
                this.saveSchedulesToLocal();
                this.historyModule.resetHistory();
                this.ui.manageLoadingState('end', { success: true, message: '從雲端讀取數據成功！' });

            } catch (error) {
                this.ui.manageLoadingState('end', { success: false, message: '讀取失敗: ' + error.message });
            } finally {
                this.isConnecting = false;
            }
        },

        saveDataToServer: async function() {
            if (this.isConnecting) return;
            this.isConnecting = true;
            this.ui.manageLoadingState('start', { message: '正在檢查版本並儲存至雲端...' });

            try {
                const latestData = await ServerApi.call('getData');
                if (latestData.error) throw new Error(latestData.error);

                const serverLastModified = latestData.lastModified ? new Date(latestData.lastModified).getTime() : null;
                const localLastModified = this.lastCloudModifiedTime ? this.lastCloudModifiedTime.getTime() : null;

                if (serverLastModified !== localLastModified && localLastModified) {
                    this.ui.updateSyncStatus('error');
                    this.modals.showConfirm('儲存失敗！雲端資料已被其他人修改。<br><br>為避免覆蓋他人工作，請先「從雲端讀取資料」同步後，再重新進行您的變更。', true);
                    this.ui.manageLoadingState('end', { success: false, message: '儲存失敗：資料版本衝突' });
                    return;
                }

                const dataToSend = {
                    scheduleId: this.activeScheduleId,
                    activeScheduleId: this.activeScheduleId,
                    scheduleData: {
                        classrooms: this.classrooms,
                        scheduleData: this.scheduleData,
                        departments: this.departments
                    }
                };

                const saveResult = await ServerApi.call('saveData', dataToSend);
                if (!saveResult || !saveResult.success) {
                    throw new Error(saveResult?.error || '儲存時發生未知錯誤');
                }

                this.lastSyncTime = new Date();
                this.updateLastModifiedTime(saveResult.lastModified);
                this.historyModule.updateCleanSnapshot();
                this.historyModule.checkDirty();
                this.ui.manageLoadingState('end', { success: true, message: '數據已成功儲存到雲端！' });

            } catch (error) {
                this.ui.manageLoadingState('end', { success: false, message: '數據儲存失敗: ' + error.message });
            } finally {
                this.isConnecting = false;
            }
        },

        updateLastModifiedTime: function(time) {
            try { this.lastCloudModifiedTime = time ? new Date(time) : null; } 
            catch (e) { console.error("解析雲端修改時間失敗:", e); this.lastCloudModifiedTime = null; }
        },

        _handleAddItem: function(config) {
            const { itemType, name, sourceArray, inputElement, updateListFn, postAddFn } = config;
            if (!name) return;
            if (sourceArray.includes(name)) {
                this.ui.showNotification(`此${itemType}名稱已存在！`, 'error');
                return;
            }
            sourceArray.push(name);
            inputElement.value = '';
            updateListFn();
            if (postAddFn) postAddFn();
            
            this.saveDataToLocal();
            this.ui.showNotification(`已新增${itemType}: ${name}`);
            this.historyModule.saveState();
        },

        handleAddClassroom: function() {
            this._handleAddItem({
                itemType: '教室',
                name: AppElements.classroomNameInput.value.trim(),
                sourceArray: this.classrooms,
                inputElement: AppElements.classroomNameInput,
                updateListFn: this.ui.updateClassroomList.bind(this.ui),
                postAddFn: this.ui.renderScheduleTable.bind(this.ui)
            });
        },

        handleAddDepartment: function() {
            this._handleAddItem({
                itemType: '部門',
                name: AppElements.departmentNameInput.value.trim(),
                sourceArray: this.departments,
                inputElement: AppElements.departmentNameInput,
                updateListFn: this.ui.updateDepartmentList.bind(this.ui)
            });
        },

        async handleItemDelete(event, itemType) {
            const config = {
                classroom: {
                    btnSelector: '.delete-classroom',
                    dataAttribute: 'data-classroom',
                    typeName: '教室',
                    sourceArray: this.classrooms,
                    isInUse: (name) => this.scheduleData[name] && Object.values(this.scheduleData[name]).some(day => day.length > 0),
                    inUseMessage: '無法刪除教室：請先移除此教室的所有課程登記！',
                    updateList: this.ui.updateClassroomList.bind(this.ui),
                    postDelete: (name) => {
                        delete this.scheduleData[name];
                        this.ui.renderScheduleTable();
                    }
                },
                department: {
                    btnSelector: '.delete-department',
                    dataAttribute: 'data-department',
                    typeName: '部門',
                    sourceArray: this.departments,
                    isInUse: (name) => Object.values(this.scheduleData).some(classroom => 
                        Object.values(classroom).some(day => 
                            day.some(course => course.departments && course.departments.includes(name))
                        )
                    ),
                    inUseMessage: '無法刪除部門：請先從所有課程中移除此部門標籤！',
                    updateList: this.ui.updateDepartmentList.bind(this.ui),
                    postDelete: null
                }
            };

            const currentConfig = config[itemType];
            if (!currentConfig) return;

            const btn = event.target.closest(currentConfig.btnSelector);
            if (!btn) return;

            const itemName = btn.getAttribute(currentConfig.dataAttribute);
            if (currentConfig.isInUse(itemName)) {
                this.ui.showNotification(currentConfig.inUseMessage, 'error', 5000);
                return;
            }

            if (await this.modals.showConfirm(`確定要刪除${currentConfig.typeName} "${itemName}" 嗎？`)) {
                const itemIndex = currentConfig.sourceArray.indexOf(itemName);
                if (itemIndex > -1) {
                    currentConfig.sourceArray.splice(itemIndex, 1);
                }

                if (currentConfig.postDelete) {
                    currentConfig.postDelete(itemName);
                }

                currentConfig.updateList();
                this.saveDataToLocal();
                this.ui.showNotification(`已刪除${currentConfig.typeName}: ${itemName}`);
                this.historyModule.saveState();
            }
        },

        handleClearAll: async function() {
            if (await this.modals.showConfirm('確定要清除所有本地暫存資料嗎？<br>這將會刪除所有課表並重置為一個預設課表。此操作不可恢復！')) {
                localStorage.removeItem('schedules');
                localStorage.removeItem('activeScheduleId');
                localStorage.removeItem('lastSyncTime');

                this.schedules = {};
                this.activeScheduleId = null;
                this.activeFilters = [];
                this.lastSyncTime = null;
                this.courseColorMap = {};
                this.updateLastModifiedTime(null);
                
                this.loadInitialSchedules();
                this.ui.updateActiveFilterDisplay();
                this.ui.showNotification('已清除所有本地資料');
            }
        },

        getShortUserName: function(email) {
            if (!email || email.indexOf('@') === -1) return email;
            return email.split('@')[0];
        },

        ensureDataIds: function(scheduleData) {
            if (!scheduleData) return {};
            Object.values(scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(classItem => {
                            if (classItem && !classItem.id) {
                                classItem.id = this.generateUniqueId();
                            }
                        });
                    }
                });
            });
            return scheduleData;
        },

        generateUniqueId: function() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        },

        stringToHashCode: function(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) + hash) + char;
            }
            return hash;
        },

        buildCourseColorMap: function() {
            this.courseColorMap = {};
            const allNames = new Set();
            if (!this.scheduleData) return;

            Object.values(this.scheduleData).forEach(classroom => {
                if (!classroom) return;
                Object.values(classroom).forEach(daySchedule => {
                    if (Array.isArray(daySchedule)) {
                        daySchedule.forEach(item => allNames.add(item.name));
                    }
                });
            });

            const sortedNames = Array.from(allNames).sort();
            sortedNames.forEach(name => {
                const hash = this.stringToHashCode(name);
                const colorIndex = Math.abs(hash) % AppConfig.COURSE_COLORS.length;
                this.courseColorMap[name] = AppConfig.COURSE_COLORS[colorIndex];
            });
        },

        sortClassrooms: function(classroomList) {
            try {
                return [...classroomList].sort((a, b) => {
                    const numA = parseInt((a.match(/\d+/) || ['0'])[0]);
                    const numB = parseInt((b.match(/\d+/) || ['0'])[0]);
                    const hundredsA = Math.floor(numA / 100);
                    const hundredsB = Math.floor(numB / 100);
                    if (hundredsA !== hundredsB) return hundredsB - hundredsA;
                    return (numA % 100) - (numB % 100);
                });
            } catch (e) {
                console.error('排序教室失敗:', e);
                return classroomList || [];
            }
        },

        checkTimeConflict: function(classroom, day, newClass) {
            if (!this.scheduleData[classroom]?.[day]) return false;
            const newStart = this.timeToMinutes(newClass.timeStart);
            const newEnd = this.timeToMinutes(newClass.timeEnd);
            return this.scheduleData[classroom][day].some((existingClass) => {
                if (existingClass.id === newClass.id) return false;
                const existingStart = this.timeToMinutes(existingClass.timeStart);
                const existingEnd = this.timeToMinutes(existingClass.timeEnd);
                return newStart < existingEnd && newEnd > existingStart;
            });
        },

        timeToMinutes: function(timeStr) {
            try {
                const [hours, minutes] = timeStr.split(':').map(Number);
                return hours * 60 + minutes;
            } catch (e) {
                console.error('時間轉換失敗:', e, timeStr);
                return 0;
            }
        },

        formatTime: function(timeStr) {
            if (!timeStr) return '00:00';
            timeStr = timeStr.trim();
            if (AppConfig.TIME_REGEX.test(timeStr)) {
                const [hours, minutes] = timeStr.split(':');
                return hours.padStart(2, '0') + ':' + minutes.padStart(2, '0');
            }
            return '00:00';
        },

        filterDataByDepartment: function(data, department) {
            const tempData = {};
            for (const classroom in data) {
                tempData[classroom] = {};
                for (const day in data[classroom]) {
                    const filteredDay = data[classroom][day].filter(course => 
                        course.departments && course.departments.includes(department)
                    );
                    if (filteredDay.length > 0) {
                        tempData[classroom][day] = filteredDay;
                    }
                }
            }
            return tempData;
        },

        filterDataByActiveFilters: function(data) {
            const nameFilters = new Set(this.activeFilters.filter(f => f.type === 'name').map(f => f.value));
            const departmentFilters = new Set(this.activeFilters.filter(f => f.type === 'department').map(f => f.value));
            const teacherFilters = new Set(this.activeFilters.filter(f => f.type === 'teacher').map(f => f.value));

            const filteredData = {};
            for (const classroom in data) {
                filteredData[classroom] = {};
                for (const day in data[classroom]) {
                    const filteredDay = data[classroom][day].filter(course => {
                        const nameMatch = nameFilters.size === 0 || nameFilters.has(course.name);
                        const departmentMatch = departmentFilters.size === 0 || (course.departments && course.departments.some(d => departmentFilters.has(d)));
                        const teacherMatch = teacherFilters.size === 0 || teacherFilters.has(course.teacher);
                        return nameMatch && departmentMatch && teacherMatch;
                    });
                    if (filteredDay.length > 0) {
                        filteredData[classroom][day] = filteredDay;
                    }
                }
            }
            return filteredData;
        },

        handleDrop: function(evt) {
            const { from, to, item, newIndex } = evt;
            const classId = item.dataset.id;
            const fromClassroom = from.dataset.classroom, fromDay = parseInt(from.dataset.day);
            const toClassroom = to.dataset.classroom, toDay = parseInt(to.dataset.day);

            this.originalSourceListElement = null;

            if (from === to) {
                this.ui.renderScheduleTable();
                return;
            }

            const fromDaySchedule = this.scheduleData[fromClassroom]?.[fromDay] || [];
            const itemIndex = fromDaySchedule.findIndex(c => c.id === classId);
            
            if (itemIndex === -1) {
                console.error("Could not find dragged item in data model.");
                this.ui.renderScheduleTable();
                return;
            }
            
            const [movedItem] = fromDaySchedule.splice(itemIndex, 1);

            if (!this.scheduleData[toClassroom]) this.scheduleData[toClassroom] = {};
            if (!this.scheduleData[toClassroom][toDay]) this.scheduleData[toClassroom][toDay] = [];
            
            this.scheduleData[toClassroom][toDay].splice(newIndex, 0, movedItem);

            if (this.scheduleData[fromClassroom]?.[fromDay]?.length === 0) {
                delete this.scheduleData[fromClassroom][fromDay];
            }
            
            this.scheduleData[toClassroom][toDay].sort((a, b) => this.timeToMinutes(a.timeStart) - this.timeToMinutes(b.timeStart));
            
            this.ui.renderScheduleTable();
            this.saveDataToLocal();
            this.ui.showNotification('已移動課程');
            this.historyModule.saveState();
        }
    };

    // --- Initialization ---
    App.init();

})();
</script>
