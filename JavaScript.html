<script>
    (function () {
        // App object now focuses on state management and data operations.
        const App = {
            // --- STATE ---
            tabId: `tab_${Date.now()}_${Math.random()}`,
            isReadOnly: false,
            schedules: {},
            activeScheduleId: null,
            activeMetadataTimestamp: null,
            classrooms: [],
            scheduleData: {},
            tags: [], // This holds all tags for the current schedule
            tagFilterTagify: null, // To hold the tagify instance for the filter
            courseColorMap: {},
            lastSyncTime: null,
            scheduleLastModified: {},
            loadingTimeout: null,
            isConnecting: false,
            activeInlineForm: null,
            originalSourceListElement: null,
            isDirty: false,
            cleanStateSnapshot: '',
            activeFilters: [],
            currentUserEmail: '',
            currentViewMode: localStorage.getItem('lastViewMode') || AppConfig.MODES.WEEK,
            viewSortMode: (localStorage.getItem('lastViewMode') || AppConfig.MODES.WEEK) === AppConfig.MODES.DAY ? 'time' : 'classroom',
            currentDayIndex: (() => {
                // If the initial view mode is 'day', set the index to today. Otherwise, default to Monday (0).
                if ((localStorage.getItem('lastViewMode') || AppConfig.MODES.WEEK) === AppConfig.MODES.DAY) {
                    const today = new Date().getDay();
                    return (today === 0) ? 6 : today - 1; // Sunday is 0, we want it to be 6.
                }
                return 0;
            })(),
            nextUpcomingClassIds: new Set(),
            pdfFontBase64: null,

            // --- MODULES ---
            modals: null,
            historyModule: null,
            ui: null,
            interaction: null,

            init: function () {
                // Initialize all modules
                this.modals = createModalModule(this);
                this.historyModule = createHistoryModule(this);
                this.ui = createUIModule(this);
                this.interaction = createInteractionModule(this);

                const fullEmail = typeof SCRIPT_USER_EMAIL !== 'undefined' ? SCRIPT_USER_EMAIL : '';
                this.currentUserEmail = this.getShortUserName(fullEmail);

                // The initial load logic is now split. We first load from local storage,
                // then fetch from server, which will then call loadInitialSchedules again.
                this.interaction.addEventListeners();
                AppElements.versionBadge.textContent = `版本 ${AppConfig.APP_VERSION}`;

                setTimeout(() => {
                    this.loadDataFromServer().catch(error => {
                        console.warn("Initial data load failed:", error.message);
                    });
                }, 500);

                // Set up a timer to periodically check for the next upcoming class.
                setInterval(() => {
                    // First, always recalculate which classes are upcoming.
                    this.findNextUpcomingClasses();

                    // Then, if we are in a view where the upcoming status is relevant (today's day view),
                    // always re-render the table to reflect the passage of time.
                    const today = new Date();
                    const todayIndex = (today.getDay() === 0) ? 6 : today.getDay() - 1;
                    if (this.currentViewMode === AppConfig.MODES.DAY && this.currentDayIndex === todayIndex) {
                        this.ui.renderScheduleTable();
                    }
                }, 60 * 1000); // Check every minute

                // Ref: #67.4 — Heartbeat to keep the lock alive (10s interval reduces unnecessary API calls)
                setInterval(() => this.refreshLockHeartbeat(), 10000);
            },

            // --- DATA & SCHEDULE LOGIC ---
            showFirstTimeScheduleSelector: function () {
                const modal = AppElements.firstTimeScheduleSelectModal;
                const select = AppElements.firstTimeScheduleSelect;
                const confirmBtn = AppElements.firstTimeScheduleConfirmBtn;

                select.innerHTML = ''; // Clear previous options
                const scheduleIds = Object.keys(this.schedules);

                if (scheduleIds.length === 0) {
                    select.innerHTML = '<option disabled>沒有可用的課表</option>';
                    confirmBtn.disabled = true;
                } else {
                    scheduleIds.forEach(id => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = this.schedules[id].name;
                        select.appendChild(option);
                    });
                    confirmBtn.disabled = false;
                }

                modal.style.display = 'flex';

                confirmBtn.onclick = () => {
                    const selectedId = select.value;
                    if (selectedId) {
                        modal.style.display = 'none';
                        this.loadSchedule(selectedId);
                        this.ui.updateScheduleSelect(); // Ensure main dropdown is also updated
                    }
                };
            },

            handleEditClassroom: function (oldName, newName) {
                if (!newName) {
                    this.ui.showNotification('教室名稱不能為空！', 'error');
                    return;
                }
                if (this.classrooms.includes(newName)) {
                    this.ui.showNotification(`教室名稱 "${newName}" 已存在！`, 'error');
                    return;
                }

                const index = this.classrooms.indexOf(oldName);
                if (index > -1) {
                    this.classrooms[index] = newName;
                }

                // Rename the key in the scheduleData object
                if (this.scheduleData[oldName]) {
                    this.scheduleData[newName] = this.scheduleData[oldName];
                    delete this.scheduleData[oldName];
                }

                this.ui.updateClassroomList();
                this.ui.renderScheduleTable();
                this.saveDataToLocal();
                this.historyModule.saveState();
                this.ui.showNotification(`教室名稱已從 "${oldName}" 更新為 "${newName}"`);
            },

            loadInitialSchedules: function () {
                const localActiveId = localStorage.getItem('activeScheduleId');

                // Check if the locally stored ID is a valid schedule that we just got from the server
                if (localActiveId && this.schedules[localActiveId]) {
                    this.loadSchedule(localActiveId);
                    this.ui.updateScheduleSelect();
                } else {
                    // If no local preference, or the preference is invalid (e.g., schedule was deleted)
                    if (Object.keys(this.schedules).length > 0) {
                        // We have schedules from the server, so we MUST ask the user to choose one.
                        this.showFirstTimeScheduleSelector();
                    } else {
                        // No schedules on the server at all. This is a rare edge case.
                        this.ui.showNotification("雲端沒有任何課表。請聯絡管理員新增一個。", "info", 5000);
                        this.schedules = {};
                        this.activeScheduleId = null;
                        this.ui.renderScheduleTable(); // Render an empty table
                        this.ui.updateScheduleSelect();
                    }
                }
            },

            loadSchedule: function (scheduleId) {
                // Release lock on the previous schedule before acquiring a new one
                if (this.activeScheduleId) {
                    this.releaseLock(this.activeScheduleId);
                }

                if (scheduleId === AppConfig.ALL_SCHEDULES_ID) {
                    this.isReadOnly = true; // "All schedules" is always read-only
                    this.activeScheduleId = AppConfig.ALL_SCHEDULES_ID;
                    this.classrooms = [];
                    this.scheduleData = {};
                    this.tags = [];
                    this.ui.renderScheduleTable();
                    this.ui.updateHeaderUIState();
                    localStorage.setItem('activeScheduleId', scheduleId);
                    return;
                }

                // Acquire lock for the new schedule
                const hasLock = this.acquireLock(scheduleId);
                this.isReadOnly = !hasLock;

                if (!this.schedules[scheduleId]) {
                    this.ui.showNotification(`錯誤：找不到指定的課表 ID: ${scheduleId}`, 'error');
                    const firstId = Object.keys(this.schedules)[0];
                    if (firstId) this.loadSchedule(firstId);
                    return;
                }
                this.activeScheduleId = scheduleId;
                const schedule = this.schedules[scheduleId];

                if (!schedule.data) {
                    this.ui.showNotification(`課表 "${schedule.name || '未命名'}" 格式錯誤，將為其創建新的空資料。`, 'error', 5000);
                    schedule.data = { classrooms: [], scheduleData: {}, tags: [] };
                }

                this.classrooms = schedule.data.classrooms || [];
                this.scheduleData = this.ensureDataIds(schedule.data.scheduleData || {});
                this.tags = this.getAllTags(); // Dynamically get all tags

                // Initialize the tag filter for the current schedule
                this.ui.initializeTagFilter();

                // Load and apply persisted tag filters
                this.loadAndApplyPersistedFilters();

                this.buildCourseColorMap();
                this.ui.updateClassroomList();
                this.ui.renderScheduleTable();
                this.ui.updateHeaderUIState(); // Update UI based on lock and schedule mode
                this.historyModule.resetHistory();
                localStorage.setItem('activeScheduleId', scheduleId);
            },

            saveSchedulesToLocal: function () {
                localStorage.setItem('schedules', JSON.stringify(this.schedules));
            },

            handleAddSchedule: async function (scheduleDetails) {
                const { name, isDraft } = scheduleDetails;
                this.ui.showLoading('正在新增課表...');
                const newId = `schedule_${Date.now()}`;
                try {
                    const result = await ServerApi.call('addSchedule', {
                        id: newId,
                        name: name,
                        isDraft: isDraft,
                        metadataTimestamp: this.activeMetadataTimestamp
                    });
                    if (result.error) {
                        throw new Error(result.error);
                    }
                    this.activeMetadataTimestamp = result.newMetadataTimestamp;
                    this.schedules[newId] = {
                        name: name,
                        createdBy: result.createdBy,
                        isDraft: isDraft,
                        data: { classrooms: [], scheduleData: {}, tags: [] }
                    };
                    this.scheduleLastModified[newId] = result.lastModified;
                    this.ui.renderScheduleList();
                    this.ui.updateScheduleSelect();
                    this.ui.showNotification(`已新增課表: ${name}`);
                } catch (err) {
                    this.ui.showNotification(`新增課表失敗: ${err.message}`, 'error');
                } finally {
                    this.ui.hideLoading();
                }
            },

            handleScheduleListClick: async function (e) {
                const renameBtn = e.target.closest('.rename-schedule-btn');
                const deleteBtn = e.target.closest('.delete-schedule-btn');
                const copyBtn = e.target.closest('.copy-schedule-btn');

                if (renameBtn) {
                    const id = renameBtn.dataset.id;
                    const oldSchedule = this.schedules[id];
                    const result = await this.modals.showScheduleEditor({
                        id: id,
                        name: oldSchedule.name,
                        isDraft: oldSchedule.isDraft || false
                    });

                    if (result) {
                        const hasChanged = result.name !== oldSchedule.name || result.isDraft !== oldSchedule.isDraft;
                        if (hasChanged) {
                            this.ui.showLoading('正在更新課表...');
                            try {
                                const backendResult = await ServerApi.call('updateScheduleMetadata', {
                                    id: id,
                                    newName: result.name,
                                    isDraft: result.isDraft,
                                    metadataTimestamp: this.activeMetadataTimestamp
                                });
                                if (backendResult.error) { throw new Error(backendResult.error); }
                                this.activeMetadataTimestamp = backendResult.newMetadataTimestamp;
                                this.schedules[id].name = result.name;
                                this.schedules[id].isDraft = result.isDraft;
                                // CRITICAL FIX: Update the lastModified timestamp after a metadata change
                                if (backendResult.lastModified) {
                                    this.scheduleLastModified[id] = backendResult.lastModified;
                                }
                                this.ui.renderScheduleList();
                                this.ui.updateScheduleSelect();
                                this.ui.showNotification('課表已更新');
                            } catch (err) {
                                this.ui.showNotification(`更新失敗: ${err.message}`, 'error');
                            } finally {
                                this.ui.hideLoading();
                            }
                        }
                    }
                }

                if (deleteBtn) {
                    const id = deleteBtn.dataset.id;
                    if (await this.modals.showConfirm(`確定要刪除課表 "${this.schedules[id].name}" 嗎？此操作無法復原。`)) {
                        this.ui.showLoading('正在刪除課表...');
                        try {
                            const result = await ServerApi.call('deleteSchedule', { id: id, metadataTimestamp: this.activeMetadataTimestamp });
                            if (result.error) { throw new Error(result.error); }
                            this.activeMetadataTimestamp = result.newMetadataTimestamp;
                            delete this.schedules[id];
                            if (id === this.activeScheduleId) {
                                this.activeScheduleId = Object.keys(this.schedules)[0];
                                this.loadSchedule(this.activeScheduleId);
                            }
                            this.ui.renderScheduleList();
                            this.ui.updateScheduleSelect();
                            this.ui.showNotification('課表已刪除');
                        } catch (err) {
                            this.ui.showNotification(`刪除失敗: ${err.message}`, 'error');
                        } finally {
                            this.ui.hideLoading();
                        }
                    }
                }

                if (copyBtn) {
                    const sourceId = copyBtn.dataset.id;
                    const sourceName = this.schedules[sourceId].name;
                    const newName = await this.modals.showPrompt('請為複製的課表命名：', `${sourceName} (複製)`);
                    if (newName && newName.trim()) {
                        this.ui.showLoading('正在複製課表，請稍候...');
                        try {
                            const result = await ServerApi.call('copySchedule', { sourceId: sourceId, newName: newName.trim(), metadataTimestamp: this.activeMetadataTimestamp });
                            if (result.error) { throw new Error(result.error); }
                            this.activeMetadataTimestamp = result.newMetadataTimestamp;
                            const newId = result.newId;
                            this.schedules[newId] = {
                                name: newName.trim(),
                                createdBy: result.createdBy,
                                isDraft: result.isDraft, // Also copy the draft status
                                data: JSON.parse(JSON.stringify(this.schedules[sourceId].data))
                            };
                            // CRITICAL FIX: Set the lastModified timestamp for the new schedule
                            this.scheduleLastModified[newId] = result.lastModified;
                            this.ui.renderScheduleList();
                            this.ui.updateScheduleSelect();
                            this.ui.showNotification('課表複製成功！');
                        } catch (err) {
                            this.ui.showNotification(`複製失敗: ${err.message}`, 'error');
                        } finally {
                            this.ui.hideLoading();
                        }
                    }
                }
            },

            handleScheduleSelectChange: async function (e) {
                const newId = e.target.value;
                if (this.isDirty) {
                    if (!await this.modals.showConfirm('您有未儲存的變更，確定要切換課表並捨棄變更嗎？')) {
                        e.target.value = this.activeScheduleId; // Revert selection
                        return;
                    }
                }
                if (newId === AppConfig.ALL_SCHEDULES_ID) {
                    this.activeScheduleId = AppConfig.ALL_SCHEDULES_ID;

                    const allSchedulesData = {};
                    Object.values(this.schedules)
                        .filter(schedule => !schedule.isDraft) // Exclude draft schedules
                        .forEach(schedule => {
                            if (schedule.data && schedule.data.scheduleData) {
                                Object.entries(schedule.data.scheduleData).forEach(([classroom, days]) => {
                                    if (!allSchedulesData[classroom]) allSchedulesData[classroom] = {};
                                    Object.entries(days).forEach(([day, courses]) => {
                                        if (!allSchedulesData[classroom][day]) allSchedulesData[classroom][day] = [];
                                        allSchedulesData[classroom][day].push(...courses);
                                    });
                                });
                            }
                        });

                    this.tags = this.getGlobalAllTags();
                    this.ui.initializeTagFilter();
                    this.loadAndApplyPersistedFilters();
                    this.modals.populateFilterModal(); // Ensure filter modal is updated for global view

                    this.buildCourseColorMap(allSchedulesData);

                    this.ui.renderScheduleTable();
                    this.ui.updateGlobalUIForScheduleMode();
                    this.ui.updateClearAllFiltersButtonVisibility();
                    localStorage.setItem('activeScheduleId', this.activeScheduleId);
                } else {
                    this.loadSchedule(newId);
                }
            },

            // loadAndApplyPersistedFilters, toggleAllFilterCheckboxes, applyFilters — moved to FilterEngine.js.html (Phase 1 PR4)
            // clearAdvancedFilters, clearAllFilters — moved to FilterEngine.js.html (Phase 1 PR4)

            applyTagFilters: async function () {
                if (!this.tagFilterTagify) return;

                const advancedFiltersExist = this.activeFilters.some(f => f.type !== 'tag');
                const selectedTags = this.tagFilterTagify.value.map(tag => tag.value);

                // If advanced filters are active, and the user is changing the primary tag filter, confirm first.
                if (advancedFiltersExist && selectedTags.length > 0) {
                    const confirmed = await this.modals.showConfirm(
                        '變更主要標籤將會重設目前的進階篩選條件，確定要繼續嗎？'
                    );
                    if (!confirmed) {
                        // Revert the visual change in Tagify input to match the actual active filter state
                        const currentTags = this.activeFilters.filter(f => f.type === 'tag').map(f => f.value);
                        this.tagFilterTagify.loadOriginalValues(currentTags);
                        return;
                    }
                }

                // Set activeFilters to ONLY be the new tag filters, effectively clearing advanced filters.
                this.activeFilters = selectedTags.map(tag => ({ type: 'tag', value: tag }));

                localStorage.setItem('activeTagFilters', JSON.stringify(selectedTags));
                this.modals.populateFilterModal();
                this.ui.renderScheduleTable();
                this.ui.updateAdvancedFilterButtonState();
                this.ui.updateClearFilterButtonVisibility();
                this.ui.updateClearAllFiltersButtonVisibility();
            },


            // loadVersions — moved to DataIO.js.html (Phase 1 PR5)
            // handleLoadVersion — moved to DataIO.js.html (Phase 1 PR5)
            // saveDataToLocal — moved to DataIO.js.html (Phase 1 PR5)
            // loadDataFromServer — moved to DataIO.js.html (Phase 1 PR5)
            // saveDataToServer — moved to DataIO.js.html (Phase 1 PR5)

            // findNextUpcomingClasses — moved to DataCollection.js.html (Phase 1 PR3)

            // --- UTILITY ---

            // _getLocks — moved to LockManager.js.html (Phase 1 PR2)
            // _saveLocks — moved to LockManager.js.html (Phase 1 PR2)
            // acquireLock — moved to LockManager.js.html (Phase 1 PR2)
            // releaseLock — moved to LockManager.js.html (Phase 1 PR2)
            // releaseCurrentLock — moved to LockManager.js.html (Phase 1 PR2)
            // refreshLockHeartbeat — moved to LockManager.js.html (Phase 1 PR2)

            // _collectFromScheduleData, getAllTags, _collectFromAllCourses — moved to DataCollection.js.html (Phase 1 PR3)
            // getGlobalAllTags, getGlobalAllCourseNames, getGlobalAllTeachers — moved to DataCollection.js.html (Phase 1 PR3)

            // getShortUserName — moved to UtilityFunctions.js.html (Phase 1 PR1)

            isCurrentUserAdmin: function () {
                return typeof IS_ADMIN !== 'undefined' ? IS_ADMIN : false;
            },

            canManageCurrentScheduleSettings: function () {
                if (this.isCurrentUserAdmin()) {
                    return true;
                }
                if (this.activeScheduleId === AppConfig.ALL_SCHEDULES_ID) {
                    return false; // Cannot manage settings in "All Schedules" view
                }
                const schedule = this.schedules[this.activeScheduleId];
                if (!schedule || !schedule.createdBy) {
                    return false; // No schedule or creator info
                }
                return this.currentUserEmail === this.getShortUserName(schedule.createdBy);
            },

            // ensureDataIds, buildCourseColorMap, sortClassrooms, checkTimeConflict — moved to DataCollection.js.html (Phase 1 PR3)

            // generateUniqueId — moved to UtilityFunctions.js.html (Phase 1 PR1)

            // stringToHashCode — moved to UtilityFunctions.js.html (Phase 1 PR1)

            // timeToMinutes — moved to UtilityFunctions.js.html (Phase 1 PR1)

            // formatTime — moved to UtilityFunctions.js.html (Phase 1 PR1)

            // formatTimestampForFilename — moved to UtilityFunctions.js.html (Phase 1 PR1)

            // _filterScheduleData, filterDataByTags, filterDataByActiveFilters — moved to FilterEngine.js.html (Phase 1 PR4)

            // _forEachCourse, countOccurrences, updateAllOccurrences — moved to DataCollection.js.html (Phase 1 PR3)

            handleDrop: function (evt) {
                const { from, to, item, newIndex } = evt;
                const classId = item.dataset.id;
                const fromClassroom = from.dataset.classroom, fromDay = parseInt(from.dataset.day);
                const toClassroom = to.dataset.classroom, toDay = parseInt(to.dataset.day);

                this.originalSourceListElement = null;

                if (from === to) {
                    this.ui.renderScheduleTable();
                    return;
                }

                const fromDaySchedule = this.scheduleData[fromClassroom]?.[fromDay] || [];
                const itemIndex = fromDaySchedule.findIndex(c => c.id === classId);

                if (itemIndex === -1) {
                    console.error("Could not find dragged item in data model.");
                    this.ui.renderScheduleTable();
                    return;
                }

                const [movedItem] = fromDaySchedule.splice(itemIndex, 1);

                if (!this.scheduleData[toClassroom]) this.scheduleData[toClassroom] = {};
                if (!this.scheduleData[toClassroom][toDay]) this.scheduleData[toClassroom][toDay] = [];

                this.scheduleData[toClassroom][toDay].splice(newIndex, 0, movedItem);

                if (this.scheduleData[fromClassroom]?.[fromDay]?.length === 0) {
                    delete this.scheduleData[fromClassroom][fromDay];
                }

                this.scheduleData[toClassroom][toDay].sort((a, b) => this.timeToMinutes(a.timeStart) - this.timeToMinutes(b.timeStart));

                this.ui.renderScheduleTable();
                this.saveDataToLocal();
                this.ui.showNotification('已移動課程');
                this.historyModule.saveState();
            },

            // hexToRgb — moved to UtilityFunctions.js.html (Phase 1 PR1)

            printScheduleToPdf: async function (pdfOptions) {
                this.ui.showLoading('正在準備下載，請稍候...');

                try {
                    // Step 1: Ensure font data is loaded.
                    if (!this.pdfFontBase64) {
                        this.ui.showLoading('首次列印，正在載入PDF專用字體...');
                        // Ref: #47 — getFontBase64FromDrive now returns { success, data/error } envelope
                        const fontResult = await ServerApi.call('getFontBase64FromDrive');
                        if (!fontResult || !fontResult.success) throw new Error((fontResult && fontResult.error) || '無法從伺服器獲取字體資料(回傳為空)。');
                        this.pdfFontBase64 = fontResult.data;
                    }

                    this.ui.showLoading('正在生成PDF...');
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({
                        orientation: pdfOptions.orientation,
                        unit: 'mm',
                        format: pdfOptions.format
                    });

                    // Step 2: Define titles and filenames
                    const isAllSchedules = this.activeScheduleId === AppConfig.ALL_SCHEDULES_ID;
                    const scheduleNameForPdf = isAllSchedules
                        ? '所有課表'
                        : (this.schedules[this.activeScheduleId]?.name || '未命名');

                    const hasCustomTitle = pdfOptions.customTitle && pdfOptions.customTitle.length > 0;
                    const finalTitle = hasCustomTitle ? pdfOptions.customTitle : `課表: ${scheduleNameForPdf}`;

                    // Step 3: Add font to the jsPDF instance.
                    doc.addFileToVFS("NotoSansTC-Regular.ttf", this.pdfFontBase64);
                    doc.addFont("NotoSansTC-Regular.ttf", "NotoSansTC", "normal");
                    doc.setFont("NotoSansTC");

                    // Shared function for drawing header/footer on each page
                    const didDrawPage = (data) => {
                        const pageWidth = doc.internal.pageSize.getWidth();
                        doc.setFont('NotoSansTC', 'normal');
                        doc.setFontSize(16);
                        doc.text(finalTitle, pageWidth / 2, 10, { align: 'center' });

                        if (!hasCustomTitle) {
                            const activeTags = this.activeFilters.filter(f => f.type === 'tag').map(f => f.value);
                            if (activeTags.length > 0) {
                                doc.setFontSize(8);
                                const tagsText = `篩選標籤: ${activeTags.join(', ')}`;
                                const rightMargin = data.settings.margin.right;
                                doc.text(tagsText, pageWidth - rightMargin, 10, { align: 'right' });
                            }
                        }
                    };

                    const didDrawCellHooks = (data) => {
                        if (data.section === 'head' && data.column.index === 0) {
                            const { x, y, width, height } = data.cell;
                            doc.setDrawColor(200, 200, 200);
                            doc.setLineWidth(0.1);
                            doc.line(x, y, x + width, y + height);

                            doc.setFont('NotoSansTC', 'normal');
                            const isDayView = this.currentViewMode === AppConfig.MODES.DAY;
                            const fontSize = isDayView ? 12 : 7;
                            doc.setFontSize(fontSize);
                            doc.setTextColor(0, 0, 0);

                            // Calculate baseline offsets
                            const topY = y + (fontSize * 0.35) + 1; // Approx 1mm padding from top
                            const bottomY = y + height - 1.5; // 1.5mm padding from bottom

                            // "星期" right-aligned at top
                            doc.text('星期', x + width - 1.5, topY, { align: 'right' });

                            // "教室/老師" left-aligned at bottom
                            const bottomText = this.viewSortMode === 'teacher' ? '老師' : '教室';
                            doc.text(bottomText, x + 1.5, bottomY, { align: 'left' });
                        }
                    };

                    // Step 4: Build and render the table based on view mode.
                    if (this.currentViewMode === AppConfig.MODES.DAY) {
                        // --- DAY VIEW PDF LOGIC (WYSIWYG) ---
                        const table = document.getElementById('schedule-table');
                        if (!table) throw new Error('找不到課表表格元素。');

                        // 1. Scrape Headers for WYSIWYG
                        const thead = table.querySelector('thead');
                        let head = [];
                        if (thead) {
                            const secondHeader = thead.querySelectorAll('th')[1]?.textContent.trim() || AppConfig.WEEKDAYS[this.currentDayIndex];
                            head.push(['', secondHeader, '備註']); // First cell empty for diagonal
                        } else {
                            const dayName = AppConfig.WEEKDAYS[this.currentDayIndex];
                            head.push(['', dayName, '備註']);
                        }

                        // 2. Scrape Body for WYSIWYG order and content lookup
                        const body = [];
                        const tbody = table.querySelector('tbody');
                        if (tbody) {
                            tbody.querySelectorAll('tr').forEach(row => {
                                try {
                                    if (!pdfOptions.includeEmpty) {
                                        const contentCell = row.cells[1];
                                        if (!contentCell || contentCell.querySelectorAll('.class-item').length === 0) {
                                            return;
                                        }
                                    }

                                    const identifierCell = row.cells[0];
                                    const contentCell = row.cells[1];
                                    if (!identifierCell || !contentCell) return;

                                    const prefix = identifierCell.querySelector('.schedule-prefix')?.textContent.trim() || '';
                                    const mainName = identifierCell.querySelector('.classroom-name-main')?.textContent.trim() || identifierCell.textContent.trim();
                                    const identifier = prefix ? `[${prefix}] ${mainName}` : mainName;

                                    const classItems = contentCell.querySelectorAll('.class-item');

                                    if (classItems.length === 0) {
                                        body.push([identifier, '', '']);
                                        return;
                                    }

                                    const pdfRowsForThisHtmlRow = [];
                                    for (let i = 0; i < classItems.length; i++) {
                                        pdfRowsForThisHtmlRow.push([]);
                                    }

                                    pdfRowsForThisHtmlRow[0].push({
                                        content: identifier,
                                        rowSpan: classItems.length,
                                        styles: { valign: 'middle' }
                                    });

                                    classItems.forEach((classItemEl, index) => {
                                        const courseId = classItemEl.dataset.id;
                                        const classroomName = classItemEl.dataset.classroom;
                                        const dayIndex = parseInt(classItemEl.dataset.day, 10);
                                        const course = this.scheduleData[classroomName]?.[dayIndex]?.find(c => c.id === courseId);

                                        if (course) {
                                            const timeStr = `${course.timeStart} - ${course.timeEnd}`;
                                            const bottomText = this.viewSortMode === 'teacher' ? `(教室：${classroomName})` : `(${course.teacher})`;
                                            const mainContent = `${course.name}\n${timeStr}\n${bottomText}`;
                                            const color = this.courseColorMap[course.name];
                                            const courseCell = {
                                                content: mainContent,
                                                styles: { fillColor: this.hexToRgb(color) }
                                            };
                                            const notes = course.notes || '';
                                            pdfRowsForThisHtmlRow[index].push(courseCell, notes);
                                        } else {
                                            pdfRowsForThisHtmlRow[index].push('(資料錯誤)', '');
                                        }
                                    });

                                    body.push(...pdfRowsForThisHtmlRow);

                                } catch (e) {
                                    console.error("Error processing a PDF row:", e, row);
                                }
                            });
                        }

                        // 3. Manual width calculation
                        const pageWidth = doc.internal.pageSize.getWidth();
                        const margin = 15;
                        const usableWidth = pageWidth - (margin * 2);
                        const fixedColumnWidth = 40;
                        const remainingWidth = usableWidth - fixedColumnWidth;
                        const sharedWidth = remainingWidth / 2;

                        doc.autoTable({
                            head: head,
                            body: body,
                            startY: 20,
                            margin: { left: margin, right: margin },
                            theme: 'grid',
                            showHead: 'everyPage',
                            headStyles: { fillColor: [220, 220, 220], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center', valign: 'middle', font: 'NotoSansTC' },
                            styles: { fontSize: 16, cellPadding: 3, valign: 'middle', font: 'NotoSansTC', textColor: [0, 0, 0], lineWidth: 0.1, lineColor: [180, 180, 180] },
                            columnStyles: {
                                0: { cellWidth: fixedColumnWidth, fontStyle: 'bold', halign: 'center' },
                                1: { cellWidth: sharedWidth, halign: 'center' },
                                2: { cellWidth: sharedWidth },
                            },
                            didDrawPage: didDrawPage,
                            didDrawCell: didDrawCellHooks
                        });

                    } else {
                        // --- WEEK VIEW PDF LOGIC (Original, untouched) ---
                        const table = document.getElementById('schedule-table');
                        if (!table) throw new Error('找不到課表表格元素。');

                        const head = [];
                        const thead = table.querySelector('thead');
                        if (thead) {
                            const headerRow = ['']; // First cell empty for diagonal
                            const ths = thead.querySelectorAll('th');
                            for (let i = 1; i < ths.length; i++) {
                                headerRow.push(ths[i].textContent.trim());
                            }
                            head.push(headerRow);
                        }

                        const body = [];
                        const tbody = table.querySelector('tbody');
                        if (tbody) {
                            tbody.querySelectorAll('tr').forEach(tr => {
                                if (!pdfOptions.includeEmpty) {
                                    const classItemsInRow = tr.querySelectorAll('.class-item');
                                    if (classItemsInRow.length === 0) {
                                        return; // Skip this empty row
                                    }
                                }
                                const htmlRow = tr.cells;
                                let maxCoursesInRow = 0;
                                for (let i = 1; i < htmlRow.length; i++) {
                                    maxCoursesInRow = Math.max(maxCoursesInRow, htmlRow[i].querySelectorAll('.class-item').length);
                                }
                                maxCoursesInRow = Math.max(1, maxCoursesInRow); // Ensure at least one row is created

                                const pdfRowsForThisHtmlRow = [];
                                for (let i = 0; i < maxCoursesInRow; i++) {
                                    pdfRowsForThisHtmlRow.push([]);
                                }

                                pdfRowsForThisHtmlRow[0].push({
                                    content: htmlRow[0].textContent.trim(),
                                    rowSpan: maxCoursesInRow,
                                    styles: { valign: 'middle' }
                                });

                                for (let colIndex = 1; colIndex < htmlRow.length; colIndex++) {
                                    const cell = htmlRow[colIndex];
                                    const classItems = cell.querySelectorAll('.class-item');
                                    for (let courseIndex = 0; courseIndex < maxCoursesInRow; courseIndex++) {
                                        const item = classItems[courseIndex];
                                        if (item) {
                                            const name = item.querySelector('[data-field="name"]')?.textContent.trim() || '';
                                            const time = item.querySelector('[data-field="time"]')?.textContent.trim() || '';
                                            const refTeacher = item.querySelector('[data-field="teacher"]')?.textContent.trim() || '';

                                            let bottomObj = `(${refTeacher})`;
                                            if (this.viewSortMode === 'teacher') {
                                                const cRoom = item.dataset.classroom || '';
                                                bottomObj = `(教室：${cRoom})`;
                                            }

                                            const content = `${name}\n${time}\n${bottomObj}`;
                                            const color = this.courseColorMap[name];
                                            pdfRowsForThisHtmlRow[courseIndex].push({
                                                content: content,
                                                styles: { fillColor: this.hexToRgb(color) }
                                            });
                                        } else {
                                            pdfRowsForThisHtmlRow[courseIndex].push('');
                                        }
                                    }
                                }
                                body.push(...pdfRowsForThisHtmlRow);
                            });
                        }

                        doc.autoTable({
                            head: head,
                            body: body,
                            startY: 20,
                            theme: 'grid',
                            showHead: 'everyPage',
                            headStyles: {
                                fillColor: [240, 240, 240],
                                textColor: [0, 0, 0],
                                fontStyle: 'bold',
                                halign: 'center',
                                valign: 'middle',
                                font: 'NotoSansTC',
                            },
                            styles: {
                                fontSize: 7,
                                cellPadding: 2,
                                halign: 'center',
                                valign: 'middle',
                                font: 'NotoSansTC',
                                fontStyle: 'bold',
                                textColor: [0, 0, 0],
                                lineWidth: 0.1,
                                lineColor: [200, 200, 200],
                            },
                            columnStyles: {
                                0: { fontStyle: 'bold', fillColor: [240, 240, 240], valign: 'middle', cellWidth: 16 },
                            },
                            didDrawPage: didDrawPage,
                            didDrawCell: didDrawCellHooks
                        });
                    }

                    // Step 6: Save the PDF with the correct filename
                    const activeTags = this.activeFilters.filter(f => f.type === 'tag').map(f => f.value);
                    const tagSuffix = activeTags.length > 0 ? ` (${activeTags.join(', ')})` : '';
                    const lastModifiedTimestamp = isAllSchedules ? Date.now() : this.scheduleLastModified[this.activeScheduleId];
                    const timestampSuffix = lastModifiedTimestamp ? `-${this.formatTimestampForFilename(lastModifiedTimestamp)}` : '';

                    const filename = hasCustomTitle
                        ? `${pdfOptions.customTitle}${timestampSuffix}.pdf`
                        : `課表_${scheduleNameForPdf}${tagSuffix}${timestampSuffix}.pdf`;

                    doc.save(filename);
                    this.ui.showNotification('PDF已成功生成並下載！', 'success');

                } catch (error) {
                    console.error('生成PDF失敗:', error);
                    this.ui.showNotification(`下載PDF失敗: ${error.message}`, 'error');
                } finally {
                    this.ui.hideLoading();
                }
            }
        };

        // --- Initialization ---
        window.App = App; // Expose App to global scope for modules
        // App.init() moved to Index.html — runs after all domain modules load (Phase 1 PR1)

    })();
</script>
