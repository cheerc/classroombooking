<script>
function createInteractionModule(app) {
  const elements = AppElements; // Shortcut to elements

  const interactionModule = {
    // State for interaction logic, like double-click detection
    clickTimer: null,
    lastClickedId: null,

    setupModalListeners: function(triggerBtn, modal, closeBtn, onOpen) {
        if (!modal || !closeBtn) return;
        
        const openModal = () => {
            if (onOpen) onOpen();
            modal.style.display = 'flex';
        }
        const closeModal = () => modal.style.display = 'none';

        if (triggerBtn) {
            triggerBtn.addEventListener('click', openModal);
        }
        
        closeBtn.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    },

    addEventListeners: function() {
        const els = AppElements;
        els.loadingCancel.addEventListener('click', () => {
            if (app.loadingTimeout) clearTimeout(app.loadingTimeout);
            app.ui.hideLoading();
            app.ui.showNotification('已取消載入，使用本地數據', 'info');
            app.isConnecting = false;
        });
        els.addClassroomBtn.addEventListener('click', () => this.handleAddClassroom());
        els.addDepartmentBtn.addEventListener('click', () => this.handleAddDepartment());
        els.saveToCloudBtn.addEventListener('click', async () => {
            if (await app.modals.showConfirm('確定要將本地資料儲存到雲端嗎？<br>這將會建立一個新的版本紀錄。')) {
                app.saveDataToServer();
            }
        });
        els.loadFromCloudBtn.addEventListener('click', async () => {
            if (app.isDirty && !await app.modals.showConfirm('您有未儲存的變更，確定要從雲端讀取資料並覆蓋嗎？')) {
                return;
            }
            app.loadDataFromServer();
        });
        els.clearAllBtn.addEventListener('click', () => this.handleClearAll());
        els.loadVersionBtn.addEventListener('click', () => app.handleLoadVersion());
        els.undoBtn.addEventListener('click', () => app.historyModule.undo());
        els.redoBtn.addEventListener('click', () => app.historyModule.redo());
        
        this.setupModalListeners(els.showClassroomManagerBtn, els.classroomManagerModal, els.classroomManagerModalClose);
        this.setupModalListeners(els.showDepartmentManagerBtn, els.departmentManagerModal, els.departmentManagerModalClose);
        this.setupModalListeners(els.showVersionHistoryBtn, els.versionHistoryModal, els.versionHistoryModalClose, () => app.loadVersions());
        this.setupModalListeners(els.showHelpBtn, els.helpModal, els.helpModalClose);
        this.setupModalListeners(els.showFilterBtn, els.filterModal, els.filterModalClose, () => app.modals.populateFilterModal());
        this.setupModalListeners(els.manageSchedulesBtn, els.scheduleManagerModal, els.scheduleManagerModalClose, () => app.ui.renderScheduleList());

        els.addScheduleBtn.addEventListener('click', () => app.handleAddSchedule());
        els.scheduleList.addEventListener('click', (e) => app.handleScheduleListClick(e));
        els.scheduleSelect.addEventListener('change', (e) => app.handleScheduleSelectChange(e));

        els.classroomList.addEventListener('click', (e) => this.handleItemDelete(e, 'classroom'));
        els.departmentList.addEventListener('click', (e) => this.handleItemDelete(e, 'department'));
        els.scheduleBody.addEventListener('click', (e) => this.handleScheduleBodyClick(e));
        document.addEventListener('click', (e) => this.handleDocumentClick(e), true);
        document.addEventListener('keydown', (e) => this.handleGlobalKeydown(e));

        window.addEventListener('beforeunload', (e) => {
            if (app.isDirty) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        els.filterTypeSelector.addEventListener('change', () => app.modals.populateFilterModal());
        els.filterSelectAll.addEventListener('click', () => app.toggleAllFilterCheckboxes(true));
        els.filterDeselectAll.addEventListener('click', () => app.toggleAllFilterCheckboxes(false));
        els.filterApply.addEventListener('click', () => app.applyFilters());
        els.filterClear.addEventListener('click', () => app.clearFilters());
        els.departmentQuickFilter.addEventListener('change', () => app.ui.renderScheduleTable());

        els.viewModeWeekBtn.addEventListener('click', () => app.ui.setViewMode('week'));
        els.viewModeDayBtn.addEventListener('click', () => app.ui.setViewMode('day'));
        
        els.daySortClassroomBtn.addEventListener('click', () => app.ui.setDayViewSortMode('classroom'));
        els.daySortTimeBtn.addEventListener('click', () => app.ui.setDayViewSortMode('time'));

        const tableHead = AppElements.scheduleBody.previousElementSibling;
        tableHead.addEventListener('click', (e) => {
            const prevBtn = e.target.closest('#header-prev-day-btn');
            const nextBtn = e.target.closest('#header-next-day-btn');
            if (prevBtn) {
                app.ui.changeDay(-1);
            } else if (nextBtn) {
                app.ui.changeDay(1);
            }
        });

        app.ui.initializeTooltips();
    },

    handleGlobalKeydown: function(e) {
        if (e.key === 'Escape') {
            e.preventDefault();
            if (elements.confirmModal.style.display !== 'none') {
                elements.confirmCancel.click();
                return;
            }
            if (app.activeInlineForm) {
                app.activeInlineForm.close();
                return;
            }
            // Close any open modals on Escape
            const openModals = document.querySelectorAll('.loading-overlay[style*="display: flex"]');
            if (openModals.length > 0) {
                openModals[openModals.length - 1].style.display = 'none';
            }
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
            e.preventDefault();
            app.historyModule.undo();
        }
        if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
            e.preventDefault();
            app.historyModule.redo();
        }
    },

    handleDocumentClick: function(e) {
        if (e.target.closest('.department-editor')) {
            return;
        }

        if (app.activeInlineForm && !e.target.closest('.inline-add-form') && !e.target.closest('.inline-notes-editor')) {
            app.activeInlineForm.close();
        } 
        else if (!app.activeInlineForm && !e.target.closest('.class-item')) {
            app.ui.clearAllSelections();
        }
    },

    _buildCourseFormHtml: function(isEditMode, classItemToEdit, day) {
        const daySelectorHtml = isEditMode ? '' : AppConfig.WEEKDAYS.map((dayName, index) => `
            <label><input type="checkbox" class="inline-day-checkbox" value="${index}" ${index === day ? 'checked' : ''}> ${dayName.replace('星期', '')}</label>
        `).join('');

        const departmentCheckboxes = app.departments.map(dept => {
            const isChecked = isEditMode && (classItemToEdit.departments || []).includes(dept);
            return `<label><input type="checkbox" class="inline-department-checkbox" value="${dept}" ${isChecked ? 'checked' : ''}> ${dept}</label>`;
        }).join('');
        
        const departmentSelectorHtml = app.departments.length > 0 ? `
            <div class="inline-department-selector">
                <div class="inline-selector-title">部門:</div>
                ${departmentCheckboxes}
            </div>` : '';

        return `
            <button title="取消" class="inline-add-cancel-btn">×</button>
            ${isEditMode ? '' : `<div class="inline-day-selector">${daySelectorHtml}</div>`}
            <input type="text" placeholder="課程名稱" class="inline-input" name="name" value="${isEditMode ? classItemToEdit.name : ''}" required>
            <div class="inline-time-inputs">
                <input type="time" class="inline-input" name="timeStart" value="${isEditMode ? classItemToEdit.timeStart : ''}" required>
                <span>-</span>
                <input type="time" class="inline-input" name="timeEnd" value="${isEditMode ? classItemToEdit.timeEnd : ''}" required>
            </div>
            <input type="text" placeholder="使用人" class="inline-input" name="teacher" value="${isEditMode ? classItemToEdit.teacher : ''}">
            ${departmentSelectorHtml}
            ${app.currentViewMode === 'day' ? `<textarea placeholder="備註 (僅在日檢視顯示/編輯)" class="inline-input" name="notes" style="min-height: 60px;">${isEditMode ? classItemToEdit.notes || '' : ''}</textarea>` : ''}
            <div class="inline-form-actions">
                <button title="儲存" class="save-inline">✓</button>
            </div>
        `;
    },

    _handleCourseFormSave: async function(formDiv, isEditMode, originalData, context) {
        const { classroom, day } = context;
        const name = formDiv.querySelector('input[name="name"]').value.trim();
        const timeStart = formDiv.querySelector('input[name="timeStart"]').value.trim();
        const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value.trim();
        const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
        const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);
        const selectedDays = isEditMode ? [day] : Array.from(formDiv.querySelectorAll('.inline-day-checkbox:checked')).map(cb => parseInt(cb.value));
        const notesTextarea = formDiv.querySelector('textarea[name="notes"]');

        if (!name) { app.ui.showNotification('課程名稱不能為空！', 'error'); return false; }
        if (!teacher) { app.ui.showNotification('使用人不能為空！', 'error'); return false; }
        if (selectedDepartments.length === 0) { app.ui.showNotification('請至少選擇一個部門！', 'error'); return false; }
        if (selectedDays.length === 0) { app.ui.showNotification('請至少選擇一個星期！', 'error'); return false; }
        if (!timeStart || !timeEnd) { app.ui.showNotification('請輸入完整的開始與結束時間！', 'error'); return false; }

        const formattedTimeStart = app.formatTime(timeStart);
        const formattedTimeEnd = app.formatTime(timeEnd);
        if (app.timeToMinutes(formattedTimeStart) >= app.timeToMinutes(formattedTimeEnd)) { app.ui.showNotification('開始時間不能晚於或等於結束時間！', 'error'); return false; }

        if (isEditMode) {
            const classItem = app.scheduleData[context.classroom]?.[context.day]?.find(c => c.id === originalData.id);

            if (!classItem) {
                app.ui.showNotification('錯誤：找不到要更新的課程項目。', 'error');
                console.error("Could not find class item to update with id:", originalData.id);
                return false;
            }

            if (name !== originalData.name) {
                const otherNameOccurrences = app._countOccurrences(item => item.name === originalData.name && item.id !== classItem.id);
                if (otherNameOccurrences > 0) {
                    const confirmAll = await app.modals.showConfirm(`找到 ${otherNameOccurrences} 個其他名為 "${originalData.name}" 的課程。<br>要全部一起改名為 "${name}" 嗎？`);
                    if (confirmAll) {
                        app._updateAllOccurrences(item => item.name === originalData.name, item => item.name = name);
                        const activeFilterIndex = app.activeFilters.findIndex(f => f.type === 'name' && f.value === originalData.name);
                        if (activeFilterIndex > -1) app.activeFilters[activeFilterIndex].value = name;
                    } else {
                        classItem.name = name;
                    }
                } else {
                    classItem.name = name;
                }
                app.buildCourseColorMap();
            }

            if (teacher !== originalData.teacher) {
                const otherTeacherOccurrences = app._countOccurrences(item => item.name === originalData.name && item.teacher === originalData.teacher && item.id !== classItem.id);
                if (otherTeacherOccurrences > 0) {
                    const confirmAll = await app.modals.showConfirm(`找到 ${otherTeacherOccurrences} 堂其他由 "${originalData.teacher}" 上的 "${originalData.name}" 課程。<br>要將使用人一起變更為 "${teacher}" 嗎？`);
                    if (confirmAll) {
                        app._updateAllOccurrences(
                            item => item.name === originalData.name && item.teacher === originalData.teacher,
                            item => item.teacher = teacher
                        );
                    } else {
                        classItem.teacher = teacher;
                    }
                } else {
                    classItem.teacher = teacher;
                }
            }

            classItem.timeStart = formattedTimeStart;
            classItem.timeEnd = formattedTimeEnd;
            classItem.departments = selectedDepartments;
            if (notesTextarea) {
                classItem.notes = notesTextarea.value.trim();
            }

        } else {
            let hasConflictOccurred = false;
            if (!app.courseColorMap[name]) app.buildCourseColorMap();

            selectedDays.forEach(selectedDay => {
                const classItem = { 
                    id: app.generateUniqueId(), 
                    name, 
                    timeStart: formattedTimeStart, 
                    timeEnd: formattedTimeEnd, 
                    teacher,
                    departments: selectedDepartments,
                    notes: notesTextarea ? notesTextarea.value.trim() : ''
                };

                if (app.checkTimeConflict(classroom, selectedDay, classItem)) {
                    app.ui.showNotification(`在 ${classroom} ${AppConfig.WEEKDAYS[selectedDay]} 有時間衝突！`, 'info', 5000);
                    hasConflictOccurred = true;
                }

                if (!app.scheduleData[classroom]) app.scheduleData[classroom] = {};
                if (!app.scheduleData[classroom][selectedDay]) app.scheduleData[classroom][selectedDay] = [];

                const daySchedule = app.scheduleData[classroom][selectedDay];
                const insertIndex = daySchedule.findIndex(item => app.timeToMinutes(item.timeStart) > app.timeToMinutes(classItem.timeStart));
                daySchedule.splice(insertIndex === -1 ? daySchedule.length : insertIndex, 0, classItem);
            });
            if (selectedDays.length > 0 && !hasConflictOccurred) app.ui.showNotification('已新增課程');
        }
        return true;
    },

    _createInlineNotesEditor: function(notesDiv) {
        if (app.activeInlineForm) return;

        const classElement = notesDiv.closest('.class-item');
        const classId = classElement.dataset.id;
        const classroom = classElement.closest('td').dataset.classroom;
        const day = parseInt(classElement.closest('td').dataset.day);
        const classItem = app.scheduleData[classroom]?.[day]?.find(c => c.id === classId);

        if (!classItem) return;

        const originalNotes = classItem.notes || '';
        const textarea = document.createElement('textarea');
        textarea.className = 'inline-notes-editor';
        textarea.value = originalNotes;

        notesDiv.replaceWith(textarea);
        textarea.focus();
        textarea.select();

        const closeEditor = (shouldSave) => {
            if (shouldSave) {
                const newNotes = textarea.value.trim();
                if (newNotes !== originalNotes) {
                    classItem.notes = newNotes;
                    app.saveDataToLocal();
                    app.historyModule.saveState();
                }
            }
            app.activeInlineForm = null;
            app.ui.renderScheduleTable();
        };

        app.activeInlineForm = { close: () => closeEditor(false) };

        textarea.addEventListener('blur', () => closeEditor(true));
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                e.preventDefault();
                closeEditor(false);
            }
        });
    },

    _createOrEditCourseForm: async function(container, classItemToEdit, context) {
        const isEditMode = classItemToEdit !== null;
        const originalData = isEditMode ? { ...classItemToEdit } : {};

        const formDiv = document.createElement('div');
        formDiv.setAttribute('class', 'inline-add-form');
        formDiv.innerHTML = this._buildCourseFormHtml(isEditMode, classItemToEdit, context.day);

        if (isEditMode) {
            container.innerHTML = '';
        }
        container.appendChild(formDiv);
        formDiv.querySelector('input[name="name"]').focus();

        const isDirty = () => {
            const name = formDiv.querySelector('input[name="name"]').value.trim();
            const timeStart = formDiv.querySelector('input[name="timeStart"]').value;
            const timeEnd = formDiv.querySelector('input[name="timeEnd"]').value;
            const teacher = formDiv.querySelector('input[name="teacher"]').value.trim();
            const selectedDepartments = Array.from(formDiv.querySelectorAll('.inline-department-checkbox:checked')).map(cb => cb.value);

            if (!isEditMode) {
                return name !== '' || timeStart !== '' || timeEnd !== '' || teacher !== '';
            }
            
            return name !== originalData.name ||
                   timeStart !== originalData.timeStart ||
                   timeEnd !== originalData.timeEnd ||
                   teacher !== originalData.teacher ||
                   JSON.stringify(selectedDepartments.sort()) !== JSON.stringify((originalData.departments || []).sort());
        };

        const closeHandler = async (forceSave = false) => {
            if (app.activeInlineForm && app.activeInlineForm.isClosing) return true;
            if(app.activeInlineForm) app.activeInlineForm.isClosing = true;

            if (forceSave) {
                const saved = await this._handleCourseFormSave(formDiv, isEditMode, originalData, context);
                if (!saved) { 
                    if(app.activeInlineForm) app.activeInlineForm.isClosing = false;
                    return false; 
                }
            } else {
                if (isDirty()) {
                    if (!await app.modals.showConfirm('您有未儲存的變更，確定要捨棄嗎？')) {
                        if(app.activeInlineForm) app.activeInlineForm.isClosing = false;
                        return false;
                    }
                }
            }

            app.activeInlineForm = null;
            app.ui.renderScheduleTable();
            if (forceSave) {
                app.ui.showNotification(isEditMode ? '已更新課程資訊' : '已新增課程');
                app.saveDataToLocal();
                app.historyModule.saveState();
            }
            return true;
        };

        app.activeInlineForm = { close: closeHandler, isDirty: isDirty, isClosing: false };

        formDiv.querySelector('.save-inline').addEventListener('click', (e) => { e.preventDefault(); closeHandler(true); });
        formDiv.querySelector('.inline-add-cancel-btn').addEventListener('click', () => closeHandler());
        formDiv.addEventListener('keydown', (evt) => { if (evt.key === 'Escape') { evt.preventDefault(); closeHandler(); } });
    },

    handleEmptyCellDoubleClick: async function(e, cell) {
        if (app.activeInlineForm) {
            const isClosed = await app.activeInlineForm.close();
            if (!isClosed) return;
        }
        const classroom = cell.dataset.classroom;
        const day = parseInt(cell.dataset.day);
        if (!classroom || isNaN(day)) return;

        this._createOrEditCourseForm(cell, null, { classroom, day });
    },

    handleEditFieldClick: async function(e, element) {
        if (app.activeInlineForm) {
            const isClosed = await app.activeInlineForm.close();
            if (!isClosed) return;
        }
        
        app.ui.clearAllSelections();
        e.stopPropagation();

        const classElement = element.closest('.class-item');
        if (!document.body.contains(classElement)) return;

        const classId = classElement.dataset.id;
        const classroom = classElement.closest('td').dataset.classroom;
        const day = parseInt(classElement.closest('td').dataset.day);
        
        const classItem = app.scheduleData[classroom]?.[day]?.find(c => c.id === classId);
        if (!classItem) return;

        this._createOrEditCourseForm(classElement, classItem, { classroom, day });
    },

    handleScheduleBodyClick: function(event) {
        if (app.activeInlineForm) {
            return;
        }

        const classElement = event.target.closest('.class-item');
        const deleteBtn = event.target.closest('.delete-btn');

        if (deleteBtn) {
            this.handleDeleteClassClick(event, deleteBtn);
            return;
        }

        const cell = event.target.closest('.schedule-cell');
        if (!classElement && cell && !cell.querySelector('.inline-add-form')) {
            if (this.clickTimer && this.lastClickedId === 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day) {
                clearTimeout(this.clickTimer);
                this.clickTimer = null;
                this.lastClickedId = null;
                this.handleEmptyCellDoubleClick(event, cell);
            } else {
                clearTimeout(this.clickTimer);
                this.lastClickedId = 'empty-' + cell.dataset.classroom + '-' + cell.dataset.day;
                this.clickTimer = setTimeout(() => {
                    app.ui.clearAllSelections();
                    this.clickTimer = null;
                    this.lastClickedId = null;
                }, 250);
            }
            return;
        }

        if (classElement) {
            const classId = classElement.dataset.id;
            if (this.clickTimer && this.lastClickedId === classId) {
                clearTimeout(this.clickTimer);
                this.clickTimer = null;
                this.lastClickedId = null;
                
                const notesElement = event.target.closest('.course-notes');
                if (notesElement && app.currentViewMode === 'day') {
                    this._createInlineNotesEditor(notesElement);
                } else {
                    this.handleEditFieldClick(event, event.target.closest('.editable') || classElement);
                }
            } else {
                clearTimeout(this.clickTimer);
                this.lastClickedId = classId;
                this.clickTimer = setTimeout(() => {
                    app.ui.toggleSelection(classElement);
                    this.clickTimer = null;
                    this.lastClickedId = null;
                }, 250);
            }
        }
    },

    handleDeleteClassClick: async function(event, btn) {
        const classElement = btn.closest('.class-item');
        const classId = classElement.dataset.id;
        const classroom = btn.dataset.classroom;
        const day = parseInt(btn.dataset.day);
        const className = classElement.querySelector('[data-field="name"]').textContent;
        if (await app.modals.showConfirm(`確定要刪除課程 "${className}" 嗎？`)) {
            if (!app.scheduleData[classroom] || !app.scheduleData[classroom][day]) return;
            const classIndex = app.scheduleData[classroom][day].findIndex(c => c.id === classId);
            if (classIndex > -1) {
                app.scheduleData[classroom][day].splice(classIndex, 1);
                if (app.scheduleData[classroom][day].length === 0) {
                    delete app.scheduleData[classroom][day];
                }
                app.ui.renderScheduleTable();
                app.ui.showNotification('已刪除課程');
                app.saveDataToLocal();
                app.historyModule.saveState();
            }
        }
    },

    _handleAddItem: function(config) {
        const { itemType, name, sourceArray, inputElement, updateListFn, postAddFn } = config;
        if (!name) return;
        if (sourceArray.includes(name)) {
            app.ui.showNotification(`此${itemType}名稱已存在！`, 'error');
            return;
        }
        sourceArray.push(name);
        inputElement.value = '';
        updateListFn();
        if (postAddFn) postAddFn();
        
        app.saveDataToLocal();
        app.ui.showNotification(`已新增${itemType}: ${name}`);
        app.historyModule.saveState();
    },

    handleAddClassroom: function() {
        this._handleAddItem({
            itemType: '教室',
            name: elements.classroomNameInput.value.trim(),
            sourceArray: app.classrooms,
            inputElement: elements.classroomNameInput,
            updateListFn: app.ui.updateClassroomList.bind(app.ui),
            postAddFn: app.ui.renderScheduleTable.bind(app.ui)
        });
    },

    handleAddDepartment: function() {
        this._handleAddItem({
            itemType: '部門',
            name: elements.departmentNameInput.value.trim(),
            sourceArray: app.departments,
            inputElement: elements.departmentNameInput,
            updateListFn: app.ui.updateDepartmentList.bind(app.ui)
        });
    },

    handleItemDelete: async function(event, itemType) {
        const config = {
            classroom: {
                btnSelector: '.delete-classroom',
                dataAttribute: 'data-classroom',
                typeName: '教室',
                sourceArray: app.classrooms,
                isInUse: (name) => app.scheduleData[name] && Object.values(app.scheduleData[name]).some(day => day.length > 0),
                inUseMessage: '無法刪除教室：請先移除此教室的所有課程登記！',
                updateList: app.ui.updateClassroomList.bind(app.ui),
                postDelete: (name) => {
                    delete app.scheduleData[name];
                    app.ui.renderScheduleTable();
                }
            },
            department: {
                btnSelector: '.delete-department',
                dataAttribute: 'data-department',
                typeName: '部門',
                sourceArray: app.departments,
                isInUse: (name) => Object.values(app.scheduleData).some(classroom => 
                    Object.values(classroom).some(day => 
                        day.some(course => course.departments && course.departments.includes(name))
                    )
                ),
                inUseMessage: '無法刪除部門：請先從所有課程中移除此部門標籤！',
                updateList: app.ui.updateDepartmentList.bind(app.ui),
                postDelete: null
            }
        };

        const currentConfig = config[itemType];
        if (!currentConfig) return;

        const btn = event.target.closest(currentConfig.btnSelector);
        if (!btn) return;

        const itemName = btn.getAttribute(currentConfig.dataAttribute);
        if (currentConfig.isInUse(itemName)) {
            app.ui.showNotification(currentConfig.inUseMessage, 'error', 5000);
            return;
        }

        if (await app.modals.showConfirm(`確定要刪除${currentConfig.typeName} "${itemName}" 嗎？`)) {
            const itemIndex = currentConfig.sourceArray.indexOf(itemName);
            if (itemIndex > -1) {
                currentConfig.sourceArray.splice(itemIndex, 1);
            }

            if (currentConfig.postDelete) {
                currentConfig.postDelete(itemName);
            }

            currentConfig.updateList();
            app.saveDataToLocal();
            app.ui.showNotification(`已刪除${currentConfig.typeName}: ${itemName}`);
            app.historyModule.saveState();
        }
    },

    handleClearAll: async function() {
        if (await app.modals.showConfirm('確定要清除所有本地暫存資料嗎？<br>這將會刪除所有課表並重置為一個預設課表。此操作不可恢復！')) {
            localStorage.removeItem('schedules');
            localStorage.removeItem('activeScheduleId');
            localStorage.removeItem('lastSyncTime');

            app.schedules = {};
            app.activeScheduleId = null;
            app.activeFilters = [];
            app.lastSyncTime = null;
            app.courseColorMap = {};
            app.updateLastModifiedTime(null);
            
            app.loadInitialSchedules();
            app.ui.updateActiveFilterDisplay();
            app.ui.showNotification('已清除所有本地資料');
        }
    }
  };

  return interactionModule;
}
</script>
