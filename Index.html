<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室使用登記表 (Google試算表版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <?!= HtmlService.createHtmlOutputFromFile('Stylesheet').getContent(); ?>
</head>
<body class="bg-blue-50 min-h-screen p-4">
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p id="loading-text" class="text-lg">載入中，請稍候...</p>
            <button id="loading-cancel" class="mt-4 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">取消並使用本地數據</button>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <div class="relative mb-6">
            <div class="absolute top-1/2 left-0 transform -translate-y-1/2">
                <div id="sync-status" class="sync-status">
                    <div id="sync-status-text">本地模式</div>
                    <div id="last-sync-time" class="last-sync-time"></div>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-center text-blue-800 py-2">教室使用登記表</h1>
        </div>

        <div class="overflow-x-auto mb-8">
            <table id="schedule-table" class="schedule-table w-full border-collapse">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="border border-gray-300 p-2 w-24">教室 / 星期</th>
                        <th class="border border-gray-300 p-2">星期一</th>
                        <th class="border border-gray-300 p-2">星期二</th>
                        <th class="border border-gray-300 p-2">星期三</th>
                        <th class="border border-gray-300 p-2">星期四</th>
                        <th class="border border-gray-300 p-2">星期五</th>
                        <th class="border border-gray-300 p-2">星期六</th>
                        <th class="border border-gray-300 p-2">星期日</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    </tbody>
            </table>
        </div>

        <div class="mb-8 flex flex-wrap gap-4 justify-between items-center">
            <!-- Local Actions -->
            <div class="flex flex-wrap gap-2">
                <button id="undo-btn" class="bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>復原</button>
                <button id="redo-btn" class="bg-gray-500 text-white px-6 py-2 rounded-md hover:bg-gray-600 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>重做</button>
            </div>
            <!-- Cloud Actions -->
            <div class="flex flex-wrap gap-2">
                <button id="save-to-cloud-btn" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition">儲存資料到雲端</button>
                <button id="load-from-cloud-btn" class="bg-teal-600 text-white px-6 py-2 rounded-md hover:bg-teal-700 transition">從雲端讀取資料</button>
                <button id="clear-all" class="bg-red-600 text-white px-6 py-2 rounded-md hover:bg-red-700 transition">清除本地暫存資料</button>
            </div>
        </div>

        <div class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-green-100 p-4 rounded-lg shadow md:col-span-2">
                <h2 class="text-xl font-semibold mb-3 text-green-700">課程登記</h2>
                <div class="grid grid-cols-1 gap-3">
                    <div class="flex items-center">
                        <label for="class-classroom" class="w-24">教室:</label>
                        <select id="class-classroom" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="mb-1">星期:</label>
                        <div id="day-selector" class="flex flex-wrap gap-2">
                            <!-- Day checkboxes will be generated by JS -->
                        </div>
                    </div>
                    <div class="flex items-center">
                        <label for="class-name" class="w-24">課程名稱:</label>
                        <input type="text" id="class-name" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>

                    <div>
                        <label for="class-time-start" class="w-24 block">使用時間:</label>
                        <div id="manual-time-input" class="flex flex-col mt-1">
                            <div class="flex">
                                <input type="text" id="class-time-start" placeholder="開始 (如: 09:00)" class="flex-1 px-3 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-green-500">
                                <span class="px-2 py-2 bg-gray-200 flex items-center">至</span>
                                <input type="text" id="class-time-end" placeholder="結束 (如: 12:00)" class="flex-1 px-3 py-2 border border-gray-300 rounded-r-md focus:outline-none focus:ring-2 focus:ring-green-500">
                            </div>
                            <div class="time-format-hint">請使用24小時制 (例如: 08:00, 13:30)</div>
                        </div>
                    </div>

                    <div class="flex items-center">
                        <label for="class-teacher" class="w-24">使用人:</label>
                        <input type="text" id="class-teacher" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <button id="add-class" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">新增課程</button>
                </div>
            </div>

            <div class="bg-blue-100 p-4 rounded-lg shadow">
                <h2 id="toggle-classroom-manager" class="text-xl font-semibold mb-3 text-blue-700 flex justify-between items-center cursor-pointer">
                    <span>教室管理</span>
                    <svg class="w-6 h-6 transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </h2>
                <div id="classroom-manager-content" class="hidden">
                    <div class="flex mb-4">
                        <label for="classroom-name" class="sr-only">教室名稱</label>
                        <input type="text" id="classroom-name" placeholder="輸入教室名稱" class="flex-1 px-3 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="add-classroom" class="bg-blue-600 text-white px-4 py-2 rounded-r-md hover:bg-blue-700 transition">新增教室</button>
                    </div>
                    <div class="bg-white p-3 rounded-md max-h-40 overflow-y-auto">
                        <h3 class="font-medium mb-2">現有教室:</h3>
                        <ul id="classroom-list" class="space-y-1">
                            </ul>
                    </div>
                </div>
            </div>

            <div class="bg-yellow-100 p-4 rounded-lg shadow">
                <h2 id="toggle-version-history" class="text-xl font-semibold mb-3 text-yellow-700 flex justify-between items-center cursor-pointer">
                    <span>版本紀錄</span>
                    <svg class="w-6 h-6 transform transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </h2>
                <div id="version-history-content" class="hidden">
                    <div class="flex mb-4">
                        <label for="version-history" class="sr-only">版本紀錄</label>
                        <select id="version-history" class="flex-1 px-3 py-2 border border-gray-300 rounded-l-md focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            <option>請點擊刷新按鈕獲取紀錄</option>
                        </select>
                        <button id="refresh-versions" class="bg-yellow-600 text-white px-4 rounded-r-md hover:bg-yellow-700 transition">刷新</button>
                    </div>
                    <button id="load-version" class="w-full bg-yellow-500 text-white px-4 py-2 rounded-md hover:bg-yellow-600 transition">讀取選定版本 (僅在本地預覽)</button>
                </div>
            </div>
        </div>

    </div>

    <div class="version-badge">版本 5.27</div>

    <div id="confirm-modal" class="loading-overlay" style="display: none;">
        <div class="bg-white p-6 rounded-lg shadow-lg text-center max-w-sm w-full">
            <p id="confirm-text" class="text-lg mb-4"></p>
            <div class="flex justify-center gap-4">
                <button id="confirm-cancel" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded-md">取消</button>
                <button id="confirm-ok" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-md">確定</button>
            </div>
        </div>
    </div>

    <?!= HtmlService.createHtmlOutputFromFile('JavaScript').getContent(); ?>
</body>
</html>
