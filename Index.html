    <script>
        // 版本控制
        const APP_VERSION = '4.2';
        
        // 全局變數初始化
        let classrooms = [];
        let scheduleData = {};
        let lastSyncTime = null;
        let loadingTimeout = null;
        let isConnecting = false;
        
        // DOM 元素
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const loadingCancel = document.getElementById('loading-cancel');
        const notification = document.getElementById('notification');
        const syncStatusText = document.getElementById('sync-status-text');
        const lastSyncTimeText = document.getElementById('last-sync-time');
        const classroomNameInput = document.getElementById('classroom-name');
        const addClassroomBtn = document.getElementById('add-classroom');
        const classroomList = document.getElementById('classroom-list');
        const classClassroomSelect = document.getElementById('class-classroom');
        const dayCheckboxes = document.querySelectorAll('.day-checkbox');
        const classNameInput = document.getElementById('class-name');
        const classTimeStartInput = document.getElementById('class-time-start');
        const classTimeEndInput = document.getElementById('class-time-end');
        const classTeacherInput = document.getElementById('class-teacher');
        const addClassBtn = document.getElementById('add-class');
        const scheduleBody = document.getElementById('schedule-body');
        const saveToCloudBtn = document.getElementById('save-to-cloud-btn');
        const loadFromCloudBtn = document.getElementById('load-from-cloud-btn');
        const clearAllBtn = document.getElementById('clear-all');
        const manualTimeInput = document.getElementById('manual-time-input');
        const sliderTimeInput = document.getElementById('slider-time-input');
        const timeInputMethods = document.querySelectorAll('input[name="time-input-method"]');
        const sliderTimeStart = document.getElementById('slider-time-start');
        const sliderTimeEnd = document.getElementById('slider-time-end');
        
        // 時間軸相關變數
        const timeSlider = document.querySelector('.time-slider');
        const startHandle = document.querySelector('.time-handle.start');
        const endHandle = document.querySelector('.time-handle.end');
        const sliderContainer = document.querySelector('.time-slider-container');
        let isDraggingStart = false;
        let isDraggingEnd = false;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log("頁面初始化開始");
            
            // 從本地載入數據，確保界面可用
            try {
                console.log("從本地載入數據");
                loadDataFromLocal();
                console.log("本地數據載入成功");
            } catch (e) {
                console.error('從本地載入數據失敗:', e);
                // 確保有默認值
                classrooms = [];
                scheduleData = {};
            }
            
            // 更新 UI
            updateClassroomList();
            renderScheduleTable();
            updateSyncStatus();
            
            // 初始化時間軸
            initTimeSlider();
            
            // 設置取消載入按鈕
            loadingCancel.addEventListener('click', function() {
                if (loadingTimeout) {
                    clearTimeout(loadingTimeout);
                    loadingTimeout = null;
                }
                
                hideLoading();
                showNotification('已取消載入，使用本地數據', 'info');
                isConnecting = false;
            });
            
            // 自動從雲端載入數據
            console.log("頁面初始化完成，自動從雲端載入數據");
            
            // 延遲一小段時間再載入，確保UI已經完全渲染
            setTimeout(() => {
                loadDataFromServer();
            }, 500);
        });
        
        // 顯示載入中遮罩
        function showLoading(message = '載入中，請稍候...') {
            loadingText.textContent = message;
            loadingOverlay.style.display = 'flex';
            
            // 設置超時處理，防止無限等待
            if (loadingTimeout) {
                clearTimeout(loadingTimeout);
            }
            
            loadingTimeout = setTimeout(function() {
                hideLoading();
                showNotification('載入超時，使用本地數據', 'error');
                isConnecting = false;
            }, 30000); // 30秒超時
        }
        
        // 隱藏載入中遮罩
        function hideLoading() {
            loadingOverlay.style.display = 'none';
            
            if (loadingTimeout) {
                clearTimeout(loadingTimeout);
                loadingTimeout = null;
            }
        }
        
        // 更新同步狀態
        function updateSyncStatus() {
            if (lastSyncTime) {
                const timeStr = lastSyncTime.toLocaleString();
                syncStatusText.textContent = '已同步';
                syncStatusText.parentElement.className = 'sync-status online';
                lastSyncTimeText.textContent = `上次同步: ${timeStr}`;
            } else {
                syncStatusText.textContent = '本地模式';
                syncStatusText.parentElement.className = 'sync-status offline';
                lastSyncTimeText.textContent = '尚未同步';
            }
        }
        
        // 顯示通知
        function showNotification(message, type = 'success', duration = 3000) {
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            // 指定時間後自動消失
            setTimeout(() => {
                notification.classList.remove('show');
            }, duration);
        }
        
        // 從本地存儲加載數據
        function loadDataFromLocal() {
            try {
                const savedClassrooms = localStorage.getItem('classrooms');
                const savedScheduleData = localStorage.getItem('scheduleData');
                const savedLastSyncTime = localStorage.getItem('lastSyncTime');
                
                if (savedClassrooms) {
                    classrooms = JSON.parse(savedClassrooms) || [];
                    console.log("從本地載入教室數據:", classrooms.length, "個教室");
                } else {
                    classrooms = [];
                    console.log("本地無教室數據");
                }
                
                if (savedScheduleData) {
                    scheduleData = JSON.parse(savedScheduleData) || {};
                    console.log("從本地載入課程數據");
                } else {
                    scheduleData = {};
                    console.log("本地無課程數據");
                }
                
                if (savedLastSyncTime) {
                    lastSyncTime = new Date(savedLastSyncTime);
                    console.log("上次同步時間:", lastSyncTime);
                }
            } catch (e) {
                console.error('從本地載入數據失敗:', e);
                classrooms = [];
                scheduleData = {};
                lastSyncTime = null;
            }
        }
        
        // 保存數據到本地存儲
        function saveDataToLocal() {
            try {
                localStorage.setItem('classrooms', JSON.stringify(classrooms || []));
                localStorage.setItem('scheduleData', JSON.stringify(scheduleData || {}));
                localStorage.setItem('app_version', APP_VERSION);
                if (lastSyncTime) {
                    localStorage.setItem('lastSyncTime', lastSyncTime.toISOString());
                }
                console.log("數據已保存到本地存儲");
            } catch (e) {
                console.error("保存數據到本地失敗:", e);
                showNotification("保存數據失敗，可能是存儲空間不足", "error");
            }
        }
        
        // 從 Google 試算表載入數據
        function loadDataFromServer() {
            if (isConnecting) return;
            isConnecting = true;
            
            showLoading('從雲端讀取數據...');
            console.log("嘗試從 Google 試算表載入數據...");
            
            try {
                // 檢查 google.script.run 是否可用
                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    console.error('google.script.run 不可用，可能是在本地環境運行');
                    setTimeout(() => {
                        hideLoading();
                        showNotification('無法連接到雲端，使用本地數據', 'info');
                        isConnecting = false;
                    }, 1000);
                    return;
                }
                
                // 直接調用 getData 函數，不再使用 initializeDatabase
                google.script.run
                    .withSuccessHandler(function(result) {
                        console.log('從 Google 試算表獲取數據成功，原始結果:', result);
                        
                        try {
                            // 檢查結果是否有效
                            if (!result) {
                                throw new Error('從服務器獲取的數據為空');
                            }
                            
                            // 處理教室數據
                            if (result.classrooms) {
                                if (Array.isArray(result.classrooms)) {
                                    // 直接替換本地數據
                                    classrooms = [...result.classrooms];
                                    console.log('成功載入教室數據:', classrooms.length, '個教室');
                                } else {

                                    throw new Error('教室數據格式錯誤');
                                }
                            } else {
                                console.warn('從服務器獲取的 classrooms 不存在，使用空數組');
                                classrooms = [];
                            }
                            
                            // 處理課程數據
                            if (result.scheduleData) {
                                if (typeof result.scheduleData === 'object') {
                                    // 直接替換本地數據
                                    scheduleData = JSON.parse(JSON.stringify(result.scheduleData));

                                    console.error('服務器返回的 scheduleData 不是對象:', result.scheduleData);
                                    throw new Error('課程數據格式錯誤');
                                }
                            } else {
                                console.warn('從服務器獲取的 scheduleData 不存在，使用空對象');
                                scheduleData = {};

                            // 更新同步時間
                            lastSyncTime = new Date();
                            
                            // 保存到本地
                            saveDataToLocal();
                            
                            // 更新 UI
                            updateClassroomList();
                            renderScheduleTable();
                            updateSyncStatus();
                            
                            showNotification('從雲端讀取數據成功！');

                        } finally {
                            hideLoading();
                            isConnecting = false;

                    })
                    .withFailureHandler(function(error) {
                        console.error('從 Google 試算表獲取數據失敗:', error);
                        showNotification('從雲端讀取數據失敗: ' + (error.message || '未知錯誤'), 'error');
                        hideLoading();
                        isConnecting = false;
                    })
                    .getData();
            } catch (error) {
                console.error('調用 Google Apps Script 失敗:', error);
                showNotification('連接失敗: ' + (error.message || '未知錯誤'), 'error');
                hideLoading();
                isConnecting = false;

        // 將數據保存到 Google 試算表
        function saveDataToServer() {
            if (isConnecting) return;
            isConnecting = true;
            
            showLoading('保存數據到 Google 試算表...');
            syncStatusText.textContent = '正在同步';
            syncStatusText.parentElement.className = 'sync-status syncing';
            
            try {
                console.log("嘗試保存數據到 Google 試算表...");
                console.log("要保存的數據:", {
                    classrooms: classrooms,
                    scheduleData: scheduleData
                });
                
                // 檢查 google.script.run 是否可用
                if (typeof google === 'undefined' || !google.script || !google.script.run) {
                    console.error('google.script.run 不可用，可能是在本地環境運行');
                    setTimeout(() => {
                        hideLoading();
                        showNotification('無法連接到雲端，使用本地數據', 'info');
                        syncStatusText.textContent = '同步失敗';
                        syncStatusText.parentElement.className = 'sync-status offline';
                        isConnecting = false;
                    }, 1000);
                    return;
                }
                
                // 直接調用 saveData 函數，不再使用 initializeDatabase
                google.script.run
                    .withSuccessHandler(function(result) {
                        console.log("Google 試算表保存結果:", result);
                        
                        if (result && result.success) {
                            lastSyncTime = new Date();
                            updateSyncStatus();
                            showNotification('數據已成功儲存到雲端！');
                            
                            // 更新本地存儲的同步時間
                            saveDataToLocal();
                        } else {
                            throw new Error(result && result.error ? result.error : '未知錯誤');
                        }
                        
                        // 無論成功或失敗，都隱藏載入遮罩
                        hideLoading();
                        isConnecting = false;
                    })
                    .withFailureHandler(function(error) {
                        console.error('數據同步失敗:', error);
                        showNotification(`數據儲存失敗: ${error.message || error}`, 'error');
                        syncStatusText.textContent = '同步失敗';
                        syncStatusText.parentElement.className = 'sync-status offline';
                        hideLoading();
                        isConnecting = false;
                    })
                    .saveData({
                        classrooms: classrooms || [],
                        scheduleData: scheduleData || {}
                    });
            } catch (error) {
                console.error('調用 Google Apps Script 失敗:', error);
                showNotification(`連接失敗: ${error.message || '未知錯誤'}`, 'error');
                syncStatusText.textContent = '同步失敗';
                syncStatusText.parentElement.className = 'sync-status offline';
                hideLoading();
                isConnecting = false;
            }
        }
        
        // 教室排序函數：百位數降序，十位數以下升序
        function sortClassrooms(classroomList) {
            try {
                if (!Array.isArray(classroomList)) {
                    console.error('sortClassrooms: classroomList 不是數組', classroomList);
                    return [];
                }
                
                return [...classroomList].sort((a, b) => {
                    // 提取數字部分
                    const numA = parseInt((a.match(/\d+/) || ['0'])[0]);
                    const numB = parseInt((b.match(/\d+/) || ['0'])[0]);
                    
                    // 獲取百位數
                    const hundredsA = Math.floor(numA / 100);
                    const hundredsB = Math.floor(numB / 100);
                    
                    // 獲取十位數以下
                    const remainderA = numA % 100;
                    const remainderB = numB % 100;
                    
                    // 先按百位數降序排列
                    if (hundredsA !== hundredsB) {
                        return hundredsB - hundredsA;
                    }
                    
                    // 再按十位數以下升序排列
                    return remainderA - remainderB;
                });
            } catch (e) {
                console.error('排序教室失敗:', e);
                return classroomList || [];
            }
        }

        // 檢查時間衝突
        function checkTimeConflict(classroom, day, newClass, excludeIndex = -1) {
            try {
                if (!scheduleData[classroom] || !scheduleData[classroom][day]) {
                    return false;
                }
                
                const newStart = timeToMinutes(newClass.timeStart);
                const newEnd = timeToMinutes(newClass.timeEnd);
                
                return scheduleData[classroom][day].some((existingClass, index) => {
                    if (index === excludeIndex) return false;
                    
                    const existingStart = timeToMinutes(existingClass.timeStart);
                    const existingEnd = timeToMinutes(existingClass.timeEnd);
                    
                    // 檢查是否有重疊
                    return (newStart < existingEnd && newEnd > existingStart);
                });
            } catch (e) {
                console.error('檢查時間衝突失敗:', e);
                return false;
            }
        }
        
        // 將時間轉換為分鐘數
        function timeToMinutes(timeStr) {
            try {
                const [hours, minutes] = timeStr.split(':').map(Number);
                return hours * 60 + minutes;
            } catch (e) {
                console.error('時間轉換失敗:', e, timeStr);
                return 0;
            }
        }
        
        // 將分鐘數轉換為時間字符串 (確保24小時制格式)
        function minutesToTime(minutes) {
            try {
                const hours = Math.floor(minutes / 60);
                const mins = minutes % 60;
                return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
            } catch (e) {
                console.error('分鐘轉換為時間失敗:', e);
                return '00:00';
            }
        }
        
        // 格式化時間為24小時制
        function formatTime(timeStr) {
            try {
                if (!timeStr) return '00:00';
                
                // 移除所有空格
                timeStr = timeStr.trim();
                
                // 檢查是否已經是正確格式 (HH:MM)
                const timeRegex = /^([01]?[0-9]|2[0-3]):([0-5][0-9])$/;
                if (timeRegex.test(timeStr)) {
                    // 確保小時部分是兩位數
                    const [hours, minutes] = timeStr.split(':');
                    return `${hours.padStart(2, '0')}:${minutes}`;
                }
                
                // 嘗試解析其他格式
                const parts = timeStr.split(':');
                if (parts.length === 2) {
                    let hours = parseInt(parts[0]);
                    let minutes = parseInt(parts[1]);
                    
                    if (isNaN(hours) || isNaN(minutes)) {
                        return '00:00';
                    }
                    
                    // 確保在有效範圍內
                    hours = Math.max(0, Math.min(23, hours));
                    minutes = Math.max(0, Math.min(59, minutes));
                    
                    return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                }
                
                return '00:00';
            } catch (e) {
                console.error('格式化時間失敗:', e);
                return '00:00';
            }
        }
        
        // 渲染課程表
        function renderScheduleTable() {
            try {
                // 確保數據有效
                if (!scheduleData || typeof scheduleData !== 'object') {
                    console.error('scheduleData 無效:', scheduleData);
                    scheduleData = {};
                }
                
                if (!Array.isArray(classrooms)) {
                    console.error('classrooms 不是數組:', classrooms);
                    classrooms = [];
                }
                
                // 清空表格
                scheduleBody.innerHTML = '';
                
                // 獲取所有有課程的教室
                const classroomsWithSchedule = new Set([
                    ...classrooms,
                    ...Object.keys(scheduleData)
                ]);
                
                // 排序教室
                const sortedClassrooms = sortClassrooms(Array.from(classroomsWithSchedule));
                
                // 為每個教室創建一行
                sortedClassrooms.forEach(classroom => {
                    const tr = document.createElement('tr');
                    
                    // 添加教室名稱單元格
                    const tdClassroom = document.createElement('td');
                    tdClassroom.className = 'border border-gray-300 p-2 font-medium bg-gray-100';
                    tdClassroom.textContent = classroom;
                    tr.appendChild(tdClassroom);
                    
                    // 添加每天的單元格
                    for (let day = 0; day < 7; day++) {
                        const td = document.createElement('td');
                        td.className = 'border border-gray-300 p-2 schedule-cell align-top';
                        td.setAttribute('data-classroom', classroom);
                        td.setAttribute('data-day', day);
                        
                        // 獲取該教室該天的課程
                        const classes = scheduleData[classroom]?.[day] || [];
                        
                        // 按時間排序課程
                        classes.sort((a, b) => {
                            const timeA = timeToMinutes(a.timeStart);
                            const timeB = timeToMinutes(b.timeStart);
                            return timeA - timeB;
                        });
                        
                        // 添加課程項目
                        classes.forEach((classItem, index) => {
                            const colorClasses = ['bg-pastel-1', 'bg-pastel-2', 'bg-pastel-3', 'bg-pastel-4', 'bg-pastel-5', 'bg-pastel-6', 'bg-pastel-7'];
                            const colorClass = colorClasses[index % colorClasses.length];
                            
                            // 檢查是否有時間衝突
                            const hasConflict = checkTimeConflict(classroom, day, classItem, index);
                            
                            const classDiv = document.createElement('div');
                            classDiv.className = `class-item ${colorClass} ${hasConflict ? 'conflict' : ''}`;
                            classDiv.setAttribute('data-classroom', classroom);
                            classDiv.setAttribute('data-day', day);
                            classDiv.setAttribute('data-index', index);
                            classDiv.innerHTML = `
                                <div class="font-medium editable" data-field="name" data-classroom="${classroom}" data-day="${day}" data-index="${index}">${classItem.name}</div>
                                <div class="editable" data-field="time" data-classroom="${classroom}" data-day="${day}" data-index="${index}">${classItem.timeStart}-${classItem.timeEnd}</div>
                                <div class="editable" data-field="teacher" data-classroom="${classroom}" data-day="${day}" data-index="${index}">使用人: ${classItem.teacher}</div>
                                <span class="delete-btn" data-classroom="${classroom}" data-day="${day}" data-index="${index}">×</span>
                            `;
                            td.appendChild(classDiv);
                        });
                        
                        tr.appendChild(td);
                    }
                    
                    scheduleBody.appendChild(tr);
                });
                
                // 添加刪除課程的事件監聽器
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const classroom = this.getAttribute('data-classroom');
                        const day = parseInt(this.getAttribute('data-day'));
                        const index = parseInt(this.getAttribute('data-index'));
                        
                        // 刪除課程
                        scheduleData[classroom][day].splice(index, 1);
                        
                        // 如果該天沒有課程了，刪除該天的數據
                        if (scheduleData[classroom][day].length === 0) {
                            delete scheduleData[classroom][day];
                        }
                        
                        // 如果該教室沒有課程了，刪除該教室的數據
                        if (Object.keys(scheduleData[classroom]).length === 0) {
                            delete scheduleData[classroom];
                        }
                        
                        // 更新 UI
                        renderScheduleTable();
                        
                        // 保存數據到本地
                        saveDataToLocal();
                        
                        showNotification('已刪除課程');
                    });
                });
                
                // 添加可編輯字段的事件監聽器
                document.querySelectorAll('.editable').forEach(element => {
                    element.addEventListener('dblclick', function(e) {
                        e.stopPropagation();
                        const field = this.getAttribute('data-field');
                        const classroom = this.getAttribute('data-classroom');
                        const day = parseInt(this.getAttribute('data-day'));
                        const index = parseInt(this.getAttribute('data-index'));
                        
                        const classItem = scheduleData[classroom][day][index];
                        let currentValue = '';
                        
                        switch(field) {
                            case 'name':
                                currentValue = classItem.name;
                                break;
                            case 'time':
                                currentValue = `${classItem.timeStart}-${classItem.timeEnd}`;
                                break;
                            case 'teacher':
                                currentValue = classItem.teacher;
                                break;
                        }
                        
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = field === 'teacher' ? currentValue.replace('使用人: ', '') : currentValue;
                        input.className = 'w-full p-1 border border-blue-500 rounded';
                        
                        // 替換元素
                        this.innerHTML = '';
                        this.appendChild(input);
                        input.focus();
                        input.select();
                        
                        // 處理失去焦點和按下 Enter 鍵的事件
                        const handleUpdate = () => {
                            let newValue = input.value.trim();
                            
                            if (field === 'time') {
                                // 驗證時間格式
                                const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]-([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
                                if (!timeRegex.test(newValue)) {
                                    alert('請輸入有效的時間格式 (HH:MM-HH:MM)！');
                                    input.focus();
                                    return;
                                }
                                
                                const [start, end] = newValue.split('-');
                                classItem.timeStart = formatTime(start);
                                classItem.timeEnd = formatTime(end);
                            } else if (field === 'name') {
                                classItem.name = newValue;
                            } else if (field === 'teacher') {
                                classItem.teacher = newValue;
                            }
                            
                            // 更新 UI
                            renderScheduleTable();
                            
                            // 保存數據到本地
                            saveDataToLocal();
                            
                            showNotification('已更新課程資訊');
                        };
                        
                        input.addEventListener('blur', handleUpdate);
                        input.addEventListener('keydown', function(e) {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                handleUpdate();
                            }
                        });
                    });
                });
                
                // 設置拖曳功能
                setupDragAndDrop();
            } catch (e) {
                console.error('渲染課程表失敗:', e);
                showNotification('渲染課程表失敗', 'error');
            }
        }
        
        // 設置拖曳功能
        function setupDragAndDrop() {
            try {
                document.querySelectorAll('.schedule-cell').forEach(cell => {
                    new Sortable(cell, {
                        group: 'classes',
                        animation: 150,
                        onEnd: function(evt) {
                            const item = evt.item;
                            const fromClassroom = item.getAttribute('data-classroom');
                            const fromDay = parseInt(item.getAttribute('data-day'));
                            const fromIndex = parseInt(item.getAttribute('data-index'));
                            
                            const toCell = evt.to;
                            const toClassroom = toCell.getAttribute('data-classroom');
                            const toDay = parseInt(toCell.getAttribute('data-day'));
                            
                            // 如果目標教室不存在於數據中，初始化它
                            if (!scheduleData[toClassroom]) {
                                scheduleData[toClassroom] = {};
                            }
                            
                            // 如果目標日期不存在於數據中，初始化它
                            if (!scheduleData[toClassroom][toDay]) {
                                scheduleData[toClassroom][toDay] = [];
                            }
                            
                            // 移動課程
                            const classItem = {...scheduleData[fromClassroom][fromDay][fromIndex]};
                            scheduleData[toClassroom][toDay].push(classItem);
                            
                            // 刪除原始課程
                            scheduleData[fromClassroom][fromDay].splice(fromIndex, 1);
                            
                            // 如果原始日期沒有課程了，刪除它
                            if (scheduleData[fromClassroom][fromDay].length === 0) {
                                delete scheduleData[fromClassroom][fromDay];
                            }
                            
                            // 如果原始教室沒有課程了，刪除它
                            if (Object.keys(scheduleData[fromClassroom]).length === 0) {
                                delete scheduleData[fromClassroom];
                            }
                            
                            // 更新 UI
                            renderScheduleTable();
                            
                            // 保存數據到本地
                            saveDataToLocal();
                            
                            showNotification('已移動課程');
                        }
                    });
                });
            } catch (e) {
                console.error('設置拖曳功能失敗:', e);
                showNotification('設置拖曳功能失敗', 'error');
            }
        }
        
        // 添加教室
        addClassroomBtn.addEventListener('click', function() {

        // 添加課程
        addClassBtn.addEventListener('click', function() {

            if (!name) {
                showNotification('請輸入課程名稱！', 'error');
                return;
            }

                timeEnd = classTimeEndInput.value.trim();
                
                const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;

                    showNotification('請輸入有效的時間格式 (HH:MM)！', 'error');

                // 格式化為24小時制

                timeEnd = formatTime(timeEnd);

            classTimeStartInput.value = '';
            classTimeEndInput.value = '';
            classTeacherInput.value = '';

            // 更新 UI
            renderScheduleTable();
            
            // 保存數據到本地
            saveDataToLocal();
            
            showNotification('已新增課程');

        // 儲存資料到雲端
        saveToCloudBtn.addEventListener('click', function() {
            if (confirm('確定要將本地資料儲存到雲端嗎？這將覆蓋雲端的資料。')) {
                saveDataToServer();
            }
        });
        
        // 從雲端讀取資料
        loadFromCloudBtn.addEventListener('click', function() {
            if (confirm('確定要從雲端讀取資料嗎？這將覆蓋本地的資料。')) {
                loadDataFromServer();
            }
        });
        
        // 清除所有本地數據
        clearAllBtn.addEventListener('click', function() {
            if (confirm('確定要清除本地暫存資料嗎？此操作不可恢復！')) {
                try {
                    console.log('開始清除所有本地數據');
                    
                    // 清空數據
                    classrooms = [];
                    scheduleData = {};
                    lastSyncTime = null;
                    
                    console.log('數據已清空，更新 UI');
                    
                    // 更新 UI
                    updateClassroomList();
                    renderScheduleTable();
                    updateSyncStatus();
                    
                    console.log('保存空數據到本地');
                    
                    // 保存空數據到本地
                    localStorage.removeItem('classrooms');
                    localStorage.removeItem('scheduleData');
                    localStorage.removeItem('lastSyncTime');
                    
                    showNotification('已清除本地暫存資料');
                    console.log('所有本地數據已清除完成');

        // 切換時間輸入方式
        timeInputMethods.forEach(radio => {
            radio.addEventListener('change', function() {
                if (this.value === 'manual') {
                    manualTimeInput.classList.remove('hidden');
                    sliderTimeInput.classList.add('hidden');
                } else {
                    manualTimeInput.classList.add('hidden');
                    sliderTimeInput.classList.remove('hidden');
                }
            });
        });
        
        // 時間軸拖曳功能
        function initTimeSlider() {
            try {
                // 初始位置
                let startPos = 33.33; // 8:00
                let endPos = 50; // 12:00
                
                updateSliderPosition(startPos, endPos);
                
                // 開始拖曳
                startHandle.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    isDraggingStart = true;
                });
                
                endHandle.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    isDraggingEnd = true;
                });
                
                // 拖曳中
                document.addEventListener('mousemove', function(e) {
                    if (!isDraggingStart && !isDraggingEnd) return;
                    
                    const rect = sliderContainer.getBoundingClientRect();
                    const containerWidth = rect.width;
                    const offsetX = e.clientX - rect.left;
                    let position = (offsetX / containerWidth) * 100;
                    
                    // 限制在 0-100% 範圍內
                    position = Math.max(0, Math.min(100, position));
                    
                    // 計算對應的分鐘數 (24小時 * 60分鐘 = 1440分鐘)
                    let minutes = Math.round((position / 100) * 1440);
                    
                    // 將分鐘數調整為5分鐘的倍數
                    minutes = Math.round(minutes / 5) * 5;
                    
                    // 重新計算位置百分比
                    position = (minutes / 1440) * 100;
                    
                    if (isDraggingStart) {
                        // 確保開始時間不超過結束時間
                        const endPos = parseFloat(endHandle.style.left) || 100;
                        position = Math.min(position, endPos - 5);
                        
                        startHandle.style.left = position + '%';
                        timeSlider.style.left = position + '%';
                        timeSlider.style.width = (endPos - position) + '%';
                        
                        // 更新顯示的時間
                        sliderTimeStart.textContent = minutesToTime(minutes);
                    } else if (isDraggingEnd) {
                        // 確保結束時間不早於開始時間
                        const startPos = parseFloat(startHandle.style.left) || 0;
                        position = Math.max(position, startPos + 5);
                        
                        endHandle.style.left = position + '%';
                        timeSlider.style.width = (position - startPos) + '%';
                        
                        // 更新顯示的時間
                        sliderTimeEnd.textContent = minutesToTime(minutes);
                    }
                });
                
                // 結束拖曳
                document.addEventListener('mouseup', function() {
                    isDraggingStart = false;
                    isDraggingEnd = false;
                });
                
                // 觸控支持
                startHandle.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    isDraggingStart = true;
                });
                
                endHandle.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    isDraggingEnd = true;
                });
                
                document.addEventListener('touchmove', function(e) {
                    if (!isDraggingStart && !isDraggingEnd) return;
                    if (e.touches.length === 0) return;
                    
                    const touch = e.touches[0];
                    const rect = sliderContainer.getBoundingClientRect();
                    const containerWidth = rect.width;
                    const offsetX = touch.clientX - rect.left;
                    let position = (offsetX / containerWidth) * 100;
                    
                    // 限制在 0-100% 範圍內
                    position = Math.max(0, Math.min(100, position));
                    
                    // 計算對應的分鐘數 (24小時 * 60分鐘 = 1440分鐘)
                    let minutes = Math.round((position / 100) * 1440);
                    
                    // 將分鐘數調整為5分鐘的倍數
                    minutes = Math.round(minutes / 5) * 5;
                    
                    // 重新計算位置百分比
                    position = (minutes / 1440) * 100;
                    
                    if (isDraggingStart) {
                        // 確保開始時間不超過結束時間
                        const endPos = parseFloat(endHandle.style.left) || 100;
                        position = Math.min(position, endPos - 5);
                        
                        startHandle.style.left = position + '%';
                        timeSlider.style.left = position + '%';
                        timeSlider.style.width = (endPos - position) + '%';
                        
                        // 更新顯示的時間
                        sliderTimeStart.textContent = minutesToTime(minutes);
                    } else if (isDraggingEnd) {
                        // 確保結束時間不早於開始時間
                        const startPos = parseFloat(startHandle.style.left) || 0;
                        position = Math.max(position, startPos + 5);
                        
                        endHandle.style.left = position + '%';
                        timeSlider.style.width = (position - startPos) + '%';
                        
                        // 更新顯示的時間
                        sliderTimeEnd.textContent = minutesToTime(minutes);
                    }
                });
                
                document.addEventListener('touchend', function() {
                    isDraggingStart = false;
                    isDraggingEnd = false;
                });
            } catch (e) {
                console.error('初始化時間軸失敗:', e);
                showNotification('初始化時間軸失敗', 'error');
            }
        }
        
        // 更新時間軸位置
        function updateSliderPosition(startPos, endPos) {
            try {
                startHandle.style.left = startPos + '%';
                endHandle.style.left = endPos + '%';
                timeSlider.style.left = startPos + '%';
                timeSlider.style.width = (endPos - startPos) + '%';
                
                // 更新顯示的時間
                const startMinutes = Math.round((startPos / 100) * 24 * 60);
                const endMinutes = Math.round((endPos / 100) * 24 * 60);
                sliderTimeStart.textContent = minutesToTime(startMinutes);
                sliderTimeEnd.textContent = minutesToTime(endMinutes);
            } catch (e) {
                console.error('更新時間軸位置失敗:', e);
            }
        }
    </script>
